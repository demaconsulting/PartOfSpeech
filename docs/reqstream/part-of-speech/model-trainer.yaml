---
# Software Unit Requirements for ModelTrainer
#
# ModelTrainer is a unit directly under the system: the build-time tool (tools/DemaConsulting.PartOfSpeech.Trainer) that
# trains the averaged-perceptron weights that the package embeds, selects every setting on development data only,
# checks that the committed weights are what the committed data and configuration produce, and runs the one held-out
# evaluation of the frozen model behind a development-only selection of the confidence thresholds. Its engine files are
# compiled into the test project, so the tests run the real trainer code on every target framework.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: ModelTrainer Requirements
        requirements:
          - id: PartOfSpeech-ModelTrainer-Deterministic
            title: >-
              Training with the same corpora, configuration and seed shall give a byte-identical uncompressed weights
              image, a different seed shall give a different image, and the image of a small reference run shall equal
              a pinned SHA-256 on every operating system and target framework.
            justification: |
              The check that the committed weights are current retrains the model and compares the result, so the same
              inputs must give the same image everywhere. The shuffle uses an own generator with a fixed reference
              sequence instead of the platform random generator, the arithmetic is integer, and the pinned hashes are
              the golden values that the CI matrix checks on every operating system.
            tests:
              - ModelTrainer_Train_SameInputs_ByteIdenticalImage
              - ModelTrainer_Train_DifferentSeed_DifferentImage
              - ModelTrainer_Train_SmallUnrestrictedRun_MatchesGoldenHash
              - ModelTrainer_Train_SmallRestrictedRun_MatchesGoldenHash
              - DeterministicRandom_NextUInt64_SeedZero_ReferenceSequence
              - DeterministicRandom_Shuffle_Permutation_ReproducibleAndSeedDependent
              - DeterministicRandom_NextInt_NonPositiveBound_Throws

          - id: PartOfSpeech-ModelTrainer-SharedDefinitions
            title: >-
              The tags that the trainer predicts while it trains shall equal the tags of the runtime decoder for the
              same weights, with the embedded lexicon and with unknown words, and for every feature group alone and in
              the combinations of the experiment, the two decoding passes of the right preview group included.
            justification: |
              A trainer that predicts with its own copy of the decoder would train for conditions that the tagger does
              not have. The trainer uses the feature extractor and the lexicon restriction of the library, and the
              parity tests prove that its predictor and the decoder agree, so training and use cannot drift apart.
            tests:
              - ModelTrainer_Predict_RestrictedWithLexicon_MatchesTagDecoder
              - ModelTrainer_Predict_Unrestricted_MatchesTagDecoderWithUnknownWords
              - ModelTrainer_Predict_FeatureGroups_MatchesTagDecoder
              - QuantizedPredictor_RightPreview_SecondPassReadsFirstPassTags

          - id: PartOfSpeech-ModelTrainer-ExactQuantization
            title: >-
              The averaged weights shall be computed and quantized in exact integer arithmetic (equal to a decimal
              oracle, with ties rounded away from zero and values clamped to the 16-bit range), a run whose integer sums
              do not fit their range shall fail with a clear error instead of wrapping around, small weights shall be
              dropped by the pruning threshold, and the resulting file shall load with the quantized weights.
            justification: |
              Floating-point averaging would make the weights depend on the platform and would make the committed file
              impossible to reproduce. Exact integers give the same weights everywhere, but an unnoticed overflow of the
              64-bit sums would silently corrupt them, so the arithmetic is checked. The loader of the library proves
              that the written file holds what the quantization produced.
            tests:
              - AveragedPerceptron_Quantize_RandomUpdates_MatchesDecimalOracle
              - AveragedPerceptron_Quantize_TiesAndClamp_RoundAwayFromZeroAndClamp
              - AveragedPerceptron_Quantize_RangeExceeded_ThrowsClearException
              - AveragedPerceptron_Update_SumsExceedRange_ThrowsClearException
              - AveragedPerceptron_Quantize_PruneThreshold_DropsSmallWeights
              - ModelTrainer_Build_SmallRun_LoadsWithTheQuantizedWeights
              - ModelBuilder_WithTemperature_ReplacesOnlyTheTemperature

          - id: PartOfSpeech-ModelTrainer-CorpusTags
            title: >-
              The trainer shall read the corpus format of the data folder and refuse a token whose tag is unknown, with
              the line number of the row.
            justification: |
              The model must be trained on exactly the data that the configuration describes. A misread corpus would
              silently change the weights and their provenance, so an unknown tag is an error and not a skipped token.
            tests:
              - CorpusReader_Parse_UnknownTag_ThrowsWithLine

          - id: PartOfSpeech-ModelTrainer-CorpusStatusFlags-Kept
            title: >-
              The trainer shall read the optional status flags of a corpus row (`status[+foreign][+mentioned]`), keep
              the flags of every token, and give the same tag and the same masking as for the status without flags; a
              file without flags shall read as before.
            justification: |
              The flags (`mentioned`, `foreign`) are facts about a word. Reading them must not change which tokens
              train and with which tag, and the committed files, which have no flags, must stay valid.
            tests:
              - CorpusReader_Parse_StatusFlags_AreKeptAndDoNotChangeTagsOrMasking
              - CorpusReader_Parse_NoStatusFlags_GivesNoFlags
              - CorpusStatus_TryParse_SplitsStatusAndFlags

          - id: PartOfSpeech-ModelTrainer-CorpusStatusFlags-Validated
            title: >-
              The trainer shall refuse a corpus row whose status is unknown or whose flags are unknown, repeated or out
              of order, with the line number of the row.
            justification: |
              One spelling of every status cell keeps the readers of the format (the trainer and the Python data tools)
              in agreement, so that a malformed file cannot pass through one of them.
            tests:
              - CorpusReader_Parse_InvalidStatusFlags_ThrowsWithLine
              - CorpusReader_Parse_SharedParityCases_AgreeWithPython
              - CorpusStatus_TryParse_SplitsStatusAndFlags

          - id: PartOfSpeech-ModelTrainer-NoSignalTokens
            title: >-
              The trainer shall treat tokens whose tag is a placeholder, masked tokens and, when configured, disputed
              tokens and silver tokens below the probability limit as tokens without a training signal.
            justification: |
              Masking is decided by the status (without its flags) and by the configuration only, so that the selected
              training data is exactly what the configuration describes.
            tests:
              - CorpusReader_Parse_MaskingRules_MarkTokensWithoutSignal

          - id: PartOfSpeech-ModelTrainer-NoSignalStepsAndHistory
            title: >-
              A token without a training signal shall cause no weight update but shall still count as a step of the
              averaging and enter the tag history.
            justification: |
              A masked token is still decoded at run time, so it takes part in the history; the averaging counts
              every step so that the weights do not depend on how many tokens were masked.
            tests:
              - ModelTrainer_Train_MaskedToken_NoUpdateButStepAndHistory

          - id: PartOfSpeech-ModelTrainer-SourceWeights
            title: >-
              The trainer shall repeat the sentences of a source in every epoch as many times as the weight of the
              source says, shall leave a source of weight 0 out, and shall read each committed targeted source
              (imperative, compound, headings), once it is weighted, as sentences without a masked token.
            justification: |
              The weight of a source is a selected training setting, so the epoch must contain exactly the repeats that
              the configuration names. The imperative and compound sources are committed with weight 1, so they are in
              the mix of the shipped weights; the headings sources are committed with weight 0, so they add nothing
              until a run weights them. A run that weights a source must get exactly its sentences, all with a gold tag.
            tests:
              - CorpusReader_LoadSources_Weight_RepeatsSentences
              - CorpusReader_LoadSources_ImperativeSource_ReadsUnmaskedWhenWeighted
              - CorpusReader_LoadSources_TargetedSource_ReadsUnmaskedOnlyWhenWeighted

          - id: PartOfSpeech-ModelTrainer-SourceLimits
            title: >-
              The trainer shall limit the sentences of a source to a maximum or subsample them by a share of 1,000, in
              both cases deterministically.
            justification: |
              A subset must not depend on file order or platform, so that an experiment on a subset can be repeated.
            tests:
              - CorpusReader_Parse_LimitAndSample_AreDeterministic

          - id: PartOfSpeech-ModelTrainer-TrainingSettings
            title: >-
              The minimum feature count, the restriction mode and the history mode shall each change what is trained.
            justification: |
              The selection of these settings on development data is only meaningful if each setting really takes
              effect; a setting that was silently ignored would make the logged comparison meaningless.
            tests:
              - ModelTrainer_Train_MinCount_ShrinksTheModel
              - ModelTrainer_Train_RestrictionAndHistoryModes_ChangeTheImage

          - id: PartOfSpeech-ModelTrainer-DevOnlySelection
            title: >-
              Development evaluation shall read only the two development files (also when the path is spelled with a
              detour; a file or folder that is a symbolic link or junction at or below the data folder shall be
              refused), a file that does not announce a development split shall be refused, training shall accept only
              files below the data folder of the repository (after the path is made absolute and symbolic links and
              junctions are resolved) and refuse held-out sets, evaluation folders and development files there, and no
              other source of the trainer than the guard shall name a held-out set.
            justification: |
              The accuracy that is reported later is only honest if nothing in the model was tuned on the data that
              measures it. A rule in a document is easy to forget, so the rule is code: there is no path through the
              selection and training commands that opens a held-out file, and tests prove the allow-list, the deny-list
              and the absence of other references. The deny-list works on the canonical path, because a rooted path, a
              dotted detour or a link could otherwise point a safe-looking name at held-out data. The one command that
              reads held-out sets is covered by the held-out gate requirement.
            tests:
              - DataGuard_EnsureDevelopmentFile_HeldOutOrOtherFile_Refused
              - DataGuard_EnsureDevelopmentFile_DevelopmentFile_Admitted
              - DataGuard_EnsureDevelopmentFile_LinkInPlaceOfFileOrFolder_Refused
              - DataGuard_EnsureTrainable_HeldOutOrDevelopmentFile_Refused
              - DataGuard_EnsureTrainable_TrainingCorpus_Admitted
              - DataGuard_EnsureTrainable_PathOutsideDataRoot_Refused
              - CorpusReader_LoadSources_RootedPathOutsideData_Refused
              - DataGuard_EnsureTrainable_LinkToHeldOutOrOutsideData_Refused
              - DataGuard_EnsureDevelopmentHeader_NoDevSplitHeader_Throws
              - ModelTrainer_Sources_NoHeldOutPathLiterals
              - HeldOutEvaluation_Sources_NewFilesDoNotSpellHeldOutNames
              - DataGuard_HeldOutFiles_RefusedForDevelopmentEvaluationAndTraining

          - id: PartOfSpeech-ModelTrainer-HeldOutGate-SelectionRequired
            title: >-
              The held-out sets shall be readable only by the evaluation command and only through a validated
              development selection that is for the frozen model, for the committed development files and for the
              registered rule and grid (a held-out reader shall not exist without it).
            justification: |
              Choosing the confidence thresholds on development data and then measuring them once on data that nothing
              touched is only credible if the order cannot be reversed by accident. The held-out readers take the
              validated selection as a required parameter, and the only way to obtain one is the validation, which
              names the hash of the model that is scored, so a changed model or threshold needs a new selection.
            tests:
              - DataGuard_HeldOutFiles_AreFourSetsAndNoDevelopmentFile
              - DataGuard_EnsureHeldOutFile_NoSelection_Throws
              - SelectedOperatingPoints_Validate_ValidArtifact_KeepsSelectedPoints
              - SelectedOperatingPoints_Validate_InconsistentArtifact_Throws
              - SelectedOperatingPoints_Validate_TamperedArtifact_Throws
              - OperatingPointsFile_FormatParseLoad_RoundTripAndValidation

          - id: PartOfSpeech-ModelTrainer-HeldOutGate-SelectionDerivedFromDevelopment
            title: >-
              The gate shall derive the operating points and the development accuracy of the open development split
              from the committed development files for the frozen model, shall require that the selection equals what
              the registered rule selects from them, and shall fail closed when a development file is missing or does
              not have the hash of the data manifest.
            justification: |
              A selection file that is only checked for its shape could be edited to name any grid threshold, or to
              record a development accuracy that silences the accuracy stop condition. The gate therefore scores the
              frozen model on the development data itself, compares the points, the decision counts and the recorded
              accuracy with the derivation, and verifies the actual bytes of the development files against the
              manifest; without that evidence nothing is admitted, so absent data cannot bypass the check.
            tests:
              - SelectedOperatingPoints_Validate_ArbitraryGridThreshold_RefusedAgainstDerivation
              - SelectedOperatingPoints_Validate_NoDerivationOrWrongDevAccuracy_Throws
              - OperatingPointsFile_Expect_MissingOrChangedDevelopmentFile_Throws
              - DevDerivation_PooledCurve_FixtureOutcomes_EqualsSelectionCurve
              - OperatingPointsFile_Load_CommittedSelection_PassesGateForFrozenModel
              - OperatingPointsFile_Load_CommittedSelection_EqualsDevDerivation

          - id: PartOfSpeech-ModelTrainer-HeldOutGate-InputsVerified
            title: >-
              Every held-out file shall be verified against its recorded hash and its header, and the cached mapped
              treebank table against its pinned hash, before it is parsed.
            justification: |
              A wrong or substituted file would give figures for another set than the one that the report names. The
              hash and the announced header are checked first, and the table of the external treebank, which is not
              committed, is pinned by the hash that the committed results record for it.
            tests:
              - DataGuard_EnsureHeldOutHeader_AnnouncedSet_AcceptedOthersRefused
              - HeldOutReader_Read_FixtureRepository_VerifiesHashAndHeader
              - HeldOutReader_ReadUd_FixtureCache_VerifiesPin
              - DataGuard_UdMappedSha256_EqualsHashRecordedInCommittedResults

          - id: PartOfSpeech-ModelTrainer-HeldOutGate-RunsOnce
            title: >-
              The evaluation shall refuse to run when a results file exists and shall claim the run atomically, with an
              exclusively created lock file, before anything is scored.
            justification: |
              The results file is the run-once marker and the lock file claims the run before scoring, so neither a
              second process nor an aborted run can repeat the evaluation unnoticed; both can only be removed by a
              deliberate, recorded act.
            tests:
              - DataGuard_EnsureNotEvaluated_ExistingResultsFile_Throws
              - DataGuard_AcquireRunLock_ExclusiveAndRemovedOnCompletion
              - DataGuard_AcquireRunLock_StaleLock_BlocksUntilDeletedByHand
              - RunLock_Complete_ExistingResultsFile_ThrowsAndKeepsLock
              - DataGuard_AcquireRunLock_ConcurrentAttempts_ExactlyOneWins

          - id: PartOfSpeech-ModelTrainer-HeldOutGate-PreflightCountsOnly
            title: >-
              The evaluation shall be preceded by a pre-flight that reads every input and prints only counts next to the
              documented ones, and shall stop when a count differs.
            justification: |
              The pre-flight finds format and pin problems without showing a label, a prediction or a figure, so a
              defect of the data is found before the one run is spent and without a look at a result.
            tests:
              - HeldOutData_Counts_DocumentedSizes

          - id: PartOfSpeech-ModelTrainer-HeldOutGate-DumpOutsideRepository
            title: >-
              The evaluation shall write per-token records only to a folder outside the repository.
            justification: |
              The per-token records hold the words of the external treebank, which is third-party share-alike text, so
              the folder is checked with links resolved and a folder inside the tree is refused.
            tests:
              - DataGuard_EnsureOutsideRepository_InsideRefused_OutsideAccepted

          - id: PartOfSpeech-ModelTrainer-ConfidenceCurve
            title: >-
              The evaluation shall compute, for the noun-verb decisions, the curve of coverage and harmful errors per
              1,000 answered decisions over a fixed threshold grid and the reliability table of the confidences, and
              shall select the strict and the balanced operating point of the pooled development decisions by the
              pre-registered rule (the first grid threshold that meets the target and the coverage floor, none when no
              threshold qualifies, nothing relaxed).
            justification: |
              Guidance on a confidence threshold must come from a measurement that was defined in advance. The curve and
              the rule are pure functions, checked against hand-computed outcomes, at the boundaries of the targets and
              for the case that nothing qualifies, so the committed thresholds are what the rule says and not what
              looked good after the fact.
            tests:
              - EvalTally_Of_Outcomes_AgreesWithMetricsCompute
              - ConfidenceCurve_Of_HandComputedOutcomes_MatchesExpectedRows
              - ConfidenceCurve_Reliability_Decisions_OneBinEach
              - OperatingPointRule_Select_FirstQualifyingThreshold_StrictAndBalanced
              - OperatingPointRule_Select_BoundariesAndNone_AreNotRelaxed
              - DevSelection_Create_FixtureOutcomes_DeterministicAndConsistent

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics-SameDefinitions
            title: >-
              The held-out evaluation shall judge every set with the definitions of the development evaluation (one
              definition of a decision and of a harmful error).
            justification: |
              A held-out number is only comparable with the development number when both are made by the same code, so
              the held-out views reuse the decoder output and the judgment of the development evaluation and the gold
              classes of the development views.
            tests:
              - HeldOutEvaluator_Score_FixtureSets_ViewsAndReports
              - DevSets_GoldClassOf_EveryTag_CollapsesToTenClassesAndOther

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics-ParsesFormats
            title: >-
              The held-out evaluation shall parse the held-out formats (the shape probe with its braces and target
              index, the convention-mapped treebank table with its document, gold v2 with status and agreement) and
              shall refuse a malformed row, including a negative or non-numeric target index, with a data error that
              names the row.
            justification: |
              A malformed row that is silently skipped, or that ends the run with an unrelated exception, would change a
              headline figure or hide the cause; the parsers refuse every bad row with the documented data error.
            tests:
              - HeldOutSets_ParseProbe_Rows_BracesRemovedAndValidated
              - HeldOutSets_ParseProbe_NegativeOrNonNumericTargetIndex_ThrowsDataError
              - HeldOutSets_ParseUd_MappedTable_ReadsTagsRulesAndDocuments
              - DevSets_ParseGold_StatusAndAgreement_Carried

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics-Intervals
            title: >-
              The held-out evaluation shall report every set and view with the accuracy, the accuracy on
              lexicon-ambiguous tokens, the harmful errors per 1,000 decisions, the calibration error, the mean
              log-likelihood and the
              precision and recall of every tag, each with a 95 percent bootstrap interval over documents (over rows or
              sentences where a set has none).
            justification: |
              A figure of a small or clustered set is only meaningful with its uncertainty. The bootstrap is
              deterministic for a seed and resamples whole documents because the tokens of a document are not
              independent; every statistic is evaluated on the same draws, and the machine-readable results carry all of
              them for every set.
            tests:
              - ClusterBootstrap_Intervals_TiedBetterDeterministicAndSingleItemClusters
              - EvaluationReport_Summarize_TagFiguresAndIntervals_ArePresent
              - OperatingPointsFile_ParseResults_CommittedResults_HaveTagFiguresAndIntervalsForEverySet

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics-PairedDifference
            title: >-
              The held-out evaluation shall report, for every operating point of every set, the coverage, the harmful
              errors per 1,000 answered decisions with an interval and the paired difference of the harmful errors per
              1,000 decisions against 0.45 on the same decisions with an interval.
            justification: |
              Whether a threshold removes harmful errors is a statement about the same decisions at two thresholds, so
              the difference is evaluated on each draw of the bootstrap and not as a difference of two intervals.
            tests:
              - EvaluationReport_Summarize_OperatingPoint_PairedDifferenceAgainstReference

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics-StopConditions
            title: >-
              The held-out evaluation shall check the stop conditions of the protocol against the results and name every
              one that fired.
            justification: |
              The stop conditions are written before the run and tested on crafted results, so a model or data defect is
              declared by rule and not by a reading of the figures after the fact.
            tests:
              - EvaluationReport_Tripwires_EachConditionFiresAlone

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics-Throughput
            title: >-
              The held-out evaluation shall measure the throughput of the default tagger on the open test sentences.
            justification: |
              The speed of the shipped tagger is reported next to its accuracy; it is a timing, measured separately and
              not a result of the model.
            tests:
              - HeldOutEvaluator_Throughput_Fixture_IsPositive

          - id: PartOfSpeech-ModelTrainer-EvaluationReport-Deterministic
            title: >-
              The reports of the development selection and of the held-out run shall be deterministic Markdown and
              canonical JSON generated from the results (the same results give the same text).
            justification: |
              The committed figures are the record of the evaluation, so they are generated and not typed, and a report
              that changed between two renderings of the same results could not be reviewed.
            tests:
              - HeldOutEvaluator_Score_FixtureSets_ViewsAndReports
              - DevSelection_Create_FixtureOutcomes_DeterministicAndConsistent
              - OperatingPointsFile_FormatResults_RoundTrip

          - id: PartOfSpeech-ModelTrainer-EvaluationReport-DisclosureNotice
            title: >-
              The Markdown report of the development selection and the Markdown report of the held-out run shall carry,
              directly after their introduction, the disclosure paragraph that is read from the committed file
              `docs/evaluation/disclosure.md` (which for the embedded model states that the record belongs to a later
              held-out evaluation of the model family, a disclosed look at sets that earlier models were scored on, and
              points to the run log), and shall carry no notice when the file is missing or blank, the text being read
              and not typed into the renderer.
            justification: |
              A record is read on its own. A held-out result that does not say that the held-out sets were already
              seen for earlier models of the family would read as a first look at unseen data. The text describes one
              model and one evaluation, so it lives in a reviewable file that must be revised or removed for any later
              evaluation of a different model, and the generic renderer cannot give a later record a stale claim. The
              notice is part of the generated Markdown only, so the JSON artifacts and their pinned hashes do not
              change, and the committed reports carry the text at the position where a regeneration puts it.
            tests:
              - HeldOutEvaluator_Score_FixtureSets_ViewsAndReports
              - DevSelection_Create_FixtureOutcomes_DeterministicAndConsistent
              - EvaluationReport_ReadDisclosure_CollapsesLineBreaksAndTreatsMissingOrBlankAsNone
              - DataGuard_CommittedReports_CarryCommittedDisclosureWhereGeneratorPutsIt

          - id: PartOfSpeech-ModelTrainer-EvaluationReport-JsonComplete
            title: >-
              The JSON results shall hold every figure of the Markdown report for every set and view, including the
              precision and recall of every tag with their intervals and the cells of the noun-verb confusion.
            justification: |
              A consistency check and a consumer can only rely on the machine-readable record if it is as complete
              as the text, so the report and the JSON are generated from the same summary of each set.
            tests:
              - EvaluationReport_Summarize_TagFiguresAndIntervals_ArePresent
              - OperatingPointsFile_ParseResults_CommittedResults_HaveTagFiguresAndIntervalsForEverySet

          - id: PartOfSpeech-ModelTrainer-EvaluationReport-NoTreebankText
            title: >-
              The reports shall publish no word, sentence or sentence id of the external treebank.
            justification: |
              The treebank is licensed share-alike and may not enter the repository, so only aggregates and tag-level
              confusion are written.
            tests:
              - HeldOutEvaluator_Score_FixtureSets_ViewsAndReports

          - id: PartOfSpeech-ModelTrainer-EvaluationReport-PerTokenDump
            title: >-
              The per-token dump shall have one record for each token with all 17 tag probabilities.
            justification: |
              The comparison with other taggers outside the repository needs the probabilities of every token of the one
              run, so the dump is complete and carries the same judgment as the report.
            tests:
              - EvaluationReport_WriteDump_Tokens_HeaderAndRows

          - id: PartOfSpeech-ModelTrainer-CheckDetectsStaleWeights
            title: >-
              The check shall report a committed weights file as current when its uncompressed image equals the fresh
              training (whether it is stored compressed or not), and as stale, missing or invalid otherwise.
            justification: |
              The build retrains the model and compares it with the committed file; the comparison must accept the
              compressed committed file, whose bytes depend on the platform, and must never take a perturbed, absent or
              damaged file for a current one.
            tests:
              - ModelBuilder_Check_CommittedFile_DetectsStaleMissingAndInvalid

          - id: PartOfSpeech-ModelTrainer-ProtectsShippedWeights
            title: >-
              A training run with experiment overrides or calibration shall be refused unless an output file is named,
              so that an experiment never overwrites the shipped weights.
            justification: |
              The default output of `train` is the embedded weights file, which `train --check` and the tests hold
              equal to `training.json`. A casual experiment such as `train --epochs 3` must not be able to replace it
              silently; the rule is code instead of a sentence in the README.
            tests:
              - OutputGuard_EnsureExplicitOutput_ExperimentWithoutOutput_Throws
              - OutputGuard_EnsureExplicitOutput_ExperimentWithOutputOrDefaultRun_Admitted

          - id: PartOfSpeech-ModelTrainer-Configuration
            title: >-
              The training configuration shall be a valid, canonical file that names existing training corpora (the
              imperative and compound sources with a positive weight, and the headings sources with weight 0, so that
              they are committed and not trained on), and a misspelled setting or an out-of-range value shall be an
              error.
            justification: |
              The configuration is the record of what the committed weights were trained from. A silently ignored
              misspelling would train something other than what the file says, and a file that the tool rewrites in
              another form would make every configuration update noisy. A corpus that is committed but not trained on
              would have to be visible as such, with weight 0, so that the weights stay reproducible from the file.
            tests:
              - ConfigFile_Parse_CommittedConfiguration_ValidAndCanonical
              - ConfigFile_Parse_UnknownMemberOrBadRange_Throws

          - id: PartOfSpeech-ModelTrainer-DevMetrics
            title: >-
              The evaluation shall score a tagger on the development sets with accuracy, harmful noun-verb errors,
              log-likelihood and calibration error, shall read the gold development targets with the class mapping (a
              negative or out-of-sentence target index is an error), and shall compare two models with a paired
              bootstrap by document that reports a tie when the interval contains zero.
            justification: |
              The settings of the model are selected by these numbers, so the numbers must be right: the metrics are
              checked against hand-computed outcomes, and the bootstrap against lists with a known difference and with
              none. The run log rows must have one cell for each column of their table.
            tests:
              - DevSets_ParseGoldDev_Fixture_ReadsTargetsAndMapsClasses
              - DevSets_ParseGoldDev_InvalidTarget_Throws
              - Metrics_Compute_KnownOutcomes_ExpectedNumbers
              - Metrics_Judge_TinyTagger_CorrectAndNounVerbError
              - Bootstrap_Compare_IdenticalLists_ZeroDifferenceTied
              - Bootstrap_Compare_BetterList_PositiveDifferenceExcludesZero
              - DevEvaluator_EvaluateOpen_FixtureSentences_OneOutcomePerToken
              - RunLog_Row_Summary_HasOneCellPerHeaderColumn

          - id: PartOfSpeech-ModelTrainer-GlossaryExperiment
            title: >-
              The dev-only glossary experiment shall draw simulated glossary hints reproducibly (gold hints, or another
              allowed tag for wrong ones), with the allowed tags of a token computed for the token as written exactly as
              the runtime decoder does (capitalization included), shall change the trained model only when hints are
              used, and its decoder shall equal the plain predictor without hints and shall follow a hard or a very
              large hint.
            justification: |
              The decision between a trained glossary feature and a score boost rests on this experiment, so the
              experiment must be reproducible, must not disturb the features of the model (the plain run keeps its
              pinned
              hash), must judge eligibility with the same candidates that the tagger has, and its decoder must agree
              with the real one before the comparison means anything.
            tests:
              - GlossaryTraining_Draw_NoWrongHints_HintsAreGoldAndReproducible
              - GlossaryTraining_Draw_AllHintsWrong_HintIsAnotherAllowedTag
              - GlossaryTraining_Draw_CapitalizedToken_UsesShapeCandidatesOfTheOriginalToken
              - GlossaryTraining_Draw_CorpusSample_EligibilityMatchesRuntimeMask
              - ModelTrainer_Train_GlossaryHints_ChangeTheImage
              - GlossaryFeatures_Append_InBucketSpaceAndDependOnHintAndHistory
              - HintedPredictor_NoHints_MatchesQuantizedPredictor
              - HintedPredictor_HardHintAndHugeBoost_FollowTheHint
              - ModelTrainer_Train_AllGroupsWithGlossaryHints_FitsTheBucketBuffer
              - HintedPredictor_FeatureGroups_MatchesQuantizedPredictor
              - HintedPredictor_FeatureGroupsWithHints_DecodeEveryTokenAndFollowHardHints
              - HintedPredictor_RightPreviewGroup_IsRefused
              - GlossaryProbeAndEvaluation_GroupedModel_UseTheConfiguredTagger

          - id: PartOfSpeech-ModelTrainer-GlossaryEvaluation
            title: >-
              The dev-only glossary evaluation shall read nothing but the two development sets, shall draw its
              simulated glossaries (compounds, single words, acronyms, wrong entries) reproducibly from a seed, shall
              give every scored token to exactly one category, shall count confident noun-verb swaps against the
              no-glossary decision count also when a hard constraint leaves one candidate, shall find no difference
              before the first match of a sentence, and shall apply its two decision rules exactly as written (the soft
              strength rule of the run log, which fixes the default strength and whose outcome on the recorded cells is
              the library constant, a member of the evaluated grid, with the first-run rule kept as the historical
              decision, and the non-head rule).
            justification: |
              The default soft strength and the rule for the non-head tokens of a term are decisions that rest on this
              evaluation, so it must be reproducible (a re-run must print the shipped default), must not touch
              held-out data, must measure the harm of a wrong
              entry honestly (a hard constraint leaves one candidate, which the plain harm metric does not count), and
              must not drift from the library constant that it justifies.
            tests:
              - GoldTarget_Lemma_IsParsedAndOptional
              - GlossaryEvaluation_StrengthGrid_ContainsTheDefaultSoftStrength
              - GlossaryEvaluation_ChooseSoftStrength_LargestPassingStrengthWins
              - GlossaryEvaluation_ChooseSoftStrength_ConditionsAndNonePasses
              - GlossaryEvaluation_ChooseSoftStrength_RecordedCells_EqualsTheDefaultSoftStrength
              - GlossaryEvaluation_ChooseFirstRunSoftStrength_PicksSmallestWithinTolerance
              - GlossaryEvaluation_ChooseFirstRunSoftStrength_ConditionsAndNoneAdmissible
              - GlossaryEvaluation_ChooseNonHeadRule_BarNeedsGainIntervalAndNoLoss
              - GlossaryEvaluation_CompoundCandidates_SpansEndInNounAndAreDistinct
              - GlossaryEvaluation_DrawTerms_DeterministicSeededAndWrongEntriesDiffer
              - GlossaryEvaluation_ToEntries_UnrepresentableTermsAreSkipped
              - GlossaryEvaluation_RunSystem_CategoriesPartitionEveryScoredToken
              - GlossaryEvaluation_RunScenario_ConfidentSwapsFlipsAndBaselineDenominator
              - GlossaryEvaluation_AcronymEntries_AllCapitalNounsWithLexiconHomograph
              - GlossaryEvaluation_Run_TinyData_ReportsEveryScenarioDeterministically
              - GlossaryEvaluation_UsesOnlyDevData_NoPathParameterAndNoFileAccess

          - id: PartOfSpeech-ModelTrainer-ShapesDevEvaluation
            title: >-
              The shapes development evaluation shall parse the hard-shape development set (shape, role, target
              index, lemma and origin of every sentence) and refuse a sentence whose judged word is missing, outside
              the sentence, disputed, not a noun or verb, or in the wrong class for its shape and role; shall score the
              judged word of every item through the real decoder and report, per shape and pooled, the target-token
              accuracy, the harmful errors and the harmful errors per 1,000 noun-verb decisions and the control
              accuracy; and shall render the same Markdown for the same results.
            justification: |
              The hard-shape set is the development measure for the noun-verb confusions that the held-out error
              analysis found, so a malformed item must stop the run instead of shifting a figure, the figures must come
              from the same decoder and the same harm definition as every other development number, and a re-run on the
              same model and file must give the same text so that a recorded baseline can be compared. The tokens of
              the file follow the corpus tokenization of the library tokenizer, which the evaluation relies on.
            tests:
              - ShapesDevSets_Parse_ValidFile_ReturnsItems
              - ShapesDevSets_Parse_DisputedNonTargetAndFlags_Accepted
              - ShapesDevSets_Parse_MissingTarget_Throws
              - ShapesDevSets_Parse_WrongClassForShapeAndRole_Throws
              - ShapesDevSets_Parse_DisputedTarget_Throws
              - ShapesDevSets_Parse_TargetNotATokenIndex_Throws
              - ShapesDevSets_Parse_UnknownShapeRoleOriginOrDuplicateId_Throws
              - ShapesDevSets_Parse_AuthoredOriginAndDocumentMismatch_Throws
              - ShapesDevSets_Parse_UnknownTag_Throws
              - ShapesDevSets_Shapes_AreTheFiveHardShapesWithTheirClasses
              - ShapesDevEvaluator_Evaluate_TinyTagger_ReportsPerShapeCounts
              - ShapesDevEvaluator_Summarize_GroupsByShapeAndRoleAndRefusesBadInput
              - ShapesDevReport_Render_SameResult_IsDeterministicMarkdown
              - ShapesDevReport_Interval_KnownCounts_MatchesWilsonScore
              - Tokenizer_Tokenize_ShapesSentences_ReproducesStoredTokens

          - id: PartOfSpeech-ModelTrainer-ShapesDevTranches
            title: >-
              The shapes development evaluation shall read the standard tranche and the hard tranche of the set from
              their own files, mark every item with the tranche of its file (never by a comment), and report, per shape
              and pooled, the standard tranche (in the same text as before), the hard tranche and both together, with a
              shape without items shown by dashes.
            justification: |
              The hard tranche is selected differently from the standard one on purpose, so its figures must be read
              separately: a pooled figure alone would hide that the hard tranche is where the headroom is. The standard
              section keeps its text so that the recorded baseline stays comparable, the tranche of an item cannot be
              forged by editing a file, and the zero-item shape (the hard tranche has no n-measure cases) must read as
              absent, not as a perfect score.
            tests:
              - ShapesDevSets_Parse_Tranche_IsGivenByTheCallerAndNotByTheContent
              - DevSets_ReadShapesDev_EachTranche_ReadsItsOwnFileAndMarksItems
              - DevSets_ReadShapesDev_HardMissingOrWrongHeader_ThrowsAndStandardStillReads
              - ShapesDevEvaluator_SummarizeTranches_PerTrancheAndCombined
              - ShapesDevEvaluator_EvaluateTranches_TinyTagger_ScoresEachTrancheAndCombined
              - ShapesDevReport_RenderTranches_StandardUnchangedThenHardThenCombined
              - ShapesDevReport_Render_StandardSection_HasNoTrancheNameInItsHeading

          - id: PartOfSpeech-ModelTrainer-ShapesDevNewTranches
            title: >-
              The shapes development evaluation shall read the three single-shape tranches (`compound-head.tsv`,
              `headings.tsv` and `named-state.tsv`) from their own files through the development guard, check their
              header, ids, shape, kind and gold tag, score a heading item by its exact tag (noun NOUN, imperative VERB,
              proper PROPN, so a common noun answered PROPN is wrong) and the other two tranches by class, report per
              tranche the target accuracy, the harmful errors, the harmful errors per 1,000 noun-verb decisions, the
              target items wrong at a confidence of at least 0.95 and the control accuracy, accept `--tranche
              compound-head|headings|named-state|new` (an explicit file that is missing is an error, a missing file
              under `new` is noted), and leave the standard, hard and combined output unchanged.
            justification: |
              The new tranches measure shapes that the older sections do not, so each gets a section of its own and the
              older text stays byte for byte what the recorded baselines show. The heading shape would look better than
              it is if scored by class, because a capitalized common noun tagged as a name is still a noun, so its score
              is by the exact tag. A wrong answer with a confidence of 0.95 or more is the figure that a consumer who
              trusts the strict threshold meets, so it is counted beside the harmful errors. A missing file must stop an
              explicit request but not the pooled `new` run, so the guard and the command refuse a file of another
              tranche and never read the sources or leakage files.
            tests:
              - ShapesDevSets_Parse_NewTranches_ValidFiles_ReturnItemsWithKindAndGoldTag
              - ShapesDevSets_Parse_NewTranches_InvalidItems_AreRefused
              - DevSets_ReadShapesDev_NewTranches_ReadOwnFileAndMarkItems
              - DevSets_ReadShapesDev_NewTranches_FileOfAnotherTranche_Throws
              - ShapesDevTrancheEvaluator_Summarize_ConfidentWrong_CountsFromTheLimit
              - ShapesDevTrancheEvaluator_Evaluate_Headings_ScoredByExactTag
              - ShapesDevTrancheEvaluator_Summarize_InconsistentInput_Throws
              - ShapesDevReport_RenderTranche_CompoundHead_PrintsSectionAndTable
              - ShapesDevReport_RenderTranche_Headings_PrintsRowsOfTheKinds
              - ShapesDevReport_RenderTranche_NoItems_PrintsDashes
              - ShapesDevCommand_EnsureSelection_Value_AcceptedOrRefused
              - ShapesDevCommand_Run_ExplicitNewTranche_ScoresItAloneAndMissingFileIsAnError
              - ShapesDevCommand_Run_New_ScoresPresentTranchesAndNotesMissingFiles
              - ShapesDevCommand_Run_StandardHardBoth_OutputIsUnchangedByTheNewFiles

          - id: PartOfSpeech-ModelTrainer-ShapesDevFollowupTranches
            title: >-
              The shapes development evaluation shall read the two follow-up tranches (`compound-head-2.tsv`, with the
              shape and the class scoring of `compound-head`, and `headings-2.tsv`, with the shape, the kinds and the
              exact-tag scoring of `headings`) from their own files through the development guard, tell a tranche from
              the first tranche of its shape by the corpus marker and by the longest sentence-id prefix, report them
              with the same rows as the first-generation tranches, accept
              `--tranche compound-head-2|headings-2|followup`
              (an explicit file that is missing is an error, a missing file under `followup` is noted) without changing
              the output of `new`, and let `eval-arm` write, behind the existing members, a block `shapesFollowup` with
              the rows of the four compound and heading tranches, the pooled primary figure (harmful errors per 1,000
              noun-verb decisions over the enlarged compound dev and all heading dev items, with the counts it is
              derived from, and the target items wrong at a confidence of at least 0.95 summed over the four
              tranches), the pooled imperative headings, the pooled compound controls and the two new file hashes in
              `inputs`.
            justification: |
              The follow-up measure is bigger than the first one, but it is the same kind of measure, so it reuses the
              shapes, the scoring and the report rows instead of a second definition, and it never changes an older
              byte: the older tranches, the `new` selection and the `shapesNew` block keep what the recorded baselines
              show, so a result file of the earlier experiment stays readable. A file of the first tranche at the path
              of the second would be scored as the wrong tranche, and the id prefix of the second tranche starts with
              the prefix of the first, so the marker and the longer prefix decide. The primary figure carries its counts
              so that the analysis can re-derive it, and a mismatch is then visible.
            tests:
              - ShapesDevSets_Parse_FollowupTranches_ValidFiles_ReturnItemsOfTheirOwnTranche
              - DevSets_ReadShapesDev_FollowupTranches_OwnFileOwnMarkerAndLongestIdPrefix
              - ShapesDevCommand_EnsureSelection_Value_AcceptedOrRefused
              - ShapesDevCommand_Run_Followup_ScoresBothTranchesAndNewDoesNotIncludeThem
              - ArmEvaluation_Evaluate_TinyWeights_WritesTheResultSchema

          - id: PartOfSpeech-ModelTrainer-ShapesDevIsDevelopmentOnly
            title: >-
              The files of the hard-shape development set (the standard and the hard tranche, the three single-shape
              tranches and the two follow-up tranches) shall be readable only
              through their own guard (exactly those seven paths, also when spelled with a detour, refused when a link
              lies on the way, and a header that announces a development split), shall not be in the
              two-file development allow-list or the held-out list, shall be refused for training, and no source of the
              trainer other than the guard shall name a held-out set.
            justification: |
              The set exists to select settings, so nothing may train on it, and it must never be mistaken for a
              held-out figure. Giving it a guard of its own keeps the statement that development evaluation reads the
              two development files true for every other command, and keeps the held-out gate unable to open it, so the
              probe that shares its shapes stays evaluation only. The hard tranche is a second file of the same set and
              gets the same guard, not a new rule.
            tests:
              - DataGuard_EnsureShapesDevelopmentFile_ShapesDevelopmentFile_Admitted
              - DataGuard_EnsureShapesDevelopmentFile_OtherFile_Refused
              - DataGuard_EnsureShapesDevelopmentFile_NewTrancheFile_Admitted
              - DataGuard_EnsureShapesDevelopmentFile_NewTrancheSourcesAndLeakage_Refused
              - DataGuard_EnsureShapesDevelopmentFile_LinkInPlaceOfFileOrFolder_Refused
              - DataGuard_EnsureDevelopmentFile_LinkInPlaceOfFileOrFolder_Refused
              - DataGuard_ShapesDevelopmentFile_OnlyItsOwnGuardAdmitsIt
              - DataGuard_EnsureDevelopmentFile_HeldOutOrOtherFile_Refused
              - DataGuard_EnsureTrainable_HeldOutOrDevelopmentFile_Refused
              - DataGuard_EnsureOutsideData_InsideDataFolder_RefusedAndOutsideAdmitted
              - DevSets_ReadShapesDev_HeaderWithoutDevSplit_Throws
              - DevSets_ReadShapesDev_MissingAndValidFile_ThrowsAndReads
              - ModelTrainer_Sources_NoHeldOutPathLiterals

          - id: PartOfSpeech-ModelTrainer-FeatureGroups
            title: >-
              The trainer shall take the context feature groups of a model from the configuration (`features`, a list of
              group names, empty by default, and `previewFolds`, 2 to 10 with a default of 5) or from the options
              `--features` (`none`, or group names in the long or the short form, in any order and case) and
              `--preview-folds`, refuse an unknown or repeated group, train the groups with the shared feature
              extractor, write the groups as the mask of the weights header with the feature set version that follows
              from it, leave the feature settings out of the file form of a configuration while they are at their
              defaults, and, with no group, give the same bytes as the training did before the groups existed. The
              groups are `positionCues` (F1), `clauseCues` (F2), `rightPreview` (F3), `inflection` (F4) and
              `titleCaseLine` (F5).
            justification: |
              The experiment on context features compares arms that differ only in their groups, so the groups are
              settings of the training like every other one, are checked where they are read, and are recorded in the
              weights file that the runtime reads. The shipped model must stay what the committed data and configuration
              produce, so a run without a group takes none of the group code paths and the golden hashes of the
              reference runs do not move; the committed configuration keeps its form for the same reason.
            tests:
              - TrainingConfig_ParseFeatureList_ValidValue_CanonicalOrder
              - TrainingConfig_ParseFeatureList_InvalidValue_Throws
              - TrainingConfig_Features_DefaultsResolveValidateAndClone
              - ModelBuilder_Encode_FeatureGroups_WritesMaskAndFeatureSetVersion
              - ConfigFile_Features_OmittedByDefaultAndRoundTripped
              - ConfigFile_Parse_CommittedConfiguration_ValidAndCanonical
              - PerceptronTrainer_Train_NoGroups_IsTheShippedTraining
              - ModelTrainer_Train_SmallUnrestrictedRun_MatchesGoldenHash
              - ModelTrainer_Train_SmallRestrictedRun_MatchesGoldenHash

          - id: PartOfSpeech-ModelTrainer-Jackknife
            title: >-
              For the right preview group the trainer shall train every sentence in two passes on one weight table (the
              first without the preview features, the second with the first-pass tags of the next two tokens), shall
              take those tags from fold models that did not see the sentence (folds from groups of documents that
              share a sentence key, the lower-case letters and numbers of the text (Unicode categories L and N, taken by
              code point as the leakage check takes them), directly or through other documents, so that a document is
              never split and an exact duplicate sentence under two document ids
              never lands in two folds; the fold of a group is the hash of its smallest document id, the same for
              every seed; fold models trained without the group on the other groups, the settings and the seed of
              the run, and decoding their held-out fold with the quantized weights and the lexicon restriction like
              the first pass of the decoder),
              and shall refuse sentences that fill fewer than two folds or preview tags that miss a sentence.
            justification: |
              A model that is trained on first-pass tags of its own training sentences sees tags that are better than
              the ones it gets on new text. Fold models give tags of the quality that the runtime has, and the replay
              test proves that the tags are what an independent run of the same fold models produces. A fold model that
              trained on the text of a sentence under another document id would tag it better than it tags new text, so
              duplicates are kept together and no held-out sentence key occurs in the training set of its fold model.
              One table for both passes keeps the format and the size of the model, and the first pass stays usable at
              run time.
            tests:
              - Jackknife_Partition_ByDocumentHash_NeverSplitsADocumentAndIsStable
              - Jackknife_Partition_DuplicateSentenceInTwoDocuments_LandsInOneFold
              - Jackknife_Partition_TransitiveChain_LandsInOneFold
              - Jackknife_Partition_WithDuplicates_IsDeterministicAndIndependentOfOrderAndSeed
              - Jackknife_GroupDocuments_NoDuplicates_EveryDocumentIsItsOwnGroup
              - Jackknife_SentenceKey_SharedParityCases_AgreeWithPython
              - Jackknife_Compute_DuplicatesAcrossDocuments_FoldModelNeverSeesAHeldOutSentenceKey
              - Jackknife_Compute_TagsEachFoldWithAModelThatDidNotSeeIt
              - Jackknife_Compute_OneDocument_Throws
              - PerceptronTrainer_Train_RightPreview_TrainsBothPassesOnOneTable

          - id: PartOfSpeech-ModelTrainer-ArmEvaluation
            title: >-
              The command `eval-arm` shall score a trained weights file through the real decoder on the standard and the
              hard tranche of the shapes development set (per shape and pooled, with the per-item outcomes of the target
              items), on the compound-head, headings and named-state tranches (per tranche the row of its shape with the
              target items that are wrong at a confidence of at least 0.95, the kinds of the headings, and the pooled
              harmful errors per 1,000 noun-verb decisions and the confident wrong answers of the compound-head and the
              headings tranche together) and on the two follow-up tranches (the block `shapesFollowup`, see
              `PartOfSpeech-ModelTrainer-ShapesDevFollowupTranches`), on the open and the gold v2 development splits and
              on the mapped development part of the external
              treebank (read from the local cache with a pinned SHA-256), measure the size of the file and the
              single-thread throughput of the default tagger (one warm-up pass, five timed passes, the median), and
              write one JSON result in schema 1 with the groups of the weights header and the hashes of the inputs,
              the new members only added behind the existing ones.
            justification: |
              The experiment decides on figures that must come from one definition of a harmful error and from the same
              decoder that users run, for every arm in the same way. A fixed schema lets the analysis script read the
              runs without interpretation, the hashes tie a result to its inputs, and a treebank table that does not
              match its pin is refused so that a stale local cache cannot be scored.
            tests:
              - ArmEvaluation_Evaluate_TinyWeights_WritesTheResultSchema
              - ArmEvaluation_Evaluate_NoGroupsAndBadInput_BehavesAsSpecified
              - HeldOutEvaluator_Throughput_TimedPasses_AtLeastOneAndPositiveRate
              - DevSets_ReadUdDev_MissingOrChangedTable_RefusedAndPinnedTableRead

          - id: PartOfSpeech-ModelTrainer-ArmEvaluationIsDevelopmentOnly
            title: >-
              The command `eval-arm` shall have no option that names a data file, shall read the development sets
              through their guarded readers only, shall refuse a weights file or a result file inside the data folder or
              the data tooling folder (which holds the treebank cache), and shall have no path to the held-out sets
              (the open and gold v2 test splits, the shape probe, the challenge set and the test part of the treebank):
              their files are refused by every guard it uses and its sources do not mention the held-out readers.
            justification: |
              The experiment selects with development data, and the held-out sets have already been seen for the
              model family, so the command that is run fifty times must be structurally unable to read one or to
              overwrite one with its result. The refusal is code and is pinned by a test, not a rule in a document.
            tests:
              - DataGuard_EnsureArmFile_DataFolders_Refused
              - DataGuard_EnsureArmFile_OrdinaryLocations_Admitted
              - ArmEvaluation_HeldOutSets_AreUnreachable
              - DevSets_ReadUdDev_MissingOrChangedTable_RefusedAndPinnedTableRead
              - ModelTrainer_Sources_NoHeldOutPathLiterals
