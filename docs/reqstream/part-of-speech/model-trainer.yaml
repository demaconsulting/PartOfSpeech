---
# Software Unit Requirements for ModelTrainer
#
# ModelTrainer is a unit directly under the system: the build-time tool (tools/DemaConsulting.PartOfSpeech.Trainer) that
# trains the averaged-perceptron weights that the package embeds, selects every setting on development data only,
# checks that the committed weights are what the committed data and configuration produce, and runs the one held-out
# evaluation of the frozen model behind a development-only selection of the confidence thresholds. Its engine files are
# compiled into the test project, so the tests run the real trainer code on every target framework.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: ModelTrainer Requirements
        requirements:
          - id: PartOfSpeech-ModelTrainer-Deterministic
            title: >-
              Training with the same corpora, configuration and seed shall give a byte-identical uncompressed weights
              image, a different seed shall give a different image, and the image of a small reference run shall equal
              a pinned SHA-256 on every operating system and target framework.
            justification: |
              The check that the committed weights are current retrains the model and compares the result, so the same
              inputs must give the same image everywhere. The shuffle uses an own generator with a fixed reference
              sequence instead of the platform random generator, the arithmetic is integer, and the pinned hashes are
              the golden values that the CI matrix checks on every operating system.
            tests:
              - ModelTrainer_Train_SameInputs_ByteIdenticalImage
              - ModelTrainer_Train_DifferentSeed_DifferentImage
              - ModelTrainer_Train_SmallUnrestrictedRun_MatchesGoldenHash
              - ModelTrainer_Train_SmallRestrictedRun_MatchesGoldenHash
              - DeterministicRandom_NextUInt64_SeedZero_ReferenceSequence
              - DeterministicRandom_Shuffle_Permutation_ReproducibleAndSeedDependent
              - DeterministicRandom_NextInt_NonPositiveBound_Throws

          - id: PartOfSpeech-ModelTrainer-SharedDefinitions
            title: >-
              The tags that the trainer predicts while it trains shall equal the tags of the runtime decoder for the
              same weights, with the embedded lexicon and with unknown words.
            justification: |
              A trainer that predicts with its own copy of the decoder would train for conditions that the tagger does
              not have. The trainer uses the feature extractor and the lexicon restriction of the library, and the
              parity tests prove that its predictor and the decoder agree, so training and use cannot drift apart.
            tests:
              - ModelTrainer_Predict_RestrictedWithLexicon_MatchesTagDecoder
              - ModelTrainer_Predict_Unrestricted_MatchesTagDecoderWithUnknownWords

          - id: PartOfSpeech-ModelTrainer-ExactQuantization
            title: >-
              The averaged weights shall be computed and quantized in exact integer arithmetic (equal to a decimal
              oracle, with ties rounded away from zero and values clamped to the 16-bit range), a run whose integer sums
              do not fit their range shall fail with a clear error instead of wrapping around, small weights shall be
              dropped by the pruning threshold, and the resulting file shall load with the quantized weights.
            justification: |
              Floating-point averaging would make the weights depend on the platform and would make the committed file
              impossible to reproduce. Exact integers give the same weights everywhere, but an unnoticed overflow of the
              64-bit sums would silently corrupt them, so the arithmetic is checked. The loader of the library proves
              that the written file holds what the quantization produced.
            tests:
              - AveragedPerceptron_Quantize_RandomUpdates_MatchesDecimalOracle
              - AveragedPerceptron_Quantize_TiesAndClamp_RoundAwayFromZeroAndClamp
              - AveragedPerceptron_Quantize_RangeExceeded_ThrowsClearException
              - AveragedPerceptron_Update_SumsExceedRange_ThrowsClearException
              - AveragedPerceptron_Quantize_PruneThreshold_DropsSmallWeights
              - ModelTrainer_Build_SmallRun_LoadsWithTheQuantizedWeights
              - ModelBuilder_WithTemperature_ReplacesOnlyTheTemperature

          - id: PartOfSpeech-ModelTrainer-CorpusRules
            title: >-
              The trainer shall read the corpus format of the data folder and refuse an unknown tag, shall give tokens
              without a training signal (masked tokens and, when configured, disputed tokens and low-probability silver
              tokens) no update but still count them as steps and put them in the tag history, and shall repeat the
              sentences of a source as many times as its weight says and limit or subsample a source deterministically.
            justification: |
              The model must be trained on exactly the data that the configuration describes, and a masked token is
              still decoded at run time, so it takes part in the history. A misread corpus would silently change the
              weights and their provenance.
            tests:
              - ModelTrainer_Train_MaskedToken_NoUpdateButStepAndHistory
              - CorpusReader_Parse_MaskingRules_MarkTokensWithoutSignal
              - CorpusReader_Parse_LimitAndSample_AreDeterministic
              - CorpusReader_Parse_UnknownTag_ThrowsWithLine
              - CorpusReader_LoadSources_Weight_RepeatsSentences

          - id: PartOfSpeech-ModelTrainer-TrainingSettings
            title: >-
              The minimum feature count, the restriction mode and the history mode shall each change what is trained.
            justification: |
              The selection of these settings on development data is only meaningful if each setting really takes
              effect; a setting that was silently ignored would make the logged comparison meaningless.
            tests:
              - ModelTrainer_Train_MinCount_ShrinksTheModel
              - ModelTrainer_Train_RestrictionAndHistoryModes_ChangeTheImage

          - id: PartOfSpeech-ModelTrainer-DevOnlySelection
            title: >-
              Development evaluation shall read only the two development files (also when the path is spelled with a
              detour), a file that does not announce a development split shall be refused, training shall accept only
              files below the data folder of the repository (after the path is made absolute and symbolic links and
              junctions are resolved) and refuse held-out sets, evaluation folders and development files there, and no
              other source of the trainer than the guard shall name a held-out set.
            justification: |
              The accuracy that is reported later is only honest if nothing in the model was tuned on the data that
              measures it. A rule in a document is easy to forget, so the rule is code: there is no path through the
              selection and training commands that opens a held-out file, and tests prove the allow-list, the deny-list
              and the absence of other references. The deny-list works on the canonical path, because a rooted path, a
              dotted detour or a link could otherwise point a safe-looking name at held-out data. The one command that
              reads held-out sets is covered by the held-out gate requirement.
            tests:
              - DataGuard_EnsureDevelopmentFile_HeldOutOrOtherFile_Refused
              - DataGuard_EnsureDevelopmentFile_DevelopmentFile_Admitted
              - DataGuard_EnsureTrainable_HeldOutOrDevelopmentFile_Refused
              - DataGuard_EnsureTrainable_TrainingCorpus_Admitted
              - DataGuard_EnsureTrainable_PathOutsideDataRoot_Refused
              - CorpusReader_LoadSources_RootedPathOutsideData_Refused
              - DataGuard_EnsureTrainable_LinkToHeldOutOrOutsideData_Refused
              - DataGuard_EnsureDevelopmentHeader_NoDevSplitHeader_Throws
              - ModelTrainer_Sources_NoHeldOutPathLiterals
              - HeldOutEvaluation_Sources_NewFilesDoNotSpellHeldOutNames
              - DataGuard_HeldOutFiles_RefusedForDevelopmentEvaluationAndTraining

          - id: PartOfSpeech-ModelTrainer-HeldOutGate
            title: >-
              The held-out sets shall be readable only by the evaluation command and only with a development selection
              that is valid for the frozen model, for the committed development files and for the pre-registered rule
              (a held-out reader shall not exist without it); every held-out file shall be verified against the
              recorded hash and its header (and the cached mapped treebank table against its pinned hash) before it is
              parsed, the evaluation shall refuse to run twice (the run shall be claimed atomically before scoring),
              shall be preceded by a check that prints counts only, and shall write per-token records only outside the
              repository.
            justification: |
              Choosing the confidence thresholds on development data and then measuring them once on data that nothing
              touched is only credible if the order cannot be reversed or repeated by accident. The held-out readers
              take the validated selection as a required parameter, the selection names the hash of the model that is
              scored and must equal what the registered rule selects from the development data, so a changed model or
              threshold needs a new selection; the results file is the run-once marker and an exclusively created lock
              file claims the run before scoring, so neither a second process nor an aborted run can repeat it
              unnoticed, and both can only be removed by a deliberate, recorded act; the pre-flight finds format and
              pin problems
              without showing a label, a prediction or a figure; and the per-token records, which can hold third-party
              text, cannot land in the tree.
            tests:
              - DataGuard_HeldOutFiles_AreFourSetsAndNoDevelopmentFile
              - DataGuard_EnsureHeldOutFile_NoSelection_Throws
              - SelectedOperatingPoints_Validate_ValidArtifact_KeepsSelectedPoints
              - SelectedOperatingPoints_Validate_InconsistentArtifact_Throws
              - SelectedOperatingPoints_Validate_TamperedArtifact_Throws
              - SelectedOperatingPoints_Validate_ArbitraryGridThreshold_RefusedAgainstDerivation
              - DevDerivation_PooledCurve_FixtureOutcomes_EqualsSelectionCurve
              - DataGuard_EnsureHeldOutHeader_AnnouncedSet_AcceptedOthersRefused
              - DataGuard_EnsureNotEvaluated_ExistingResultsFile_Throws
              - DataGuard_AcquireRunLock_ExclusiveAndRemovedOnCompletion
              - DataGuard_AcquireRunLock_StaleLock_BlocksUntilDeletedByHand
              - RunLock_Complete_ExistingResultsFile_ThrowsAndKeepsLock
              - DataGuard_AcquireRunLock_ConcurrentAttempts_ExactlyOneWins
              - DataGuard_EnsureOutsideRepository_InsideRefused_OutsideAccepted
              - HeldOutReader_Read_FixtureRepository_VerifiesHashAndHeader
              - HeldOutReader_ReadUd_FixtureCache_VerifiesPin
              - DataGuard_UdMappedSha256_EqualsHashRecordedInCommittedResults
              - OperatingPointsFile_FormatParseLoad_RoundTripAndValidation
              - OperatingPointsFile_Load_CommittedSelection_PassesGateForFrozenModel
              - OperatingPointsFile_Load_CommittedSelection_EqualsDevDerivation

          - id: PartOfSpeech-ModelTrainer-ConfidenceCurve
            title: >-
              The evaluation shall compute, for the noun-verb decisions, the curve of coverage and harmful errors per
              1,000 answered decisions over a fixed threshold grid and the reliability table of the confidences, and
              shall select the strict and the balanced operating point of the pooled development decisions by the
              pre-registered rule (the first grid threshold that meets the target and the coverage floor, none when no
              threshold qualifies, nothing relaxed).
            justification: |
              Guidance on a confidence threshold must come from a measurement that was defined in advance. The curve and
              the rule are pure functions, checked against hand-computed outcomes, at the boundaries of the targets and
              for the case that nothing qualifies, so the committed thresholds are what the rule says and not what
              looked good after the fact.
            tests:
              - EvalTally_Of_Outcomes_AgreesWithMetricsCompute
              - ConfidenceCurve_Of_HandComputedOutcomes_MatchesExpectedRows
              - ConfidenceCurve_Reliability_Decisions_OneBinEach
              - OperatingPointRule_Select_FirstQualifyingThreshold_StrictAndBalanced
              - OperatingPointRule_Select_BoundariesAndNone_AreNotRelaxed
              - DevSelection_Create_FixtureOutcomes_DeterministicAndConsistent

          - id: PartOfSpeech-ModelTrainer-HeldOutMetrics
            title: >-
              The held-out evaluation shall judge every set with the definitions of the development evaluation (one
              definition of a decision and of a harmful error), shall parse the held-out formats (shape probe with its
              braces, the convention-mapped treebank table with its document, gold v2 with status and agreement) and
              refuse malformed rows, shall report each set and view with 95 percent bootstrap intervals over documents
              (over rows where a set has none) and the paired difference of every operating point against 0.45, and
              shall check the stop conditions of the protocol.
            justification: |
              A held-out number is only comparable with the development number when both are made by the same code, and
              a malformed row that is silently skipped would change a headline figure. The bootstrap is deterministic
              for a seed, resamples whole documents because the tokens of a document are not independent, and pairs the
              operating point with the 0.45 point on the same decisions. The stop conditions are written before the run
              and tested on crafted results, so a defect is declared by rule.
            tests:
              - HeldOutSets_ParseProbe_Rows_BracesRemovedAndValidated
              - HeldOutSets_ParseUd_MappedTable_ReadsTagsRulesAndDocuments
              - DevSets_ParseGold_StatusAndAgreement_Carried
              - DevSets_GoldClassOf_EveryTag_CollapsesToTenClassesAndOther
              - ClusterBootstrap_Intervals_TiedBetterDeterministicAndSingleItemClusters
              - EvaluationReport_Summarize_OperatingPoint_PairedDifferenceAgainstReference
              - EvaluationReport_Tripwires_EachConditionFiresAlone
              - HeldOutEvaluator_Score_FixtureSets_ViewsAndReports
              - HeldOutEvaluator_Throughput_Fixture_IsPositive

          - id: PartOfSpeech-ModelTrainer-EvaluationReport
            title: >-
              The reports of the development selection and of the held-out run shall be deterministic Markdown and
              canonical JSON generated from the results (the same results give the same text), shall publish no word,
              sentence or sentence id of the external treebank, and the per-token dump shall have one record for each
              token with all 17 tag probabilities.
            justification: |
              The committed figures are the record of the evaluation, so they are generated and not typed, and a report
              that changed between two renderings of the same results could not be reviewed. The treebank is licensed
              share-alike and may not enter the repository, so only aggregates and tag-level confusion are written.
            tests:
              - HeldOutEvaluator_Score_FixtureSets_ViewsAndReports
              - DevSelection_Create_FixtureOutcomes_DeterministicAndConsistent
              - EvaluationReport_WriteDump_Tokens_HeaderAndRows
              - OperatingPointsFile_FormatResults_RoundTrip

          - id: PartOfSpeech-ModelTrainer-CheckDetectsStaleWeights
            title: >-
              The check shall report a committed weights file as current when its uncompressed image equals the fresh
              training (whether it is stored compressed or not), and as stale, missing or invalid otherwise.
            justification: |
              The build retrains the model and compares it with the committed file; the comparison must accept the
              compressed committed file, whose bytes depend on the platform, and must never take a perturbed, absent or
              damaged file for a current one.
            tests:
              - ModelBuilder_Check_CommittedFile_DetectsStaleMissingAndInvalid

          - id: PartOfSpeech-ModelTrainer-ProtectsShippedWeights
            title: >-
              A training run with experiment overrides or calibration shall be refused unless an output file is named,
              so that an experiment never overwrites the shipped weights.
            justification: |
              The default output of `train` is the embedded weights file, which `train --check` and the tests hold
              equal to `training.json`. A casual experiment such as `train --epochs 3` must not be able to replace it
              silently; the rule is code instead of a sentence in the README.
            tests:
              - OutputGuard_EnsureExplicitOutput_ExperimentWithoutOutput_Throws
              - OutputGuard_EnsureExplicitOutput_ExperimentWithOutputOrDefaultRun_Admitted

          - id: PartOfSpeech-ModelTrainer-Configuration
            title: >-
              The training configuration shall be a valid, canonical file that names existing training corpora, and a
              misspelled setting or an out-of-range value shall be an error.
            justification: |
              The configuration is the record of what the committed weights were trained from. A silently ignored
              misspelling would train something other than what the file says, and a file that the tool rewrites in
              another form would make every configuration update noisy.
            tests:
              - ConfigFile_Parse_CommittedConfiguration_ValidAndCanonical
              - ConfigFile_Parse_UnknownMemberOrBadRange_Throws

          - id: PartOfSpeech-ModelTrainer-DevMetrics
            title: >-
              The evaluation shall score a tagger on the development sets with accuracy, harmful noun-verb errors,
              log-likelihood and calibration error, shall read the gold development targets with the class mapping (a
              negative or out-of-sentence target index is an error), and shall compare two models with a paired
              bootstrap by document that reports a tie when the interval contains zero.
            justification: |
              The settings of the model are selected by these numbers, so the numbers must be right: the metrics are
              checked against hand-computed outcomes, and the bootstrap against lists with a known difference and with
              none. The run log rows must have one cell for each column of their table.
            tests:
              - DevSets_ParseGoldDev_Fixture_ReadsTargetsAndMapsClasses
              - DevSets_ParseGoldDev_InvalidTarget_Throws
              - Metrics_Compute_KnownOutcomes_ExpectedNumbers
              - Metrics_Judge_TinyTagger_CorrectAndNounVerbError
              - Bootstrap_Compare_IdenticalLists_ZeroDifferenceTied
              - Bootstrap_Compare_BetterList_PositiveDifferenceExcludesZero
              - DevEvaluator_EvaluateOpen_FixtureSentences_OneOutcomePerToken
              - RunLog_Row_Summary_HasOneCellPerHeaderColumn

          - id: PartOfSpeech-ModelTrainer-GlossaryExperiment
            title: >-
              The dev-only glossary experiment shall draw simulated glossary hints reproducibly (gold hints, or another
              allowed tag for wrong ones), with the allowed tags of a token computed for the token as written exactly as
              the runtime decoder does (capitalization included), shall change the trained model only when hints are
              used, and its decoder shall equal the plain predictor without hints and shall follow a hard or a very
              large hint.
            justification: |
              The decision between a trained glossary feature and a score boost rests on this experiment, so the
              experiment must be reproducible, must not disturb the shipped feature set (the plain run keeps its pinned
              hash), must judge eligibility with the same candidates that the tagger has, and its decoder must agree
              with the real one before the comparison means anything.
            tests:
              - GlossaryTraining_Draw_NoWrongHints_HintsAreGoldAndReproducible
              - GlossaryTraining_Draw_AllHintsWrong_HintIsAnotherAllowedTag
              - GlossaryTraining_Draw_CapitalizedToken_UsesShapeCandidatesOfTheOriginalToken
              - GlossaryTraining_Draw_CorpusSample_EligibilityMatchesRuntimeMask
              - ModelTrainer_Train_GlossaryHints_ChangeTheImage
              - GlossaryFeatures_Append_InBucketSpaceAndDependOnHintAndHistory
              - HintedPredictor_NoHints_MatchesQuantizedPredictor
              - HintedPredictor_HardHintAndHugeBoost_FollowTheHint

          - id: PartOfSpeech-ModelTrainer-GlossaryEvaluation
            title: >-
              The dev-only glossary evaluation shall read nothing but the two development sets, shall draw its
              simulated glossaries (compounds, single words, acronyms, wrong entries) reproducibly from a seed, shall
              give every scored token to exactly one category, shall count confident noun-verb swaps against the
              no-glossary decision count also when a hard constraint leaves one candidate, shall find no difference
              before the first match of a sentence, and shall apply its two decision rules exactly as written (the soft
              strength rule of the run log, which fixes the default strength and whose outcome on the recorded cells is
              the library constant, a member of the evaluated grid, with the first-run rule kept as the historical
              decision, and the non-head rule).
            justification: |
              The default soft strength and the rule for the non-head tokens of a term are decisions that rest on this
              evaluation, so it must be reproducible (a re-run must print the shipped default), must not touch
              held-out data, must measure the harm of a wrong
              entry honestly (a hard constraint leaves one candidate, which the plain harm metric does not count), and
              must not drift from the library constant that it justifies.
            tests:
              - GoldTarget_Lemma_IsParsedAndOptional
              - GlossaryEvaluation_StrengthGrid_ContainsTheDefaultSoftStrength
              - GlossaryEvaluation_ChooseSoftStrength_LargestPassingStrengthWins
              - GlossaryEvaluation_ChooseSoftStrength_ConditionsAndNonePasses
              - GlossaryEvaluation_ChooseSoftStrength_RecordedCells_EqualsTheDefaultSoftStrength
              - GlossaryEvaluation_ChooseFirstRunSoftStrength_PicksSmallestWithinTolerance
              - GlossaryEvaluation_ChooseFirstRunSoftStrength_ConditionsAndNoneAdmissible
              - GlossaryEvaluation_ChooseNonHeadRule_BarNeedsGainIntervalAndNoLoss
              - GlossaryEvaluation_CompoundCandidates_SpansEndInNounAndAreDistinct
              - GlossaryEvaluation_DrawTerms_DeterministicSeededAndWrongEntriesDiffer
              - GlossaryEvaluation_ToEntries_UnrepresentableTermsAreSkipped
              - GlossaryEvaluation_RunSystem_CategoriesPartitionEveryScoredToken
              - GlossaryEvaluation_RunScenario_ConfidentSwapsFlipsAndBaselineDenominator
              - GlossaryEvaluation_AcronymEntries_AllCapitalNounsWithLexiconHomograph
              - GlossaryEvaluation_Run_TinyData_ReportsEveryScenarioDeterministically
              - GlossaryEvaluation_UsesOnlyDevData_NoPathParameterAndNoFileAccess
