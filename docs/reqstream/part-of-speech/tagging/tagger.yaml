---
# Software Unit Requirements for Tagger
#
# The Tagger unit is the public entry point: it loads models, tags text, sentences and token lists, and returns the
# results.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: Tagging Requirements
        sections:
          - title: Tagger Requirements
            requirements:
              - id: PartOfSpeech-Tagging-Tagger-TagText
                title: >-
                  A text shall be tagged as one result per sentence, each with one tagged token per token, in text
                  order.
                justification: |
                  This is the main use of the library.
                tests:
                  - Tagger_Tag_Text_ReturnsTaggedSentences

              - id: PartOfSpeech-Tagging-Tagger-TagTokens
                title: >-
                  A list of tokens shall be tagged as one sentence with one tag per token, and an empty list shall give
                  an empty sentence.
                justification: |
                  Callers that bring their own tokens use this entry point, and an empty list is valid input.
                tests:
                  - Tagger_Tag_Tokens_ReturnsTags
                  - Tagger_Tag_Tokens_EmptyTokens_ReturnsEmptySentence

              - id: PartOfSpeech-Tagging-Tagger-ResultsCarryOffsets
                title: >-
                  The text of every tagged token shall equal the original text at the offset and length of the token.
                justification: |
                  Callers use the offsets to find the token in their own text.
                tests:
                  - Tagger_Tag_Text_TokenTextMatchesOffsets

              - id: PartOfSpeech-Tagging-Tagger-Load
                title: >-
                  A tagger shall be created from a weights stream (of a model with or without feature groups), with the
                  embedded lexicon or with a lexicon stream, and a null stream or options that are out of range shall
                  be refused.
                justification: |
                  Callers choose their own weights and may bring a lexicon of their own; bad arguments are programming
                  errors to report at creation time.
                tests:
                  - Tagger_Load_NullStreams_Throw
                  - Tagger_Load_InvalidOptions_Throw
                  - Tagger_Load_CustomLexicon_IsUsed
                  - Tagger_Load_ModelWithFeatureGroups_TagsWithTheGroups

              - id: PartOfSpeech-Tagging-Tagger-Default
                title: >-
                  Reading the default tagger shall return a tagger that uses the embedded weights and lexicon and tags
                  text without a file, every read shall return the same instance, and threads that read it at the same
                  time shall receive that one instance.
                justification: |
                  Most callers want the shipped model without managing a stream; a shared instance avoids loading the
                  model again, and services read the property from many threads on the first request.
                tests:
                  - Tagger_Default_EmbeddedModel_ReturnsSameWorkingTagger
                  - Tagger_Default_ParallelAccess_ReturnsSingleInstance
                  - Tagger_Default_ObviousSentences_AreTaggedCorrectly

              - id: PartOfSpeech-Tagging-Tagger-ThreadSafe
                title: >-
                  Tagging in parallel from many threads shall give the same results as tagging in sequence, and the
                  results shall not change after they are returned.
                justification: |
                  Services share one tagger between requests and hand its results to other threads.
                tests:
                  - Tagger_Tag_Parallel_MatchesSequential
                  - Tagger_Tag_ResultsAreImmutable

              - id: PartOfSpeech-Tagging-Tagger-InputValidation
                title: >-
                  A null text, sentence or token list shall be refused with an ArgumentNullException, and a constraint
                  list whose length differs from the number of tokens shall be refused with an ArgumentException.
                justification: |
                  These are programming errors, and a constraint list that does not line up with the tokens would apply
                  constraints to the wrong words.
                tests:
                  - Tagger_Tag_NullArguments_Throw
                  - Tagger_Tag_ConstraintLengthMismatch_Throws

              - id: PartOfSpeech-Tagging-Tagger-AnyText
                title: >-
                  Tagging shall not fail for any text or token string, including text with an unpaired surrogate (which
                  is not valid UTF-16), and the text, offsets and lengths of the tagged tokens shall stay those of the
                  input.
                justification: |
                  Services tag text from outside; a request must never fail because of its characters, and callers
                  highlight the text with the offsets.
                tests:
                  - Tagger_Tag_Text_UnpairedSurrogate_DoesNotThrow
                  - Tagger_Tag_Tokens_UnpairedSurrogate_DoesNotThrow
                  - Tagger_Tag_Text_ValidSurrogatePair_RoundTrips

              - id: PartOfSpeech-Tagging-Tagger-Options
                title: >-
                  The number of alternatives that a result carries per token shall not exceed the maximum that the
                  options give.
                justification: |
                  Callers that need only the best tag should not pay for a list of alternatives, and callers that want
                  many must be able to ask.
                tests:
                  - Tagger_Options_MaxAlternativesLimitsAlternatives

              - id: PartOfSpeech-Tagging-Tagger-Alternatives
                title: >-
                  The alternatives of a token shall not contain its tag, and their probabilities together with the
                  confidence shall not exceed one.
                justification: |
                  Callers add up and compare the probabilities, so they must describe separate, non-overlapping
                  readings.
                tests:
                  - Tagger_Tag_Alternatives_ExcludeBestAndSumWithConfidence

              - id: PartOfSpeech-Tagging-Tagger-Glossary
                title: >-
                  A text, a sentence or a token list shall also be taggable with a glossary: a null glossary shall be
                  refused with an ArgumentNullException, a constraint list whose length differs from the number of
                  tokens shall be refused with an ArgumentException, an empty glossary shall give the result of tagging
                  without one, and the matches that were found shall be applied to the tags and attached to the
                  results.
                justification: |
                  The glossary belongs to the call and not to the tagger, so every call that takes one needs the same
                  argument checks as the other calls, must leave a caller without terms unaffected, and must hand the
                  matches to the caller together with the tags.
                tests:
                  - Tagger_Tag_Glossary_NullArguments_Throw
                  - Tagger_Tag_Glossary_ConstraintLengthMismatch_Throws
                  - Tagger_Tag_Glossary_EmptyGlossary_GivesTheResultWithoutGlossary
                  - Tagger_Tag_Glossary_Match_IsAppliedAndReported

              - id: PartOfSpeech-Tagging-Tagger-KnownWord
                title: >-
                  A tagged token shall report whether the lexicon of the tagger has an entry for its spelling after the
                  tagger folds it (Unicode normalization, typographic quotes, dashes and the ellipsis mapped to ASCII)
                  and lower-cases it, and the flag shall not change when a glossary or a constraint decides the tag of
                  the token, so that the head word of a hard glossary entry that the lexicon does not list is reported
                  as not known and as constrained.
                justification: |
                  A rule checker treats a tag on a word that the lexicon does not list as inconclusive, but must still
                  accept a tag that its own dictionary decided; both facts have to be readable on the token.
                tests:
                  - Tagger_Tag_KnownWord_LexiconSpelling_IsTrueAndUnlistedSpellingIsFalse
                  - Tagger_Tag_KnownWord_CaseVariant_UsesTheLexiconLookup
                  - Tagger_Tag_KnownWord_FoldedSpelling_UsesTheLexiconLookup
                  - Tagger_Tag_KnownWord_GlossaryHeadNotInLexicon_IsUnknownButConstrained
                  - Tagger_Tag_KnownWord_GlossaryHeadInLexicon_IsKnownAndConstrained
                  - Tagger_Tag_Glossary_EmptyGlossary_GivesTheResultWithoutGlossary

              - id: PartOfSpeech-Tagging-Tagger-Margin
                title: >-
                  A tagged token shall report a margin that is its confidence minus the probability of its best
                  alternative; when the token has no alternative the margin shall be the smallest value that the
                  confidence allows, which is 1 for a token with one allowed tag, and a default token shall have a
                  margin of 0.
                justification: |
                  A rule checker needs to tell a close call from a clear decision with one number; the margin must be
                  exact when an alternative is listed and never larger than the true value when it is not, so that it
                  cannot make a guess look safe.
                tests:
                  - Tagger_Tag_Margin_SeveralAlternatives_IsConfidenceMinusRunnerUp
                  - Tagger_Tag_Margin_OneAlternative_IsConfidenceMinusRunnerUp
                  - Tagger_Tag_Margin_NoAlternativesRequested_IsTheSmallestMarginTheConfidenceAllows
                  - Tagger_Tag_Margin_SingleAllowedTag_IsOne
                  - Tagger_Tag_Margin_TiedTags_IsZero
                  - Tagger_Tag_DefaultToken_HasNoMarginAndIsNotKnown

              - id: PartOfSpeech-Tagging-Tagger-PossibleTags
                title: >-
                  A lookup of one word shall report, from the lexicon of the tagger and without a sentence, a model or a
                  glossary, either the tags that the lexicon lists for the folded, lower-cased word (the empty set when
                  the word is not a spelling; the default mode) or exactly the tags that the tagger allows for that word
                  as a token on its own (all 17 tags when the word is not a spelling); the word shall be folded like a
                  token of the tagger, so that letter case, typographic quotes and dashes and the Unicode composition
                  of the word never change the result; the known flag of the result shall equal that of the token; and
                  the lookup shall be safe from any number of threads, also while other threads tag.
                justification: |
                  A rule checker that asks whether a word may be a verb needs the dictionary answer for the word alone,
                  and needs it to agree with what the tagger would allow for the same spelling in a sentence, or its
                  conclusions contradict the tagger. The lexicon of the tagger is the one that decides, so a tagger
                  with a custom lexicon answers from its own. The lookup runs for many words of a text, so it must be
                  safe for the parallel use that tagging already supports.
                tests:
                  - Tagger_GetPossibleTags_DefaultMode_IsLexiconOnly
                  - Tagger_GetPossibleTags_Case_IgnoresLetterCase
                  - Tagger_GetPossibleTags_ShapeRules_ExtendTheLexiconTags
                  - Tagger_GetPossibleTags_FoldedSpelling_UsesTheTaggerLookup
                  - Tagger_GetPossibleTags_CustomLexicon_UsesItsOwnLexicon
                  - Tagger_GetPossibleTags_Glossary_DoesNotChangeTheResult
                  - Tagger_GetPossibleTags_ConcurrentCalls_GiveTheSameResultsAsOneThread
                  - Tagger_GetPossibleTags_Span_EqualsStringOverload
                  - Tagger_GetPossibleTags_Analyses_KnownWordHasThemAndUnknownOrHugeWordsHaveNone

              - id: PartOfSpeech-Tagging-Tagger-PossibleTagsInput
                title: >-
                  A lookup shall refuse a null word, an empty word, a word that contains white space and a mode or tag
                  that is not a defined value, each with the documented exception, shall not fail for a word with an
                  unpaired surrogate (which counts as U+FFFD, like in a token), and shall answer a word that has more
                  characters than the longest spelling of the lexicon has bytes, and therefore cannot be a spelling,
                  without an error and without growing the per-thread buffers beyond what a word of that many
                  characters needs, whatever the length of the word.
                justification: |
                  The lexicon holds no phrases, so a text with white space can only be answered wrongly as unknown; the
                  caller must split the text into tokens (or use a glossary for a term). Text that a caller did not
                  validate, including a very long string, must neither crash the lookup nor make a service keep
                  megabytes of buffers per thread.
                tests:
                  - Tagger_GetPossibleTags_NullWord_Throws
                  - Tagger_GetPossibleTags_EmptyOrWhiteSpace_Throws
                  - Tagger_GetPossibleTags_WhiteSpaceRule_EqualsTokenizerRule
                  - Tagger_GetPossibleTags_UndefinedModeOrTag_Throws
                  - Tagger_GetPossibleTags_Span_InvalidInput_Throws
                  - Tagger_GetPossibleTags_UnpairedSurrogate_DoesNotThrow
                  - Tagger_GetPossibleTags_VeryLongWord_IsNotRecognizedWithoutError
                  - Tagger_GetPossibleTags_WordsWithManyCharacters_NeverGrowTheWorkspaceBeyondTheLongestSpelling
                  - TagDecoder_GetPossibleTags_HugeAsciiInput_AnswersWithoutGrowingTheWorkspace

              - id: PartOfSpeech-Tagging-Tagger-WordAnalyses
                title: >-
                  The result of a lookup shall tell whether the word is recognized (as a spelling, as a compound head
                  or not at all) separately from its tags, so that an unrecognized word cannot be mistaken for a word
                  with no tags; for a recognized word it shall list every analysis (base word, tag and features in
                  Universal Dependencies notation) of the matched spelling in a fixed order, report the tags of the
                  result that no analysis names, and give an empty list and no tags with an analysis when the lexicon
                  has no analyses.
                justification: |
                  A rule checker must tell a word that the lexicon has never seen from a word that it knows but lists
                  no tag for, and must read the base word and the form of each reading (the third person of a verb, a
                  plural noun) to decide whether a word is an inflected form of another. The lexicon is a restriction
                  list, not a gold dictionary, so the tags that no analysis supports (added by a rule, by a list or by
                  corpus counts) are reported instead of hidden. A lexicon that was built without an analyses table is
                  valid and must answer with tags only.
                tests:
                  - Tagger_GetPossibleTags_Tests_ReturnsBothAnalysesInDocumentedOrder
                  - Tagger_GetPossibleTags_UnknownWord_IsNotRecognizedNotEmptyKnown
                  - Tagger_GetPossibleTags_TagsWithoutAnalysis_ReportsRuleAndAttestedTags
                  - Tagger_GetPossibleTags_ClosedClassAndIrregularForms_HaveTheBaseWord
                  - Tagger_GetPossibleTags_CustomLexiconWithoutAnalyses_HasNoAnalyses
                  - Tagger_GetPossibleTags_CustomLexiconWithAnalyses_ReportsItsAnalyses
                  - WordTags_Equality_FollowsTheLookupResult
                  - WordAnalysis_Members_WorkOnRealAndDefaultValues

              - id: PartOfSpeech-Tagging-Tagger-CompoundHead
                title: >-
                  A word that is not a lexicon spelling but is a hyphenated compound (it contains the hyphen-minus and
                  no empty part between hyphens) shall match as a compound head when its last part, looked up as a
                  whole and nowhere else, is a spelling, and shall then carry the analyses of that last part; a word
                  that is a spelling shall always match as a spelling; a compound without a spelling as last part, a
                  word with an empty part and a word that contains a dash character (which folds to two hyphens)
                  shall not be recognized; the same rule shall apply to a word that has more characters than the
                  longest spelling of the lexicon has bytes (only the lookup of the whole word is skipped, only the last
                  part is folded, and the per-thread buffers do not grow beyond what a word of that many characters
                  needs); and the tags of the result shall always be those of the whole word
                  as the tagger sees it, so that a compound head never narrows the tags or changes the known flag.
                justification: |
                  Compound words (well-tested, pre-flight) are common in technical text and the lexicon lists few of
                  them; their last part tells what kind of word they are. The tagger itself looks up the whole token
                  only and has no hyphen rule, so the lookup must not give the tags a meaning that the tagger does not
                  share: the head is extra evidence, never a restriction. The rule must be the same for a long word
                  and a short one, or the answer would depend on the length of the prefix.
                tests:
                  - Tagger_GetPossibleTags_CompoundHead_UsesLastPartAndTagsStayTheWholeToken
                  - Tagger_GetPossibleTags_CompoundHead_HeadIsTheLastPartOnly
                  - Tagger_GetPossibleTags_CompoundWhole_PrefersTheSpelling
                  - Tagger_GetPossibleTags_CompoundHead_Malformed_IsNotRecognized
                  - Tagger_GetPossibleTags_CompoundHead_TooLongWhole_UsesTheLastPart
                  - Tagger_GetPossibleTags_CompoundHead_TooLongWhole_Otherwise_IsNotRecognized
                  - Tagger_GetPossibleTags_TooLongWhole_EqualsTheAnswerOfTheNormalPath
                  - TagDecoder_GetPossibleTags_HugeAsciiInput_AnswersWithoutGrowingTheWorkspace

              - id: PartOfSpeech-Tagging-Tagger-IsFormOf
                title: >-
                  A call shall tell whether a word is a form of a base word with a given tag, that is whether an
                  analysis of the word (found with the rule of the lookup, compound heads included) has that base word
                  and that tag; word and base word shall be folded like a token of the tagger; the call shall be false
                  for an unrecognized word, a tag without analysis and a lexicon without analyses; it shall refuse
                  null, empty and white-space arguments and an undefined tag.
                justification: |
                  Whether "tests" is a form of the verb "test" is the question that a rule checker really asks; the
                  answer must follow from the same analyses that the lookup lists, so that the two cannot disagree.
                tests:
                  - Tagger_IsFormOf_Analyses_AnswerTheQuestion
                  - Tagger_IsFormOf_EveryAnalysisOfSampleWords_IsAForm
                  - Tagger_IsFormOf_LowerCaseCustomBaseWord_MatchesAndUpperCaseCannotBeStored
                  - Tagger_GetPossibleTags_NullWord_Throws
                  - Tagger_GetPossibleTags_EmptyOrWhiteSpace_Throws
                  - Tagger_GetPossibleTags_UndefinedModeOrTag_Throws
                  - Tagger_IsFormOf_CaseVariantsAndCompounds_AnswerFromTheAnalyses

              - id: PartOfSpeech-Tagging-Tagger-NoRetention
                title: >-
                  No call that tags text, a sentence or a token list (with or without a glossary) and no word lookup
                  shall leave text of its request in the thread's decoder or glossary workspace after it returns.
                justification: |
                  A service tags the text of its users with long-lived threads; the tagger must not keep that text in
                  memory after the call, whichever entry point was used.
                children:
                  - PartOfSpeech-Tagging-TagDecoder-NoRetention
                  - PartOfSpeech-Tagging-Glossary-NoRetention
                tests:
                  - Tagger_EveryEntryPoint_LeavesNoRequestTextInTheWorkspaces
