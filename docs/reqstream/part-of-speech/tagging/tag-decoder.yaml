---
# Software Unit Requirements for TagDecoder
#
# The TagDecoder unit chooses the tags of a sentence from the scores of the weights, the lexicon and the constraints.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: Tagging Requirements
        sections:
          - title: TagDecoder Requirements
            requirements:
              - id: PartOfSpeech-Tagging-TagDecoder-Greedy
                title: >-
                  Tokens shall be tagged from left to right, each with the highest-scoring allowed tag given the two
                  tags chosen before it, and when two tags score the same the tag that comes first in the tag order
                  shall
                  win.
                justification: |
                  A fixed order and a fixed tie-break make the result a function of the input alone, independent of the
                  platform, and the history gives the model its context.
                tests:
                  - TagDecoder_Decode_UsesPreviousTagsAsHistory
                  - TagDecoder_Decode_TieBreaksToLowestTag

              - id: PartOfSpeech-Tagging-TagDecoder-Restriction
                title: >-
                  Only the tags that the lexicon and the token-shape rules allow shall be candidates for a known word,
                  and all 17 tags shall be candidates for an unknown word.
                justification: |
                  This is the restriction of the lexicon at decode time; it must be exactly the rule of the data
                  documentation.
                tests:
                  - TagDecoder_Decode_Restricts_ToLexiconTags
                  - TagDecoder_Decode_UnknownWord_ConsidersAllTags
                  - TagDecoder_Decode_ShapeRules_ExtendAllowedSet
                  - TagDecoder_Decode_AllowedSet_MatchesDataFilesRules

              - id: PartOfSpeech-Tagging-TagDecoder-Confidence
                title: >-
                  The confidence of a tag shall be its probability among the candidates, computed with a softmax at the
                  temperature of the model; the alternatives shall be the other candidates ranked by probability and
                  limited to the number requested, and a token with a single candidate shall have confidence 1.
                justification: |
                  Callers read the confidence as a probability, so it must be calibrated with the stored temperature,
                  and
                  a single possible tag is certain by construction.
                tests:
                  - TagDecoder_Decode_Confidence_IsSoftmaxAtTemperature
                  - TagDecoder_Decode_Temperature_SharpensAndFlattens
                  - TagDecoder_Decode_Alternatives_AreSortedAndLimited
                  - TagDecoder_Decode_SingleAllowedTag_HasConfidenceOne

              - id: PartOfSpeech-Tagging-TagDecoder-Constraints
                title: >-
                  A constraint shall restrict the candidates of its token to its allowed tags, shall win when its
                  allowed
                  tags and the lexicon tags have none in common, shall add its boosts and penalties to the scores before
                  the choice, and shall change the history that the next tokens see.
                justification: |
                  A constraint comes from the caller, who knows the text better than a dictionary, and its effect must
                  be exactly what the caller asked for.
                tests:
                  - TagDecoder_Decode_Constraint_Only_Intersects
                  - TagDecoder_Decode_Constraint_DisjointFromLexicon_ConstraintWins
                  - TagDecoder_Decode_Constraint_Boost_And_Penalty
                  - TagDecoder_Decode_Constraint_PropagatesToNextToken
                  - TagDecoder_Decode_ReentrantConstraintList_DoesNotCorruptResult

              - id: PartOfSpeech-Tagging-TagDecoder-KnownWord
                title: >-
                  A token shall report that it is a known word when its folded, lower-cased spelling has an entry in the
                  lexicon, whatever its letter case, its shape or any constraint on it, and shall report that it is not
                  when the lexicon has no entry, without a further lexicon lookup and for a model with or without
                  feature groups. A token that has one allowed tag shall have no alternatives and a token that has
                  several allowed tags shall list the other allowed tags (up to the maximum of the options), also when a
                  soft constraint rounds its confidence to 1.0.
                justification: |
                  A rule checker must tell the tags that rest on evidence from the tags that are a guess for a word the
                  lexicon has never seen; the flag must be the lookup that already decides the allowed tags, so that it
                  costs nothing and cannot disagree with them, and it must not change when a dictionary or a constraint
                  decides the tag. A checker also tells a tag that a dictionary forced from one that a soft constraint
                  only favored by the number of alternatives, because the confidence cannot tell them apart.
                tests:
                  - TagDecoder_Decode_KnownWord_ReportsLexiconMembership
                  - TagDecoder_Decode_KnownWord_IgnoresLetterCase
                  - TagDecoder_Decode_KnownWord_ShapeRulesDoNotMakeAWordKnown
                  - TagDecoder_Decode_KnownWord_IsIndependentOfConstraints
                  - TagDecoder_Decode_KnownWord_AllGroups_EqualsPlainDecode
                  - TagDecoder_Decode_SingleAllowedTag_HasNoAlternativesAndSoftConstraintKeepsThem

              - id: PartOfSpeech-Tagging-TagDecoder-FeatureGroups
                title: >-
                  The decoder shall extract the feature groups that the weights file names (and no others), shall use
                  the same lexicon facts for the groups and for the allowed tags, shall feed the tags that it chose
                  into the history features of the groups, and for every set of groups shall choose the tags that a
                  plain decoder over the string-based reference features chooses.
                justification: |
                  A model is only valid for the features it was trained with, and the groups come from the weights
                  header, so the decoder must follow the header and nothing else.
                tests:
                  - TagDecoder_Decode_ClauseCues_ImperativeBeforeDeterminer
                  - TagDecoder_Decode_ClauseCues_ClauseStateFollowsChosenTags
                  - TagDecoder_Decode_PositionCues_UsePositionInSentence
                  - TagDecoder_Decode_Inflection_SeparatesVerbStemFromLookalike
                  - TagDecoder_Decode_TitleCaseLine_TitleLineChangesTheDecision
                  - TagDecoder_Decode_MatchesReferenceDecoder

              - id: PartOfSpeech-Tagging-TagDecoder-RightPreview
                title: >-
                  A model with the right preview group shall be decoded in two passes: a first pass that chooses tags
                  without the preview features (and without probabilities), applying the constraints, and a second
                  pass that sees those tags for the next two tokens and produces the result; a model whose weights
                  have no preview weights shall decode exactly as without the group, and the result shall be the same
                  for every repetition and every thread.
                justification: |
                  The preview lets the decoder use the right-hand context; the first pass must be the decode of the
                  same weights without the group, so that one weights table serves both passes, and the result must
                  not depend on timing.
                tests:
                  - TagDecoder_Decode_RightPreview_SecondPassSeesFirstPassTags
                  - TagDecoder_Decode_RightPreview_WithoutPreviewWeights_EqualsOnePass
                  - TagDecoder_Decode_RightPreview_IsDeterministic

              - id: PartOfSpeech-Tagging-TagDecoder-EmptyInput
                title: A sentence without tokens shall give an empty result.
                justification: |
                  An empty sentence is valid input and must not fail.
                tests:
                  - TagDecoder_Decode_EmptySentence_ReturnsEmpty

              - id: PartOfSpeech-Tagging-TagDecoder-PossibleTags
                title: >-
                  The decoder shall answer the lookup of one word with the same lexicon read, the same folding and the
                  same shape rules that it uses to allow tags for a token, so that the tags of the lookup in the shape
                  mode equal the tags that a decode allows for that token (the tag and its alternatives) at any
                  position, with and without feature groups and for every spelling of the lexicon, its title-case form
                  and tokens of every shape, and the known flag equals that of the token; the lookup of the lexicon mode
                  shall equal the tags of the lexicon; a hyphenated spelling shall match as a spelling and a compound
                  whose last part is a spelling shall carry the analyses of that part, however long the word is; a
                  lookup shall not disturb a decode that runs on the same thread before or after it; and every analysis
                  of every spelling shall be found by the form question.
                justification: |
                  A lookup that disagreed with the decoder about the allowed tags of a word would make a rule checker
                  contradict the tagger; one that shared the decoder's thread-local buffers carelessly would corrupt the
                  tags of a sentence. The lookup therefore reuses the decoder's own folding and shape rules, and the
                  tests compare it with the decoder over all of the lexicon rather than over samples.
                tests:
                  - TagDecoder_GetPossibleTags_WithShapeRules_SampleTokens_EqualTheDecodeCandidates
                  - TagDecoder_GetPossibleTags_LexiconOnly_EqualsLexiconTryGetTags
                  - TagDecoder_GetPossibleTags_EmbeddedLexicon_HasNoWhiteSpaceSpellings
                  - TagDecoder_GetPossibleTags_EmbeddedLexicon_EverySpellingEqualsTheDecoder
                  - TagDecoder_GetPossibleTags_HyphenatedSpellings_SpellingWinsAndHeadsMatchTheirPart
                  - TagDecoder_IsFormOf_EveryAnalysisOfEverySpelling_IsAForm
                  - TagDecoder_GetPossibleTags_BetweenDecodes_DoesNotDisturbTheWorkspace
                  - TagDecoder_GetPossibleTags_HugeAsciiInput_AnswersWithoutGrowingTheWorkspace
                  - FeatureExtractor_SetFolded_NormalizedText_EqualsSetToken
                  - FeatureExtractor_SetFolded_SpanSlice_EqualsTheSameTextAsAToken
                  - FeatureExtractor_FoldsToDoubleHyphen_AgreesWithTheFoldingOfEveryCodeUnit

              - id: PartOfSpeech-Tagging-TagDecoder-NoRetention
                title: >-
                  A decode and a word lookup shall leave no text of their request, nor anything derived from it (the
                  folded characters, the hashes, the lexicon key bytes), in the thread's decoder workspace when they
                  return or fail, also when a shorter request follows a longer one.
                justification: |
                  The workspace lives as long as the thread; text that stayed in it would outlive the request in
                  process memory, where a memory dump or a later defect could expose it. Erasing only the part that the
                  request used keeps the cost proportional to the request.
                tests:
                  - TagDecoder_Decode_LeavesNoRequestTextInTheWorkspace
                  - TagDecoder_Decode_Exception_LeavesNoRequestTextInTheWorkspace
                  - TagDecoder_GetPossibleTags_And_IsFormOf_LeaveNoRequestTextInTheWorkspace
                  - DecoderWorkspace_Clear_ErasesAPreparedSentence
