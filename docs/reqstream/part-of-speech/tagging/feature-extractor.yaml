---
# Software Unit Requirements for FeatureExtractor
#
# The FeatureExtractor unit is the single definition of the features that the perceptron scores. The decoder and the
# trainer both use it unchanged.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: Tagging Requirements
        sections:
          - title: FeatureExtractor Requirements
            requirements:
              - id: PartOfSpeech-Tagging-FeatureExtractor-FeatureSet
                title: >-
                  Every token shall be described by 22 feature templates: a bias, the word, the lower-cased word, its
                  shape, its prefixes and suffixes of one to four characters when the token is long enough, the initial
                  flag, the two neighbors on each side, the pair of the nearest neighbors and the previous tags; and
                  only the features that depend on tags shall change when the tag history changes.
                justification: |
                  The weights of a model are only meaningful for the exact feature set they were trained with, so the
                  set is a fixed, versioned definition.
                tests:
                  - FeatureExtractor_Extract_EmitsTwentyTwoTemplates
                  - FeatureExtractor_Extract_ShortToken_OmitsLongPrefixesAndSuffixes
                  - FeatureExtractor_Extract_TagHistory_ChangesOnlyTagFeatures

              - id: PartOfSpeech-Tagging-FeatureExtractor-Shape
                title: >-
                  The shape of a token shall record whether it starts with an upper-case letter, is all upper case,
                  has a
                  digit, a hyphen or an apostrophe, or has no letter and no digit.
                justification: |
                  Capitalization and character classes carry most of what the model knows about names, numbers and
                  symbols that it has never seen.
                tests:
                  - FeatureExtractor_Shape_FollowsSpikeBits

              - id: PartOfSpeech-Tagging-FeatureExtractor-Initial
                title: >-
                  The initial flag shall mark the first token that contains a letter or a digit, so that a leading quote
                  or bracket does not hide the first word of a sentence.
                justification: |
                  Sentence-initial capitalization is not evidence of a name; the first word must be recognized even when
                  punctuation comes before it.
                tests:
                  - FeatureExtractor_Extract_InitialFlag_SkipsLeadingPunctuation

              - id: PartOfSpeech-Tagging-FeatureExtractor-Context
                title: >-
                  The neighbors of a token at the start or the end of a sentence shall be fixed boundary markers.
                justification: |
                  The first and last words need context features too, and the markers keep them distinct from any real
                  word.
                tests:
                  - FeatureExtractor_Extract_Neighbors_UseSentinelsAtBoundaries

              - id: PartOfSpeech-Tagging-FeatureExtractor-Fold
                title: >-
                  Before features are computed, typographic quotes, dashes and the ellipsis shall be mapped to their
                  ASCII forms and non-ASCII text shall be normalized, so that the same word gives the same features
                  however it is written.
                justification: |
                  The training data is ASCII-normalized while real text is not; without the mapping "don’t" and the
                  curly quotes would be unseen tokens.
                tests:
                  - FeatureExtractor_Extract_Fold_MapsTypographicQuotesAndDashes
                  - FeatureExtractor_Extract_Fold_NfcNormalizesNonAscii

              - id: PartOfSpeech-Tagging-FeatureExtractor-MalformedText
                title: >-
                  A token that is not well-formed UTF-16 shall not make feature extraction fail: each unpaired
                  surrogate shall count as U+FFFD for the features, a valid surrogate pair shall be kept, and the rest
                  of the token shall be normalized as usual.
                justification: |
                  String normalization throws for an unpaired surrogate, but tagging must work for every string; the
                  replacement affects the features only and is deterministic.
                tests:
                  - FeatureExtractor_Extract_Fold_UnpairedSurrogate_UsesReplacementCharacter

              - id: PartOfSpeech-Tagging-FeatureExtractor-ReferenceEquivalence
                title: >-
                  The buckets of the features shall equal the buckets that the plain, string-based definition of the
                  features gives for a sample of corpus sentences.
                justification: |
                  The fast extraction must implement the definition exactly, or models would be trained on one feature
                  set and used with another.
                tests:
                  - FeatureExtractor_Extract_MatchesReferenceStringHashing

              - id: PartOfSpeech-Tagging-FeatureExtractor-Buckets
                title: >-
                  Every bucket shall lie inside the bucket space of the model and shall be the same for the same
                  feature on every run, and features that depend on letter case shall give different buckets for
                  different case.
                justification: |
                  A bucket outside the model cannot be scored, a bucket that changes between runs cannot match trained
                  weights, and case-blind features would lose the capitalization evidence.
                tests:
                  - FeatureExtractor_Buckets_AreInRangeAndStable
                  - FeatureExtractor_Hash_IsCaseSensitiveWhereTemplatesAre

              - id: PartOfSpeech-Tagging-FeatureExtractor-NoAllocation
                title: Extracting the features of a sentence shall not allocate memory once the extractor has been used.
                justification: |
                  Extraction runs for every token; allocation there would add garbage collection to every request and
                  lower throughput.
                tests:
                  - FeatureExtractor_Extract_DoesNotAllocateAfterWarmUp
                  - FeatureExtractor_Extract_AllGroups_DoesNotAllocateAfterWarmUp

              - id: PartOfSpeech-Tagging-FeatureExtractor-FeatureGroups
                title: >-
                  The extractor shall extend the 22 base templates only by the feature groups that its workspace is
                  configured with: with no group it shall produce exactly the 22 base templates, whatever the workspace
                  served before; with a group it shall add the features of that group behind the base ones, in a
                  bucket buffer of at most 40 buckets per token; and for every set of groups the buckets shall equal
                  the buckets of the plain, string-based definition.
                justification: |
                  The groups are an experiment with a switch: a model without groups must keep the features it was
                  trained with, a model with groups must be scored with exactly the features it was trained with, and
                  the trainer and the decoder share this one implementation.
                tests:
                  - FeatureExtractor_Extract_NoGroups_ProducesOnlyBaseTemplates
                  - FeatureExtractor_Extract_GroupsMatchReference
                  - FeatureExtractor_Extract_AllGroups_FillsBucketCapacity

              - id: PartOfSpeech-Tagging-FeatureExtractor-PositionCues
                title: >-
                  The position cues shall describe where a token is in its sentence: its position capped at three,
                  the first token that is not a function word, the terminal of the sentence (a final closing quote or
                  bracket skipped) and the length bucket of the sentence.
                justification: |
                  Imperatives, subjects and fragments differ by where they stand in a sentence; the cues are fixed by
                  the pre-registered definition.
                tests:
                  - FeatureExtractor_Extract_PositionCues_FollowTheDefinition
                  - FeatureExtractor_Extract_PositionCues_LengthBuckets

              - id: PartOfSpeech-Tagging-FeatureExtractor-ClauseCues
                title: >-
                  The clause cues shall describe the classes of the neighbors of a token (so that a verb before a
                  determiner is distinguishable), the distance to the nearest preceding determiner or number and to the
                  nearest preceding modal or `to`, and what the tags decided since the last clause boundary
                  contain (a subject-like tag, a verb), where a comma, semicolon, colon, opening bracket or dash and a
                  decided conjunction start a new clause.
                justification: |
                  Whether a clause already has a subject or a verb decides whether an ambiguous word is a verb; the
                  classes and the state are fixed by the pre-registered definition.
                tests:
                  - FeatureExtractor_Extract_ClauseCues_ClassifiesTokens
                  - FeatureExtractor_Extract_ClauseCues_ImperativeFollowedByDeterminer
                  - FeatureExtractor_Advance_ClauseState_TracksSubjectVerbAndBoundaries
                  - FeatureExtractor_Advance_ClauseState_BoundaryTokens

              - id: PartOfSpeech-Tagging-FeatureExtractor-Inflection
                title: >-
                  The inflection cues shall tell whether the stem of a token that ends in `ing`, `ed` or `s` is a
                  verb or a noun in the lexicon, restoring a dropped `e`, undoing a doubled final consonant and
                  mapping `ied` and `ies` to `y`, so that `avoiding` is told from `bring` and `thing`.
                justification: |
                  A word that only looks inflected must not be read as a verb form; the lexicon knows which stems are
                  verbs.
                tests:
                  - FeatureExtractor_Extract_Inflection_StemFacts
                  - FeatureExtractor_Extract_Inflection_SeparatesAvoidingFromBringAndThing

              - id: PartOfSpeech-Tagging-FeatureExtractor-RightPreview
                title: >-
                  The right preview cues shall be absent in the first decoding pass and, in the second pass, describe
                  the tags that the first pass chose for the next two tokens, with distinct markers for the end of the
                  sentence and for beyond it; the cues shall stay inactive for a workspace without the group.
                justification: |
                  The preview gives the second pass the right-hand context that a left-to-right decoder cannot see; the
                  first pass must not contain it, or it would be circular.
                tests:
                  - FeatureExtractor_Extract_RightPreview_UsesFirstPassTagsOfNextTwoTokens
