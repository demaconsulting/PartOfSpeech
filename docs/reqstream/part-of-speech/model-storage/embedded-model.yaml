---
# Software Unit Requirements for EmbeddedModel
#
# The EmbeddedModel unit gives access to the lexicon and the weights that are embedded in the package.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: ModelStorage Requirements
        sections:
          - title: EmbeddedModel Requirements
            requirements:
              - id: PartOfSpeech-ModelStorage-EmbeddedModel-Lexicon
                title: >-
                  The package shall contain a lexicon that loads, and every access shall return the same loaded lexicon.
                justification: |
                  The embedded lexicon is what the default restriction of known words is made of; loading it again for
                  every access would waste time and memory.
                tests:
                  - EmbeddedModel_Lexicon_IsPresentAndLoads
                  - EmbeddedModel_Lexicon_SecondAccess_ReturnsSameInstance

              - id: PartOfSpeech-ModelStorage-EmbeddedModel-Weights
                title: >-
                  The package shall contain trained weights that load as a model of the feature set of the library
                  (the embedded model has no feature group), and every access shall return the same loaded model.
                justification: |
                  The embedded weights are what the default tagger scores with; weights that are missing or built for
                  another feature set would make the default tagger fail or give wrong tags, and loading them again for
                  every access would waste time and memory.
                tests:
                  - EmbeddedModel_Weights_IsPresentAndLoads
                  - EmbeddedModel_Weights_SecondAccess_ReturnsSameInstance
                  - ModelStorage_EmbeddedWeights_HaveNoFeatureGroups

              - id: PartOfSpeech-ModelStorage-EmbeddedModel-ThreadSafe
                title: >-
                  Threads that access the embedded lexicon or the embedded weights at the same time shall receive the
                  same instance.
                justification: |
                  Services tag in parallel from the first request on; two loaded copies would waste memory and could
                  differ if loading ever failed once.
                tests:
                  - EmbeddedModel_Lexicon_ParallelAccess_ReturnsSingleInstance
                  - EmbeddedModel_Weights_ParallelAccess_ReturnsSingleInstance
