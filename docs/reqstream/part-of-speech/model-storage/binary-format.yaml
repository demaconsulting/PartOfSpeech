---
# Software Unit Requirements for BinaryFormat
#
# The BinaryFormat unit holds the primitives that both file formats share.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: ModelStorage Requirements
        sections:
          - title: BinaryFormat Requirements
            requirements:
              - id: PartOfSpeech-ModelStorage-BinaryFormat-LittleEndianPrimitives
                title: >-
                  Integers and single-precision numbers shall be read and written in little-endian byte order on every
                  platform.
                justification: |
                  A file written on one machine must read the same on every other; the byte order of the format cannot
                  depend on the processor.
                tests:
                  - BinaryFormat_ReadWrite_LittleEndianPrimitives_RoundTrip

              - id: PartOfSpeech-ModelStorage-BinaryFormat-Varints
                title: >-
                  A variable-length integer shall round-trip over its whole range, and an over-long or truncated one
                  shall be refused.
                justification: |
                  The formats store gaps and lengths as variable-length integers; a reader that ran past the end of its
                  data or accepted an over-long value would misread the rest of the file.
                tests:
                  - BinaryFormat_Varint_RoundTripsBoundaryValues
                  - BinaryFormat_Varint_OverlongOrTruncated_Throws

              - id: PartOfSpeech-ModelStorage-BinaryFormat-Checksum
                title: >-
                  The checksum of the stored bytes of a file shall equal the published FNV-1a 32-bit value for those
                  bytes.
                justification: |
                  A checksum that follows the published algorithm can be recomputed by any other tool that reads or
                  writes the files. It covers the stored (compressed) bytes, so a change to the compressed region is
                  found before anything is inflated.
                tests:
                  - BinaryFormat_Fnv1a_MatchesKnownVectors

              - id: PartOfSpeech-ModelStorage-BinaryFormat-Header
                title: >-
                  A header shall be refused when its magic is wrong, its version is not supported or the file is shorter
                  than the header, and the error shall say which.
                justification: |
                  Each kind of defect has a different remedy for the caller, so each must be reported as itself and
                  before any other field is trusted.
                tests:
                  - BinaryFormat_ReadHeader_BadMagic_Throws
                  - BinaryFormat_ReadHeader_UnsupportedVersion_Throws
                  - BinaryFormat_ReadHeader_Truncated_Throws

              - id: PartOfSpeech-ModelStorage-BinaryFormat-Compression
                title: >-
                  A payload shall be stored compressed with Deflate and shall be restored byte for byte, and a stored
                  region shall be refused when its Deflate stream is incomplete (cut off at any point, including only
                  its last byte), has bytes after its end, is not valid Deflate data, or inflates to a size other than
                  the declared one.
                justification: |
                  Compression keeps the package small; any loss would corrupt the data the tagger relies on. A stream
                  that is cut off can still inflate to all of its data, and bytes that the decoder never uses are not
                  inflated at all, so only a reader that checks the end of the stream and the use of the whole region
                  can tell a damaged region from a good one when the checksum was recomputed.
                tests:
                  - BinaryFormat_Deflate_RoundTrips
                  - BinaryFormat_Decompress_TrailingBytesInStoredRegion_Throws
                  - BinaryFormat_Decompress_CutOffStream_Throws
                  - BinaryFormat_Decompress_DeclaredLengthWrong_Throws
                  - BinaryFormat_Compress_EmptyPayload_StoresCompleteStream
                  - BinaryFormat_Decompress_GarbageRegion_Throws

              - id: PartOfSpeech-ModelStorage-BinaryFormat-PopCount
                title: The number of set bits of a 64-bit word shall be counted correctly on every target framework.
                justification: |
                  The weights are found by counting occupied buckets, so a wrong count would address the wrong weights;
                  the library supports target frameworks with and without a hardware instruction for it.
                tests:
                  - BinaryFormat_PopCount_MatchesReference
