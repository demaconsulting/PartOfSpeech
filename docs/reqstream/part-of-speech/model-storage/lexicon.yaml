---
# Software Unit Requirements for Lexicon
#
# The Lexicon unit reads, writes and searches the compiled word lexicon and applies the token-shape rules.

sections:
  - title: PartOfSpeech Requirements
    sections:
      - title: ModelStorage Requirements
        sections:
          - title: Lexicon Requirements
            requirements:
              - id: PartOfSpeech-ModelStorage-Lexicon-Lookup
                title: >-
                  A lookup shall return the tags of every spelling of a lexicon, including the first and the last
                  spelling of every block and non-ASCII spellings, and shall report a spelling that is absent, or longer
                  than any spelling of the lexicon, as not found.
                justification: |
                  A lookup that missed a spelling would lift the restriction for a known word, and one that invented a
                  match would restrict a word wrongly.
                tests:
                  - Lexicon_TryGetTags_FindsEverySpellingOfSmallLexicon
                  - Lexicon_TryGetTags_FirstAndLastOfEveryBlock
                  - Lexicon_TryGetTags_AbsentSpellings_ReturnFalse
                  - Lexicon_TryGetTags_NonAsciiSpelling_IsFound
                  - Lexicon_TryGetTags_LongerThanMaxSpelling_ReturnsFalse

              - id: PartOfSpeech-ModelStorage-Lexicon-Writer
                title: >-
                  The lexicon table shall be compiled only if its rows are unique, sorted by the bytes of their UTF-8
                  spellings and valid, and the compiled lexicon shall have the spelling and entry counts that the table
                  header states, with the same content whether it is stored compressed or not; an analyses table shall
                  be compiled only if its rows are unique, sorted, valid, name only spellings and tags of the lexicon
                  rows, and fit the limits of the format, and the same tables shall always compile to the same bytes.
                justification: |
                  The compiled form is searched by binary search, which is only correct for sorted unique rows; a table
                  that breaks the rules must fail at compile time, not at lookup time. The analyses are joined to the
                  spellings by position, so an analysis for a spelling or a tag that the lexicon lacks must be refused
                  when the file is written, and a compiled file that changed without a change of the tables would make
                  the check that compares the committed binary with its tables meaningless.
                tests:
                  - LexiconWriter_FromTsv_RejectsUnsortedDuplicateOrInvalid
                  - LexiconWriter_FromTsv_CountsMatchHeaderComment
                  - LexiconWriter_Write_UncompressedAndCompressed_DecodeEqual
                  - LexiconWriter_AnalysesFromTsv_ParsesRowsAndChecksHeaderCounts
                  - LexiconWriter_AnalysesFromTsv_RejectsUnsortedUnknownOrInvalid
                  - LexiconWriter_Compile_InvalidAnalyses_Throws
                  - LexiconWriter_Compile_MoreThanMaximumLists_Throws
                  - LexiconWriter_Compile_Analyses_IsDeterministic

              - id: PartOfSpeech-ModelStorage-Lexicon-Analyses
                title: >-
                  A lexicon shall return the analyses (base word, tag and features) of every spelling that has some, in
                  a fixed order and for every shape of base word that the format stores (the spelling itself, a cut of
                  it with a suffix, a different word, non-ASCII text), shall tell the tags that its analyses name
                  without allocating, shall tell whether a spelling has an analysis with a given tag and base word
                  without allocating, shall report the position of every spelling that it finds, and a lexicon compiled
                  without an analyses table shall read back with no analyses.
                justification: |
                  The word lookup reports the base words and forms from these calls; a base word composed wrongly from
                  its template would be wrong for the words that use it, and a lexicon that is built from tags alone,
                  such as a test or custom lexicon, is valid.
                tests:
                  - Lexicon_TryFind_ReportsThePositionOfEverySpelling
                  - Lexicon_Compile_WithoutAnalyses_ReadsBackWithEmptyAnalyses
                  - Lexicon_GetAnalyses_EveryShapeOfAnalysis_RoundTrips
                  - Lexicon_HasAnalysis_ComparesTagAndComposedBaseWord
                  - Lexicon_GetAnalyses_EmbeddedTests_ReturnsNounAndVerbInOrder
                  - Lexicon_AllowedTags_KnownTokenShapes_DoNotAllocate
                  - Tagger_IsFormOf_DoesNotAllocate
              - id: PartOfSpeech-ModelStorage-Lexicon-AnalysesValidation
                title: >-
                  A lexicon file shall be refused when its analyses section is inconsistent: a list, template or
                  feature-set index out of range, tags of a list that are not tags of the spelling, a cut that is longer
                  than the spelling or that falls inside a character, an invalid suffix, feature sets that are
                  malformed or not in ascending order, template tags that decrease, analyses of one tag that are not
                  in ascending order of base word and features for the spelling, a base word that is not in
                  normalization form C, a repeated template, a non-empty
                  first list, regions that do not fill the payload, counts that disagree with the data or the payload,
                  or a header field out of range; and a file of the earlier format version shall be refused with a
                  message that names both versions.
                justification: |
                  The reader composes base words from the templates and the spelling at lookup time, with no further
                  check; every inconsistency that would make that composition fail, produce invalid UTF-8 or name a tag
                  that the spelling lacks must therefore be found when the file is loaded.
                tests:
                  - Lexicon_Load_ListIndexOutOfRange_Throws
                  - Lexicon_Load_ListTagsNotASubsetOfTheSpellingTags_Throws
                  - Lexicon_Load_CutLongerThanSpelling_Throws
                  - Lexicon_Load_CutInsideACharacter_Throws
                  - Lexicon_Load_InvalidSuffix_Throws
                  - Lexicon_Load_UnsortedFeatureSets_Throws
                  - Lexicon_Load_MalformedFeatureSet_Throws
                  - Lexicon_Load_TemplateIndexOutOfRange_Throws
                  - Lexicon_Load_ListTagsDecrease_Throws
                  - Lexicon_Load_SameTagAnalysesInWrongBaseWordOrder_Throws
                  - Lexicon_Load_SameTagAnalysesInWrongFeatureOrder_Throws
                  - Lexicon_Load_ListInOrderForOneSpellingButNotForAnother_Throws
                  - Lexicon_Load_GeneratedAnalyses_AcceptsWriterOrderAndRefusesExchangedNeighbors
                  - Lexicon_Load_ComposedBaseWordNotNormalized_Throws
                  - Lexicon_Load_CharactersBelowU0300_AreStableUnderNormalizationFormC
                  - Lexicon_Load_ListZeroNotEmpty_Throws
                  - Lexicon_Load_RepeatedTemplate_Throws
                  - Lexicon_Load_AnalysesRegionsDoNotFillThePayload_Throws
                  - Lexicon_Load_AnalysisCountMismatch_Throws
                  - Lexicon_Load_TemplateCountLargerThanThePayload_Throws
                  - Lexicon_Load_InvalidAnalysesHeaderField_Throws
                  - ModelStorage_Formats_StartWithMagicAndVersion

              - id: PartOfSpeech-ModelStorage-Lexicon-Validation
                title: >-
                  A lexicon file shall be refused when its checksum fails, it is truncated, its tag count is not 17,
                  its structure is inconsistent, its compressed region is incomplete (cut off at any point), holds bytes
                  after the Deflate data or inflates to another size than the header declares, or it declares a size
                  above the format limit.
                justification: |
                  A damaged lexicon must fail when it is loaded, not return wrong tags later.
                tests:
                  - Lexicon_Load_CorruptChecksum_Throws
                  - Lexicon_Load_Truncated_Throws
                  - Lexicon_Load_TagCountMismatch_Throws
                  - Lexicon_Load_InvalidStructureWithValidChecksum_Throws
                  - Lexicon_Load_OversizedVarintWithValidChecksum_Throws
                  - Lexicon_Load_DeflateTrailingBytesInStoredRegion_Throws
                  - Lexicon_Load_DeflateLastByteRemoved_Throws
                  - Lexicon_Load_DeflateCutAtAnyPoint_Throws
                  - Lexicon_Load_DeflatePayloadLengthTooLarge_Throws
                  - Lexicon_Load_DeflatePayloadLengthTooSmall_Throws
                  - Lexicon_Load_PayloadLengthAboveMaximum_Throws

              - id: PartOfSpeech-ModelStorage-Lexicon-AllowedTags
                title: >-
                  The tags allowed for a token shall be all 17 tags for a spelling that is not in the lexicon, and for a
                  known spelling its lexicon tags extended by PUNCT, SYM and X when the token has no letter or digit, by
                  NUM, SYM, X, NOUN, PROPN and ADJ when it has a digit, and by PROPN and X when it starts with an
                  upper-case letter; for the development set these tags shall include the gold tag of at least 99.9
                  percent of the tokens that are not disputed.
                justification: |
                  These are the token-shape rules of the lexicon data: the lexicon lists the tags of words, and names,
                  numbers and symbols need the tags of their shape. Measured on the development set, the rules must
                  rarely exclude the right tag.
                tests:
                  - Lexicon_AllowedTags_UnknownWord_AllowsAllSeventeen
                  - Lexicon_AllowedTags_KnownWord_AllowsLexiconTags
                  - Lexicon_AllowedTags_NoLetterOrDigit_AddsPunctSymX
                  - Lexicon_AllowedTags_Digit_AddsNumSymXNounPropnAdj
                  - Lexicon_AllowedTags_FirstUpper_AddsPropnX
                  - Lexicon_AllowedTags_MatchesDataFilesRuleForEveryLexiconSpelling
                  - Lexicon_AllowedTags_Dev_MeetsCoverageThreshold
