---
# Software System Requirements for Part Of Speech
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: Library API
    requirements:
      - id: PartOfSpeech-Lib-Greeting
        title: The library shall generate a greeting string when given a name.
        tags: [system]
        justification: |
          Provides a simple demonstration of library functionality following
          .NET library best practices for DEMA Consulting libraries.
        children:
          - PartOfSpeech-Demo-Greeting
        tests:
          - PartOfSpeech_SystemIntegration_DefaultConstruction_ReturnsExpectedGreeting
          - PartOfSpeech_SystemCustomization_CustomPrefix_ReturnsExpectedGreeting

      - id: PartOfSpeech-Lib-GreetingFormat
        title: The library shall return a greeting string in the format "{prefix}, {name}!".
        tags: [system]
        justification: |
          The format is the core observable contract of the library: callers depend on this
          specific structure in documentation examples and integration code.
        children:
          - PartOfSpeech-Demo-Greeting
        tests:
          - PartOfSpeech_SystemIntegration_DefaultConstruction_ReturnsExpectedGreeting
          - PartOfSpeech_SystemCustomization_CustomPrefix_ReturnsExpectedGreeting

      - id: PartOfSpeech-Lib-DefaultPrefix
        title: The library shall use "Hello" as the default greeting prefix.
        tags: [system]
        justification: |
          Callers constructing the library without a prefix argument need a predictable default
          greeting to rely on in documentation and examples.
        children:
          - PartOfSpeech-Demo-DefaultPrefix
        tests:
          - PartOfSpeech_SystemIntegration_DefaultConstruction_ReturnsExpectedGreeting

      - id: PartOfSpeech-Lib-CustomPrefix
        title: The library shall support a customizable greeting prefix.
        tags: [system]
        justification: |
          Consumers may need to produce greetings with a prefix other than the
          default, so the library must allow the prefix to be specified at
          construction time.
        children:
          - PartOfSpeech-Demo-AcceptCustomPrefix
          - PartOfSpeech-Demo-Prefix
        tests:
          - PartOfSpeech_SystemCustomization_CustomPrefix_ReturnsExpectedGreeting

      - id: PartOfSpeech-Lib-Prefix
        title: The library shall expose the configured greeting prefix via a read-only property.
        tags: [system]
        justification: |
          Callers may need to inspect the prefix configured at construction time without
          re-specifying it or relying on the greeting output format to infer it.
        children:
          - PartOfSpeech-Demo-Prefix
        tests:
          - PartOfSpeech_SystemIntegration_CustomPrefix_ExposesPrefix

      - id: PartOfSpeech-Lib-ValidationNull-DemoMethod
        title: The library shall reject a null name argument to DemoMethod with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to DemoMethod is a programming error. Throwing ArgumentNullException
          immediately surfaces the mistake to callers and prevents obscure failures deeper in
          the call stack.
        children:
          - PartOfSpeech-Demo-ValidationNull-DemoMethod
        tests:
          - PartOfSpeech_SystemValidation_DemoMethodNullInput_ThrowsArgumentNullException

      - id: PartOfSpeech-Lib-ValidationNull-Constructor
        title: The library shall reject a null prefix argument to the constructor with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to the constructor is a programming error. Throwing ArgumentNullException
          immediately surfaces the mistake and prevents invalid instances from being created.
        children:
          - PartOfSpeech-Demo-ValidationNull-Constructor
        tests:
          - PartOfSpeech_SystemValidation_ConstructorNullPrefix_ThrowsArgumentNullException

      - id: PartOfSpeech-Lib-ValidationEmpty-DemoMethod
        title: The library shall reject an empty-string name argument to DemoMethod with ArgumentException.
        tags: [system]
        justification: |
          Passing an empty string to DemoMethod is a programming error. Throwing ArgumentException
          immediately surfaces the mistake and prevents malformed output such as "Hello, !".
        children:
          - PartOfSpeech-Demo-ValidationEmpty-DemoMethod
        tests:
          - PartOfSpeech_SystemValidation_DemoMethodEmptyInput_ThrowsArgumentException

      - id: PartOfSpeech-Lib-ValidationEmpty-Constructor
        title: The library shall reject an empty-string prefix argument to the constructor with ArgumentException.
        tags: [system]
        justification: |
          Passing an empty string to the constructor is a programming error. Throwing ArgumentException
          immediately surfaces the mistake and prevents malformed output such as ", World!".
        children:
          - PartOfSpeech-Demo-ValidationEmpty-Constructor
        tests:
          - PartOfSpeech_SystemValidation_ConstructorEmptyPrefix_ThrowsArgumentException

  - title: Data and Licensing
    requirements:
      - id: PartOfSpeech-Licensing-ThirdPartyNotices
        title: >-
          The package shall include a third-party notice that attributes the MASC corpus and the Open English WordNet
          (title, creator, source link, license link, and the fact that the data was converted) and reproduces the
          Princeton WordNet license.
        tags: [system]
        justification: |
          The Creative Commons Attribution licenses of MASC and Open English WordNet, and the Princeton WordNet license
          that Open English WordNet carries, require attribution, a link to the license, an indication of changes, and
          the license notice itself to accompany every copy of the data or of a work derived from it.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Content_AttributesMascAndOpenEnglishWordNet

      - id: PartOfSpeech-Licensing-NoticePackaged
        title: The third-party notice shall be packed at the root of the NuGet package.
        tags: [system]
        justification: |
          Consumers receive the library as a NuGet package, so the attribution and license notices must be in the
          package itself for the license obligations to travel with every copy that is redistributed.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Packaging_NoticeIsPackedAtPackageRoot

      - id: PartOfSpeech-Licensing-OpenLicensesOnly
        title: >-
          The repository shall contain training and evaluation data only under CC0, CC BY, public-domain or project
          licenses, with no share-alike or non-commercial data, and UD English-EWT shall not be committed.
        tags: [system]
        justification: |
          The library and its data are distributed under permissive terms. Share-alike, non-commercial and
          no-derivatives data would impose conditions on the library and its users that the project does not accept, and
          UD English-EWT (CC BY-SA 4.0) is used for evaluation only.
        tests:
          - PartOfSpeech_DataLicensing_Folders_DeclareAllowedLicensesOnly
          - PartOfSpeech_DataLicensing_Tree_ContainsNoRestrictedCorpusFiles

      - id: PartOfSpeech-Data-Provenance
        title: >-
          Each training and evaluation data source shall be committed with a record of its origin, license, and how it
          was produced, and its files shall match recorded checksums.
        tags: [system]
        justification: |
          Reviewers and consumers must be able to establish where each data set came from, under which license, and
          that the committed files are the files that were produced and reviewed, so that results are reproducible and
          silent changes are detected.
        tests:
          - PartOfSpeech_DataProvenance_Folders_HaveReadmeLicenseAndSource
          - PartOfSpeech_DataProvenance_Manifest_ChecksumsMatchCommittedFiles

      - id: PartOfSpeech-Data-UniversalTags
        title: >-
          Every committed token-level corpus shall be labeled with the 17 Universal POS tags only, and every committed
          single-target evaluation set shall be labeled with the coarse classes that the Universal POS tags map to.
        tags: [system]
        justification: |
          The library tags text with the 17 Universal POS tags. Training and evaluation data in any other tag set would
          require undocumented conversion and would make accuracy measurements incomparable.
        tests:
          - PartOfSpeech_TrainingData_Corpora_UseOnlySeventeenUposTags
          - PartOfSpeech_EvaluationData_SingleTargetSets_UseOnlyDocumentedClasses

      - id: PartOfSpeech-Data-EvaluationIsolation
        title: No training document or sentence shall appear in any committed evaluation set.
        tags: [system]
        justification: |
          Accuracy measured on sentences or documents that the tagger was trained on overstates its quality, so the
          evaluation sets must be disjoint from the training data.
        tests:
          - PartOfSpeech_Leakage_TrainingVersusEvaluation_NoSharedDocumentOrSentence
          - PartOfSpeech_Leakage_Report_RecordsNoOverlaps

      - id: PartOfSpeech-Data-LexiconCoverage
        title: >-
          The lexicon shall allow the gold tag for at least 99.9% of the non-disputed tokens of the training and
          development sets.
        tags: [system]
        justification: |
          The lexicon restricts the tags that the tagger considers for a known word. A restriction that excludes the
          correct tag more than once in a thousand tokens would cap the accuracy of the tagger below its target.
        tests:
          - PartOfSpeech_Lexicon_Coverage_TrainAndDev_MeetsThreshold
          - PartOfSpeech_Lexicon_Format_RowsAreSortedUniqueAndValid
