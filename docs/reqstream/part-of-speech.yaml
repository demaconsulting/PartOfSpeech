---
# Software System Requirements for Part Of Speech
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.
# Each library requirement is decomposed into the subsystem and unit requirements under
# docs/reqstream/part-of-speech/ (Upos, Tokenization, ModelStorage and Tagging).

sections:
  - title: Library API
    requirements:
      - id: PartOfSpeech-Lib-TagText
        title: >-
          The library shall split English text into sentences and tokens and assign each token one of the 17 Universal
          POS tags.
        tags: [system]
        justification: |
          This is the purpose of the library: callers hand over running text and learn the part of speech of every word,
          in a tag set that is shared with other tools.
        children:
          - PartOfSpeech-Upos-SeventeenTags
          - PartOfSpeech-Upos-TagStrings
          - PartOfSpeech-Tokenization-TextToSentences
          - PartOfSpeech-Tokenization-MatchesCorpusConvention
          - PartOfSpeech-Tokenization-SentenceBoundaries
          - PartOfSpeech-Tagging-EndToEnd
          - PartOfSpeech-Tagging-TagHistory
        tests:
          - PartOfSpeech_Tagging_Text_TagsEveryTokenWithEmbeddedLexicon
          - PartOfSpeech_Tagging_Text_MultipleSentences_AreSplitAndTagged

      - id: PartOfSpeech-Lib-Offsets
        title: Every sentence and every token of a result shall carry character offsets into the original string.
        tags: [system]
        justification: |
          Callers highlight, replace or link the words of their own text, which needs the position of each token in that
          text and not only its spelling.
        children:
          - PartOfSpeech-Tokenization-TextToSentences
          - PartOfSpeech-Tagging-EndToEnd
        tests:
          - PartOfSpeech_Tagging_Text_OffsetsIndexTheOriginalString

      - id: PartOfSpeech-Lib-PreTokenized
        title: The library shall tag sentences that the caller has already split into tokens.
        tags: [system]
        justification: |
          Callers that own a tokenizer, or that tag the output of another tool, must be able to keep their own token
          boundaries.
        children:
          - PartOfSpeech-Tokenization-TextToSentences
          - PartOfSpeech-Tagging-EndToEnd
        tests:
          - PartOfSpeech_Tagging_Tokens_AreTaggedAsGiven

      - id: PartOfSpeech-Lib-Confidence
        title: >-
          Each tag of a result shall carry a confidence between 0 and 1 and the ranked alternative tags with their
          probabilities.
        tags: [system]
        justification: |
          A tag without a measure of certainty cannot be used to decide whether to trust it, ask a person or try another
          reading; the alternatives show what the competing readings were.
        children:
          - PartOfSpeech-Tagging-RankedAlternatives
        tests:
          - PartOfSpeech_Tagging_Confidence_ProbabilitiesSumToOneAndAreOrdered

      - id: PartOfSpeech-Lib-LexiconRestriction
        title: >-
          A word that the lexicon knows shall receive only a tag that the lexicon and the token-shape rules allow for
          it, and a word that the lexicon does not know shall be able to receive any of the 17 tags.
        tags: [system]
        justification: |
          The lexicon records which tags a word can carry in real text. Restricting a known word to them removes tag
          errors that no reading of the word supports, and leaving an unknown word unrestricted lets names and new words
          still be tagged.
        children:
          - PartOfSpeech-Tagging-LexiconRestriction
        tests:
          - PartOfSpeech_Tagging_KnownWord_StaysWithinAllowedTags
          - PartOfSpeech_Tagging_UnknownWord_MayTakeAnyTag

      - id: PartOfSpeech-Lib-Constraints
        title: >-
          A caller shall be able to constrain the tag of an individual token, either by an allowed set of tags or by
          adding a preference to or removing a preference from the score of a tag.
        tags: [system]
        justification: |
          Callers often know something that the model does not, for example from a glossary or from markup, and must be
          able to inject it without retraining; a soft preference lets the model still disagree when it is certain.
        children:
          - PartOfSpeech-Upos-SetOperations
          - PartOfSpeech-Tagging-Constraints
        tests:
          - PartOfSpeech_Tagging_Constraint_AllowedSetForcesTag
          - PartOfSpeech_Tagging_Constraint_BoostShiftsCloseDecision

      - id: PartOfSpeech-Lib-LoadModel
        title: >-
          The library shall load a weights file from a stream and shall reject a file that is damaged, is not a weights
          file or comes from a different format or feature version.
        tags: [system]
        justification: |
          Weights are data that callers supply or replace. A damaged or incompatible file must fail loudly when it is
          loaded instead of silently producing wrong tags.
        children:
          - PartOfSpeech-ModelStorage-VersionedFormats
          - PartOfSpeech-ModelStorage-TinyModelRoundTrip
          - PartOfSpeech-ModelStorage-LazyThreadSafeLoading
        tests:
          - PartOfSpeech_Model_LoadFromStream_TagsText
          - PartOfSpeech_Model_InvalidWeights_ThrowInvalidDataException

      - id: PartOfSpeech-Lib-DefaultModelUnavailable
        title: >-
          While the package contains no trained model, reading the default tagger shall throw an
          InvalidOperationException whose message says that no model is available.
        tags: [system]
        justification: |
          A placeholder model would produce tags that users might trust. Failing with a clear message until a trained
          model ships tells callers exactly what to do (load weights) and cannot be mistaken for a result. This
          requirement is replaced when the trained model is embedded.
        children:
          - PartOfSpeech-Tagging-Tagger-Default
          - PartOfSpeech-ModelStorage-EmbeddedModel-Weights
        tests:
          - PartOfSpeech_Default_NoEmbeddedModel_ThrowsInvalidOperationException

      - id: PartOfSpeech-Lib-ThreadSafe
        title: >-
          One tagger shall be usable from many threads at the same time and shall give the same results as when it is
          used from one thread.
        tags: [system]
        justification: |
          Services tag requests in parallel and share one loaded model, so concurrent use must be safe and must not
          change results.
        children:
          - PartOfSpeech-Tagging-Determinism
          - PartOfSpeech-Tagging-Tagger-ThreadSafe
        tests:
          - PartOfSpeech_Concurrency_ParallelTagging_MatchesSequential

      - id: PartOfSpeech-Lib-Throughput
        title: Tagging pre-tokenized text shall exceed 50,000 tokens per second on one thread.
        tags: [system, performance]
        justification: |
          Callers tag large collections of text; a tagger that is orders of magnitude slower than this bound would make
          that impractical. The bound is far below the measured speed so that a loaded build machine does not make the
          test fail.
        children:
          - PartOfSpeech-Tagging-TagDecoder-Throughput
          - PartOfSpeech-Tagging-TagDecoder-NoAllocation
          - PartOfSpeech-Tagging-FeatureExtractor-NoAllocation
        tests:
          - PartOfSpeech_Performance_SingleThread_ExceedsFiftyThousandTokensPerSecond

      - id: PartOfSpeech-Lib-NoRuntimeDependencies
        title: The package shall have no runtime package dependency.
        tags: [system]
        justification: |
          Consumers include build tools and plug-ins that cannot resolve extra packages, and every dependency adds a
          version conflict risk; the library therefore uses only the base class library.
        tests:
          - PartOfSpeech_Packaging_ProjectFile_HasNoRuntimePackageReferences

  - title: Data and Licensing
    requirements:
      - id: PartOfSpeech-Licensing-NoticeAttributesMasc
        title: >-
          The package shall include a third-party notice that attributes the MASC corpus with its title, creators,
          source link, license link and citation.
        tags: [system]
        justification: |
          The Creative Commons Attribution 3.0 United States license of MASC requires attribution to its creators, a
          link to the license and an indication of the source to accompany every copy of the data or of a work derived
          from it.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Masc_IsAttributed

      - id: PartOfSpeech-Licensing-NoticeAttributesOewn
        title: >-
          The package shall include a third-party notice that attributes Open English WordNet with its title, creator,
          source links and license link.
        tags: [system]
        justification: |
          The Creative Commons Attribution 4.0 International license of Open English WordNet requires attribution to its
          creators, a link to the license and an indication of the source to accompany every copy of the data or of a
          work derived from it.
        tests:
          - PartOfSpeech_ThirdPartyNotices_OpenEnglishWordNet_IsAttributed

      - id: PartOfSpeech-Licensing-NoticeStatesChanges
        title: >-
          The third-party notice shall state that the MASC data and the Open English WordNet data were converted by this
          project.
        tags: [system]
        justification: |
          Both Creative Commons Attribution licenses require an indication of whether the licensed material was
          modified, and the converted data is not the original data.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Changes_AreStated

      - id: PartOfSpeech-Licensing-NoticePrincetonLicense
        title: The third-party notice shall reproduce the Princeton WordNet license.
        tags: [system]
        justification: |
          Open English WordNet carries the Princeton WordNet license, which requires its copyright notice, license text
          and disclaimer to appear in all copies of the database and of its derivatives.
        tests:
          - PartOfSpeech_ThirdPartyNotices_PrincetonLicense_IsReproduced

      - id: PartOfSpeech-Licensing-NoticePackaged
        title: The third-party notice shall be packed at the root of the NuGet package.
        tags: [system]
        justification: |
          Consumers receive the library as a NuGet package, so the attribution and license notices must be in the
          package itself for the license obligations to travel with every copy that is redistributed.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Packaging_NoticeIsPackedAtPackageRoot

      - id: PartOfSpeech-Licensing-FoldersDeclareLicense
        title: >-
          Each data folder shall declare a license that is CC0, CC BY, public domain or the project license.
        tags: [system]
        justification: |
          The library and its data are distributed under permissive terms. A folder without a declared license, or with
          one outside this set, would leave its users without a clear grant of rights.
        tests:
          - PartOfSpeech_DataLicensing_Folders_DeclareAllowedLicenses

      - id: PartOfSpeech-Licensing-OpenLicensesOnly
        title: >-
          No source document of the training and evaluation data shall be recorded under a share-alike,
          non-commercial or no-derivatives license.
        tags: [system]
        justification: |
          Share-alike, non-commercial and no-derivatives data would impose conditions on the library and its users that
          the project does not accept.
        tests:
          - PartOfSpeech_DataLicensing_SourceTables_RecordNoRestrictedLicense

      - id: PartOfSpeech-Licensing-UdEwtNotCommitted
        title: The repository shall not contain any UD English-EWT data.
        tags: [system]
        justification: |
          UD English-EWT is licensed CC BY-SA 4.0, a share-alike license, so it is used for evaluation only and is
          fetched on demand instead of being redistributed.
        tests:
          - PartOfSpeech_DataLicensing_UdEwt_IsNotCommitted

      - id: PartOfSpeech-Licensing-RestrictedCorporaNotCommitted
        title: The repository shall not contain any SemCor or Brown corpus data.
        tags: [system]
        justification: |
          SemCor and the Brown corpus are available only under restricted or fair-use-only terms that do not allow
          redistribution with the library.
        tests:
          - PartOfSpeech_DataLicensing_RestrictedCorpora_AreNotCommitted

      - id: PartOfSpeech-Data-ReadmeRecordsProvenance
        title: >-
          Each data folder shall have a README that records the source of the data, its license, the pinned input and
          the script that produced it.
        tags: [system]
        justification: |
          Reviewers and consumers must be able to establish where each data set came from, under which license, and how
          it was produced, so that results are reproducible.
        tests:
          - PartOfSpeech_DataProvenance_Readmes_RecordSourceAndProduction

      - id: PartOfSpeech-Data-SourcesListDocuments
        title: >-
          Every source document of the training and evaluation data shall appear in the source list of its data folder.
        tags: [system]
        justification: |
          A document that no source list names has no recorded origin or license basis, so its use cannot be justified.
        tests:
          - PartOfSpeech_DataProvenance_Sources_ListEveryDocument

      - id: PartOfSpeech-Data-SourceRowsRecordLicense
        title: >-
          Every row of a source list shall record an allowed license class and a positive sentence count and, except in
          the list of MASC, a well-formed URL.
        tags: [system]
        justification: |
          A source row is the evidence for the license of a document; an unknown license class or a link that cannot be
          followed leaves that evidence unusable. MASC is one corpus with one license, so its list records that license
          and the counts of each document, which must equal the counts of the corpus file.
        tests:
          - PartOfSpeech_DataProvenance_Sources_RowsRecordLicenseAndUrl

      - id: PartOfSpeech-Data-ManifestComplete
        title: The checksum manifest shall list exactly the committed data files.
        tags: [system]
        justification: |
          A data file that the manifest does not list can change without notice, and a listed file that is missing
          shows that the manifest is out of date.
        tests:
          - PartOfSpeech_DataProvenance_Manifest_ListsExactlyTheCommittedFiles

      - id: PartOfSpeech-Data-ChecksumsMatch
        title: Each committed data file shall match the size and SHA-256 recorded in the checksum manifest.
        tags: [system]
        justification: |
          Reviewers must be able to establish that the committed files are the files that were produced and reviewed, so
          that silent changes are detected.
        tests:
          - PartOfSpeech_DataProvenance_Manifest_ChecksumsMatchCommittedFiles

      - id: PartOfSpeech-Data-UniversalTags
        title: Every committed token-level corpus shall be labeled with the 17 Universal POS tags only.
        tags: [system]
        justification: |
          The library tags text with the 17 Universal POS tags. Training and evaluation data in any other tag set would
          require undocumented conversion and would make accuracy measurements incomparable.
        tests:
          - PartOfSpeech_TrainingData_Corpora_UseOnlySeventeenUposTags

      - id: PartOfSpeech-Data-TokensRejoinSentence
        title: >-
          The tokens of every sentence of each committed token-level corpus shall concatenate, ignoring spaces, to the
          text of the sentence.
        tags: [system]
        justification: |
          The token rows are the training and evaluation signal and the sentence text is the record of the source. A
          token that was dropped, split differently or altered would silently mislabel the data or change what the
          tagger is measured on, so the two must agree for every sentence.
        tests:
          - PartOfSpeech_TrainingData_Corpora_TokensRejoinToSentenceText

      - id: PartOfSpeech-Data-CoarseClasses
        title: >-
          Every committed single-target evaluation set shall be labeled with the documented coarse classes only.
        tags: [system]
        justification: |
          The single-target sets label one word per sentence with a coarse class that the Universal POS tags map to. A
          label outside the documented classes could not be compared with the tagger output.
        tests:
          - PartOfSpeech_EvaluationData_SingleTargetSets_UseOnlyDocumentedClasses

      - id: PartOfSpeech-Data-NoSharedDocument
        title: No training document shall be an evaluation document.
        tags: [system]
        justification: |
          Accuracy measured on documents that the tagger was trained on overstates its quality, so the evaluation sets
          must be disjoint from the training data by document.
        tests:
          - PartOfSpeech_Leakage_Documents_TrainingAndEvaluationAreDisjoint

      - id: PartOfSpeech-Data-NoSharedSentence
        title: No training sentence, of any length, shall appear in any committed evaluation set.
        tags: [system]
        justification: |
          Accuracy measured on sentences that the tagger was trained on overstates its quality, and a short sentence is
          as much an exact duplicate as a long one, so the evaluation sets must be disjoint from the training data by
          sentence.
        tests:
          - PartOfSpeech_Leakage_Sentences_TrainingAndEvaluationAreDisjoint

      - id: PartOfSpeech-Data-LeakageReportClean
        title: >-
          The committed leakage report shall show no document overlap and no exact sentence overlap between any training
          set and any evaluation set, UD English-EWT included.
        tags: [system]
        justification: |
          UD English-EWT is not committed, so the committed report is the evidence that the training data was checked
          against it; the report must show that no overlap remains.
        tests:
          - PartOfSpeech_Leakage_Report_RecordsNoOverlaps

      - id: PartOfSpeech-Data-LexiconTrainCoverage
        title: >-
          The lexicon shall allow the gold tag for at least 99.9% of the non-disputed tokens of the training set.
        tags: [system]
        justification: |
          The lexicon restricts the tags that the tagger considers for a known word. A restriction that excludes the
          correct tag more than once in a thousand tokens would cap the accuracy of the tagger below its target.
        tests:
          - PartOfSpeech_Lexicon_Coverage_Train_MeetsThreshold

      - id: PartOfSpeech-Data-LexiconDevCoverage
        title: >-
          The lexicon shall allow the gold tag for at least 99.9% of the non-disputed tokens of the development set.
        tags: [system]
        justification: |
          Coverage of the training set is reached by construction; coverage of the development set shows that the
          lexicon also allows the correct tag for words that it was not built from.
        tests:
          - PartOfSpeech_Lexicon_Coverage_Dev_MeetsThreshold

      - id: PartOfSpeech-Data-LexiconWellFormed
        title: >-
          The lexicon shall consist of unique rows, sorted by the bytes of their UTF-8 encoding, that each pair a
          spelling with alphabetical Universal POS tags.
        tags: [system]
        justification: |
          Consumers load the lexicon as a table of unique spellings in a fixed order; an unsorted or duplicated row or
          an invalid tag would give wrong results for the affected spelling.
        tests:
          - PartOfSpeech_Lexicon_Format_RowsAreSortedUniqueAndValid

      - id: PartOfSpeech-Data-LexiconHeaderCounts
        title: The header of the lexicon shall state the number of spellings and of tag entries that its rows contain.
        tags: [system]
        justification: |
          Readers check the counts in the header against the rows to detect a truncated file or a header and rows that
          come from different builds.
        tests:
          - PartOfSpeech_Lexicon_Format_HeaderCountsMatchRows

      - id: PartOfSpeech-Data-EmbeddedLexiconCurrent
        title: >-
          The lexicon that is embedded in the package shall encode exactly the spellings and tags of the lexicon
          table.
        tags: [system]
        justification: |
          The tagger restricts known words with the embedded lexicon, not with the table. A committed binary that no
          longer matches the table would silently apply stale restrictions, so the package must provably carry the
          current data.
        children:
          - PartOfSpeech-ModelStorage-LexiconCompiled
        tests:
          - PartOfSpeech_Lexicon_Embedded_EncodesLexiconTsv

  - title: API Documentation
    requirements:
      - id: PartOfSpeech-Lib-ApiDocsPackaged
        title: >-
          The NuGet package shall contain the generated Markdown API reference of the public API, including its
          namespace overview and documented examples.
        tags: [system]
        justification: |
          Consumers, and the coding agents that work for them, learn the API from the package itself rather than from
          the repository. The reference is generated from the XML documentation comments during the build, which fails
          if a public member is undocumented; the documented examples are compiled by the test suite so that they cannot
          go stale; and the generated reference is packed under api/ so that it travels with every copy of the library.
        tests:
          - ApiMark_ApiDocsPackaged
          - PartOfSpeech_XmlDocExamples_Compile
