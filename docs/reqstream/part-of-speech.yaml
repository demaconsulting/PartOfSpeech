---
# Software System Requirements for Part Of Speech
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.
# Each library requirement is decomposed into the subsystem and unit requirements under
# docs/reqstream/part-of-speech/ (Upos, Tokenization, ModelStorage, Tagging and ModelTrainer).

sections:
  - title: Library API
    requirements:
      - id: PartOfSpeech-Lib-TagText
        title: >-
          The library shall split English text into sentences and tokens and assign each token one of the 17 Universal
          POS tags.
        tags: [system]
        justification: |
          This is the purpose of the library: callers hand over running text and learn the part of speech of every word,
          in a tag set that is shared with other tools.
        children:
          - PartOfSpeech-Upos-SeventeenTags
          - PartOfSpeech-Upos-TagStrings
          - PartOfSpeech-Tokenization-TextToSentences
          - PartOfSpeech-Tokenization-MatchesCorpusConvention
          - PartOfSpeech-Tokenization-SentenceBoundaries
          - PartOfSpeech-Tagging-EndToEnd
          - PartOfSpeech-Tagging-TagHistory
        tests:
          - PartOfSpeech_Tagging_Text_TagsEveryTokenWithEmbeddedLexicon
          - PartOfSpeech_Tagging_Text_MultipleSentences_AreSplitAndTagged

      - id: PartOfSpeech-Lib-Offsets
        title: Every sentence and every token of a result shall carry character offsets into the original string.
        tags: [system]
        justification: |
          Callers highlight, replace or link the words of their own text, which needs the position of each token in that
          text and not only its spelling.
        children:
          - PartOfSpeech-Tokenization-TextToSentences
          - PartOfSpeech-Tagging-EndToEnd
        tests:
          - PartOfSpeech_Tagging_Text_OffsetsIndexTheOriginalString

      - id: PartOfSpeech-Lib-PreTokenized
        title: The library shall tag sentences that the caller has already split into tokens.
        tags: [system]
        justification: |
          Callers that own a tokenizer, or that tag the output of another tool, must be able to keep their own token
          boundaries.
        children:
          - PartOfSpeech-Tokenization-TextToSentences
          - PartOfSpeech-Tagging-EndToEnd
        tests:
          - PartOfSpeech_Tagging_Tokens_AreTaggedAsGiven

      - id: PartOfSpeech-Lib-Confidence
        title: >-
          Each tag of a result shall carry a confidence between 0 and 1 and the ranked alternative tags with their
          probabilities.
        tags: [system]
        justification: |
          A tag without a measure of certainty cannot be used to decide whether to trust it, ask a person or try another
          reading; the alternatives show what the competing readings were.
        children:
          - PartOfSpeech-Tagging-RankedAlternatives
        tests:
          - PartOfSpeech_Tagging_Confidence_ProbabilitiesSumToOneAndAreOrdered

      - id: PartOfSpeech-Lib-LexiconRestriction
        title: >-
          A word that the lexicon knows shall receive only a tag that the lexicon and the token-shape rules allow for
          it, and a word that the lexicon does not know shall be able to receive any of the 17 tags.
        tags: [system]
        justification: |
          The lexicon records which tags a word can carry in real text. Restricting a known word to them removes tag
          errors that no reading of the word supports, and leaving an unknown word unrestricted lets names and new words
          still be tagged.
        children:
          - PartOfSpeech-Tagging-LexiconRestriction
        tests:
          - PartOfSpeech_Tagging_KnownWord_StaysWithinAllowedTags
          - PartOfSpeech_Tagging_UnknownWord_MayTakeAnyTag

      - id: PartOfSpeech-Lib-Constraints
        title: >-
          A caller shall be able to constrain the tag of an individual token, either by an allowed set of tags or by
          adding a preference to or removing a preference from the score of a tag.
        tags: [system]
        justification: |
          Callers often know something that the model does not, for example from a glossary or from markup, and must be
          able to inject it without retraining; a soft preference lets the model still disagree when it is certain.
        children:
          - PartOfSpeech-Upos-SetOperations
          - PartOfSpeech-Tagging-Constraints
        tests:
          - PartOfSpeech_Tagging_Constraint_AllowedSetForcesTag
          - PartOfSpeech_Tagging_Constraint_BoostShiftsCloseDecision

      - id: PartOfSpeech-Lib-Glossary
        title: >-
          A caller shall be able to hand the tagger a glossary of single-word and multiword terms with the tags that
          the head word of each term may take, in hard mode (the default: the head word takes only those tags, so a
          wrong entry forces a wrong tag) or soft mode (those
          tags are preferred and the model can still disagree), and the tagger shall apply it to every occurrence of
          the terms in the text.
        tags: [system]
        justification: |
          In technical text the costly error is a confident wrong tag on a domain term, and the glossary of the domain
          already knows the right answer; a caller must be able to state it once, without retraining, and choose
          between certainty (a curated glossary) and a safeguard against wrong entries (a glossary that is not
          curated or may be wrong).
        children:
          - PartOfSpeech-Tagging-Glossary
        tests:
          - PartOfSpeech_Glossary_HardEntry_ForcesHeadTag
          - PartOfSpeech_Glossary_SoftEntry_PreferenceShiftsCloseDecision
          - PartOfSpeech_Glossary_DocumentedExamples_GiveTheClaimedResults

      - id: PartOfSpeech-Lib-GlossaryResults
        title: >-
          Each result shall report the glossary terms that were found, with the entry (and its definition), the tokens,
          the head token and the offsets into the original string.
        tags: [system]
        justification: |
          Callers highlight terms, show their definitions and review what the glossary decided, which needs the match
          and not only the tag.
        children:
          - PartOfSpeech-Tagging-GlossaryResults
        tests:
          - PartOfSpeech_Glossary_Results_ReportMatchesOnTokensAndSentences

      - id: PartOfSpeech-Lib-LoadModel
        title: >-
          The library shall load a weights file from a stream and shall reject a file that is damaged, is not a weights
          file or comes from a different format or feature version.
        tags: [system]
        justification: |
          Weights are data that callers supply or replace. A damaged or incompatible file must fail loudly when it is
          loaded instead of silently producing wrong tags.
        children:
          - PartOfSpeech-ModelStorage-VersionedFormats
          - PartOfSpeech-ModelStorage-TinyModelRoundTrip
          - PartOfSpeech-ModelStorage-LazyThreadSafeLoading
        tests:
          - PartOfSpeech_Model_LoadFromStream_TagsText
          - PartOfSpeech_Model_InvalidWeights_ThrowInvalidDataException

      - id: PartOfSpeech-Lib-DefaultModel
        title: >-
          The library shall provide a default tagger that uses the trained model and the lexicon embedded in the
          package, tags text without any file, and is shared by all callers.
        tags: [system]
        justification: |
          Most callers want tags without sourcing and loading a model file; the package therefore ships a trained model,
          and one shared instance avoids loading it again and again. The model is the one that the build proves current
          (see the embedded model requirements below).
        children:
          - PartOfSpeech-Tagging-Tagger-Default
          - PartOfSpeech-ModelStorage-EmbeddedModel-Weights
        tests:
          - PartOfSpeech_Default_EmbeddedModel_TagsTextWithoutFile

      - id: PartOfSpeech-Lib-ThreadSafe
        title: >-
          One tagger shall be usable from many threads at the same time and shall give the same results as when it is
          used from one thread.
        tags: [system]
        justification: |
          Services tag requests in parallel and share one loaded model, so concurrent use must be safe and must not
          change results.
        children:
          - PartOfSpeech-Tagging-Determinism
          - PartOfSpeech-Tagging-Tagger-ThreadSafe
          - PartOfSpeech-Tagging-Glossary-ThreadSafe
        tests:
          - PartOfSpeech_Concurrency_ParallelTagging_MatchesSequential
          - PartOfSpeech_Concurrency_GlossaryTagging_MatchesSequential

      - id: PartOfSpeech-Lib-Throughput
        title: Tagging pre-tokenized text shall exceed 50,000 tokens per second on one thread.
        tags: [system, performance]
        justification: |
          Callers tag large collections of text; a tagger that is orders of magnitude slower than this bound would make
          that impractical. The bound is far below the measured speed so that a loaded build machine does not make the
          test fail. The bound is enforced in runs without code coverage; in a run with code coverage (the CI
          pipeline), whose instrumentation slows the hot loops by a factor of 20 or more, the tests apply a relaxed
          bound of 5,000 tokens per second, and the verification document states that only the run without coverage
          proves the 50,000 figure.
        children:
          - PartOfSpeech-Tagging-TagDecoder-Throughput
          - PartOfSpeech-Tagging-TagDecoder-NoAllocation
          - PartOfSpeech-Tagging-FeatureExtractor-NoAllocation
        tests:
          - PartOfSpeech_Performance_SingleThread_ExceedsFiftyThousandTokensPerSecond

      - id: PartOfSpeech-Lib-GlossaryThroughput
        title: >-
          Tagging pre-tokenized text with a glossary of 10,000 entries shall exceed 50,000 tokens per second on one
          thread.
        tags: [system, performance]
        justification: |
          A glossary must not make tagging impractically slow, whatever its size. The bound is the one of tagging
          without a glossary, enforced in runs without code coverage and relaxed in a run with code coverage in the same
          way (see the verification document); the unit requirements prove that matching itself is far faster and
          allocates nothing per token.
        children:
          - PartOfSpeech-Tagging-Glossary-Throughput
          - PartOfSpeech-Tagging-Glossary-NoAllocation
        tests:
          - PartOfSpeech_Performance_GlossaryTagging_ExceedsFiftyThousandTokensPerSecond

      - id: PartOfSpeech-Lib-NoRuntimeDependencies
        title: The package shall have no runtime package dependency.
        tags: [system]
        justification: |
          Consumers include build tools and plug-ins that cannot resolve extra packages, and every dependency adds a
          version conflict risk; the library therefore uses only the base class library.
        tests:
          - PartOfSpeech_Packaging_ProjectFile_HasNoRuntimePackageReferences

  - title: Data and Licensing
    requirements:
      - id: PartOfSpeech-Licensing-NoticeAttributesMasc
        title: >-
          The package shall include a third-party notice that attributes the MASC corpus with its title, creators,
          source link, license link and citation.
        tags: [system]
        justification: |
          The Creative Commons Attribution 3.0 United States license of MASC requires attribution to its creators, a
          link to the license and an indication of the source to accompany every copy of the data or of a work derived
          from it.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Masc_IsAttributed

      - id: PartOfSpeech-Licensing-NoticeAttributesOewn
        title: >-
          The package shall include a third-party notice that attributes Open English WordNet with its title, creator,
          source links and license link.
        tags: [system]
        justification: |
          The Creative Commons Attribution 4.0 International license of Open English WordNet requires attribution to its
          creators, a link to the license and an indication of the source to accompany every copy of the data or of a
          work derived from it.
        tests:
          - PartOfSpeech_ThirdPartyNotices_OpenEnglishWordNet_IsAttributed

      - id: PartOfSpeech-Licensing-NoticeStatesChanges
        title: >-
          The third-party notice shall state that the MASC data and the Open English WordNet data were converted by this
          project.
        tags: [system]
        justification: |
          Both Creative Commons Attribution licenses require an indication of whether the licensed material was
          modified, and the converted data is not the original data.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Changes_AreStated

      - id: PartOfSpeech-Licensing-NoticePrincetonLicense
        title: The third-party notice shall reproduce the Princeton WordNet license.
        tags: [system]
        justification: |
          Open English WordNet carries the Princeton WordNet license, which requires its copyright notice, license text
          and disclaimer to appear in all copies of the database and of its derivatives.
        tests:
          - PartOfSpeech_ThirdPartyNotices_PrincetonLicense_IsReproduced

      - id: PartOfSpeech-Licensing-NoticePackaged
        title: The third-party notice shall be packed at the root of the NuGet package.
        tags: [system]
        justification: |
          Consumers receive the library as a NuGet package, so the attribution and license notices must be in the
          package itself for the license obligations to travel with every copy that is redistributed.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Packaging_NoticeIsPackedAtPackageRoot

      - id: PartOfSpeech-Licensing-NoticeCoversWeights
        title: >-
          The third-party notice shall state that the embedded weights were learned from the converted MASC data and
          the other training corpora, and shall name the trainer, its settings and its run log.
        tags: [system]
        justification: |
          The trained weights are derived in part from MASC, whose Creative Commons Attribution 3.0 United States
          license requires attribution and an indication of changes for the work and for what is derived from it, so the
          notice that travels with the package must say that the weights are covered and where they come from.
        tests:
          - PartOfSpeech_ThirdPartyNotices_Weights_AreCovered

      - id: PartOfSpeech-Licensing-PackageLicenseFile
        title: >-
          The package shall name a combined license file instead of a license expression; the file shall start with the
          SPDX expression of the package, contain the MIT license text for the code, cover the embedded lexicon and
          weights with their Creative Commons licenses, point to the third-party notice, and be packed at the package
          root.
        tags: [system]
        justification: |
          The package embeds data under CC BY 4.0 (the lexicon) and CC BY 3.0 US (the weights and the lexicon tags),
          next to the MIT code. nuget.org accepts only license expressions of licenses that the Open Source Initiative
          or the Free Software Foundation approve, and CC BY 3.0 US is neither (checked against the SPDX license list
          data), so the expression "MIT AND CC-BY-4.0 AND CC-BY-3.0-US" would be rejected and plain "MIT" would
          under-declare the embedded data. A package has either a license expression or a license file, so the file
          names all licenses and keeps the SPDX expression on its first line for scanners.
        tests:
          - PartOfSpeech_PackageLicense_ProjectFile_NamesLicenseFileAtPackageRoot
          - PartOfSpeech_PackageLicense_File_CoversCodeAndEmbeddedData
          - Package_LicenseFilesPackaged

      - id: PartOfSpeech-Licensing-FoldersDeclareLicense
        title: >-
          Each data folder shall declare a license that is CC0, CC BY, public domain or the project license.
        tags: [system]
        justification: |
          The library and its data are distributed under permissive terms. A folder without a declared license, or with
          one outside this set, would leave its users without a clear grant of rights.
        tests:
          - PartOfSpeech_DataLicensing_Folders_DeclareAllowedLicenses

      - id: PartOfSpeech-Licensing-OpenLicensesOnly
        title: >-
          No source document of the training and evaluation data shall be recorded under a share-alike,
          non-commercial or no-derivatives license.
        tags: [system]
        justification: |
          Share-alike, non-commercial and no-derivatives data would impose conditions on the library and its users that
          the project does not accept.
        tests:
          - PartOfSpeech_DataLicensing_SourceTables_RecordNoRestrictedLicense
          - PartOfSpeech_DataLicensing_Corrections_AreCoveredByTheLicenseGate

      - id: PartOfSpeech-Licensing-UdEwtNotCommitted
        title: The repository shall not contain any UD English-EWT data.
        tags: [system]
        justification: |
          UD English-EWT is licensed CC BY-SA 4.0, a share-alike license, so it is used for evaluation only and is
          fetched on demand instead of being redistributed.
        tests:
          - PartOfSpeech_DataLicensing_UdEwt_IsNotCommitted

      - id: PartOfSpeech-Licensing-RestrictedCorporaNotCommitted
        title: The repository shall not contain any SemCor or Brown corpus data.
        tags: [system]
        justification: |
          SemCor and the Brown corpus are available only under restricted or fair-use-only terms that do not allow
          redistribution with the library.
        tests:
          - PartOfSpeech_DataLicensing_RestrictedCorpora_AreNotCommitted

      - id: PartOfSpeech-Data-ReadmeRecordsProvenance
        title: >-
          Each data folder shall have a README that records the source of the data, its license, the pinned input and
          the script that produced it.
        tags: [system]
        justification: |
          Reviewers and consumers must be able to establish where each data set came from, under which license, and how
          it was produced, so that results are reproducible.
        tests:
          - PartOfSpeech_DataProvenance_Readmes_RecordSourceAndProduction

      - id: PartOfSpeech-Data-SourcesListDocuments
        title: >-
          Every source document of the training and evaluation data shall appear in the source list of its data folder.
        tags: [system]
        justification: |
          A document that no source list names has no recorded origin or license basis, so its use cannot be justified.
        tests:
          - PartOfSpeech_DataProvenance_Sources_ListEveryDocument

      - id: PartOfSpeech-Data-SourceRowsRecordLicense
        title: >-
          Every row of a source list shall record an allowed license class and a positive sentence count and, except in
          the list of MASC, a well-formed URL.
        tags: [system]
        justification: |
          A source row is the evidence for the license of a document; an unknown license class or a link that cannot be
          followed leaves that evidence unusable. MASC is one corpus with one license, so its list records that license
          and the counts of each document, which must equal the counts of the corpus file.
        tests:
          - PartOfSpeech_DataProvenance_Sources_RowsRecordLicenseAndUrl

      - id: PartOfSpeech-Data-ManifestComplete
        title: The checksum manifest shall list exactly the committed data files.
        tags: [system]
        justification: |
          A data file that the manifest does not list can change without notice, and a listed file that is missing
          shows that the manifest is out of date.
        tests:
          - PartOfSpeech_DataProvenance_Manifest_ListsExactlyTheCommittedFiles

      - id: PartOfSpeech-Data-ChecksumsMatch
        title: Each committed data file shall match the size and SHA-256 recorded in the checksum manifest.
        tags: [system]
        justification: |
          Reviewers must be able to establish that the committed files are the files that were produced and reviewed, so
          that silent changes are detected.
        tests:
          - PartOfSpeech_DataProvenance_Manifest_ChecksumsMatchCommittedFiles

      - id: PartOfSpeech-Data-CorrectionsWellFormed
        title: >-
          Every staged corpus correction shall be a well-formed row of the documented tables, with a valid address,
          tags, statuses and provenance, in key order and without a second row for a token in the same table.
        tags: [system]
        justification: |
          The staged corrections are the evidence for every label that a later change applies to the corpora. A row with
          an illegal address, a tag outside the 17, a status cell that the corpus readers refuse, no change, or no
          provenance, or two rows for one token in a table, could not be applied or reviewed safely. A candidate row
          with a malformed span, current tag or status, or an empty hint, would mislead the adjudication the same way,
          so the fields of the candidates are validated before and after the application of the corrections alike. The
          row validation is also run on shared cases that the Python validator of the overlay uses, so that the two
          implementations cannot diverge.
        tests:
          - PartOfSpeech_DataCorrections_Tables_AreWellFormed
          - PartOfSpeech_DataCorrections_RowCases_MatchSharedFixture
          - PartOfSpeech_DataCorrections_CandidateCases_MatchSharedFixture

      - id: PartOfSpeech-Data-CorrectionsMatchCorpora
        title: >-
          Every staged correction and every recorded exception shall address an existing token of a committed corpus,
          and the corrections in effect shall match the corpora either all before or all after their application.
        tags: [system]
        justification: |
          A correction that names a missing sentence, a shifted token index or another word, or that expects a label
          that the corpus does not have, would change the wrong token or nothing at all when it is applied. Accepting
          the corpora both before and after the application keeps the table valid as the evidence of the change; a
          mixture shows a partial application.
        tests:
          - PartOfSpeech_DataCorrections_Rows_MatchCommittedCorpora

      - id: PartOfSpeech-Data-AdjudicatedCorrectionsAreRecorded
        title: >-
          Every adjudicated correction shall be an `llm:opus+sol:<batch>` decision row that changes the tag, the flags
          or the disputed status of one token, and a token that also has a mechanical row shall start from the same
          corpus value.
        tags: [system]
        justification: |
          The adjudicated rows are the evidence of the later relabeling by two blind taggers. A row with a rule
          provenance there, a row that changes more than one aspect of the status, or a second row for a token that does
          not start from the value of its mechanical row would be applied twice or would misstate what the taggers
          decided. A mechanical row that an adjudicated row replaces is only ignored, so the replacement is legal only
          when both rows start from the same corpus value and make different changes.
        tests:
          - PartOfSpeech_DataCorrections_Adjudicated_RowsAreLlmDecisions

      - id: PartOfSpeech-Adjudication-BlindExportCarriesNoLabels
        title: >-
          The blind batches for the taggers shall hold only an opaque sentence id, the token index and the token text of
          each token, with no label, status, flag, source, split or sentence id, and the key shall stay outside them.
        tags: [system]
        justification: |
          The two taggers are independent only if they decide from the sentence and the conventions alone. A batch that
          shows the corpus label, a flag, a detector or the sentence id would let the models copy the label that is in
          doubt, so the export is tested for the exact columns, the opaque ids and the location of the key.
        tests:
          - test_a_batch_file_has_exactly_three_columns_and_nothing_that_identifies_a_label_or_a_sentence
          - test_the_ids_are_unique_opaque_and_deterministic
          - test_the_key_stays_outside_the_batches_folder_and_names_the_corpus_sentence
          - test_check_batches_passes_and_finds_a_fourth_column_a_changed_token_and_a_missing_row

      - id: PartOfSpeech-Adjudication-OutputIsValidated
        title: >-
          A tagger output shall be accepted only when it repeats the batch row for row and every tag, confidence and
          flag cell is in its vocabulary.
        tags: [system]
        justification: |
          A truncated, reordered or misspelled output would give a vote to the wrong token or no vote at all. The check
          covers the header, the row count and order, the three copied cells, the 17 tags, the confidences and the flag
          cells, and a part file set without a gap, so that no output is repaired by hand or accepted by accident.
        tests:
          - test_a_correct_output_has_no_error
          - test_each_kind_of_defect_is_found
          - test_the_output_is_one_file_or_numbered_parts_but_not_both_and_without_gaps
          - test_a_wrong_header_a_blank_line_and_a_bom_are_refused

      - id: PartOfSpeech-Adjudication-RetryLimitIsEnforced
        title: >-
          An invalid tagger output shall be asked for again once; the second invalid output shall mark the batch as
          skipped, no further attempt shall be recorded, and the sentences of a skipped batch shall not be decided.
        tags: [system]
        justification: |
          A batch that no model can tag completely must not hold up the work or enter it half done. The limit is a
          property of the state table, not of the operator, so the attempt counter never passes it, a skipped state is
          final, and the decision step lists the batch as not used.
        tests:
          - test_an_invalid_output_is_asked_for_once_more_and_the_second_failure_skips_the_batch
          - test_a_skipped_state_is_final_even_when_a_valid_output_appears_later
          - test_the_attempt_counter_never_passes_the_limit_and_a_valid_retry_is_accepted
          - test_a_skipped_batch_is_not_decided_and_is_listed_as_incomplete
          - test_export_status_and_validate_output

      - id: PartOfSpeech-Adjudication-DecisionRule
        title: >-
          Where both models give the same tag that differs from the label the tool shall stage a correction, where they
          give different tags it shall stage a disputed mark, and where both confirm the label it shall stage nothing
          except an agreed change of the flags.
        tags: [system]
        justification: |
          The staged rows are the decisions that a later change applies. A correction needs two independent models to
          agree against the label, a disagreement is an unsettled case and must not be turned into a tag, and a label
          that both confirm needs no row. The table of cases covers every outcome, including the flags and the
          mechanical rows, and each staged row is a valid row of one of the three kinds.
        tests:
          - test_the_decision_table
          - test_every_staged_row_is_valid_and_one_of_the_three_kinds
          - test_the_effective_flags_follow_the_agreement_per_flag

      - id: PartOfSpeech-Adjudication-DecisionScope
        title: >-
          The tool shall decide only the candidate tokens, the tokens that the off-the-shelf taggers flag and the
          dependents of a candidate, and shall stage nothing for any other token of a selected sentence.
        tags: [system]
        justification: |
          The models tag whole sentences, but the cleanup is limited to the cases that need a judgment. A correction at
          any other token would change the corpus outside the reviewed scope, so the decision set is tested and the
          tokens outside it are only counted.
        tests:
          - test_the_decision_set_is_candidates_voter_flags_and_dependents_without_masked_tokens
          - test_dependents_of_the_candidate_detectors
          - test_decide_writes_the_table_the_reports_and_the_superseded_note

      - id: PartOfSpeech-Adjudication-AdjudicatedRowsSupersedeMechanicalRows
        title: >-
          An adjudicated row shall replace the mechanical row of the same token when both start from the same corpus
          value and make different changes, the mechanical file shall stay as it is, and every other second row for a
          token shall be an error.
        tags: [system]
        justification: |
          The agreement of two models outranks a rule, but only for the token that they decided, so the overlay uses the
          effective rows for validation, application and the linter. A second row that starts from another value, or
          repeats the change, would be applied twice or would misstate the decision.
        tests:
          - test_an_adjudicated_row_replaces_the_mechanical_row_of_the_same_token
          - test_every_other_second_row_for_a_token_is_an_error
          - test_validate_applies_and_the_linter_use_the_effective_rows_and_the_files_stay_as_they_are
          - test_a_replacement_that_starts_from_another_value_fails_validate

      - id: PartOfSpeech-Adjudication-DroppedDetectorsLeaveNoCorrections
        title: >-
          When the review gate drops a detector, the tool shall leave out its tag and flag rows and keep its disputed
          marks, and a detector shall be dropped when its precision is below 90 percent with at least two incorrect
          rows.
        tags: [system]
        justification: |
          A detector whose corrections are not reliable enough must not change the corpus, while the unsettled tokens it
          found are still worth a mark. The gate and the drop are tested on the decision records and on the verdicts of
          the review.
        tests:
          - test_a_dropped_class_loses_its_tag_and_flag_rows_but_keeps_the_disputed_marks
          - test_the_gate_drops_a_class_below_ninety_percent_with_two_incorrect_or_over_thirty_percent_unclear
          - test_review_result_reads_the_verdicts_and_names_the_classes_to_drop

      - id: PartOfSpeech-Adjudication-TableHeaderIsStrict
        title: >-
          The adjudicated table shall carry exactly the metadata lines of the format (corpus, license, kind, columns,
          generator and one well-formed SHA-256 input line per corpus file), and a missing, repeated, malformed or
          unknown line shall be a validation error.
        tags: [system]
        justification: |
          The header names the data the decisions were made on and the license of the table. A table with a removed
          license line, a wrong kind or a malformed input hash could not be traced to the corpora, so the validator
          reports every such defect instead of reading only the rows.
        tests:
          - test_malformed_metadata_headers_of_the_adjudicated_table_are_findings
          - test_validate_reports_a_table_file_whose_metadata_lines_were_removed
          - test_findings_for_the_adjudicated_table

      - id: PartOfSpeech-Data-CandidatesAddressTokens
        title: Every correction candidate shall address an existing token of a committed corpus.
        tags: [system]
        justification: |
          The candidates are the work list of the adjudication that follows the mechanical corrections. A candidate
          that does not address the token it describes sends the reviewer to the wrong word, so each one must name an
          existing sentence, token and span.
        tests:
          - PartOfSpeech_DataCorrections_Candidates_AddressExistingTokens

      - id: PartOfSpeech-Data-UniversalTags
        title: Every committed token-level corpus shall be labeled with the 17 Universal POS tags only.
        tags: [system]
        justification: |
          The library tags text with the 17 Universal POS tags. Training and evaluation data in any other tag set would
          require undocumented conversion and would make accuracy measurements incomparable.
        tests:
          - PartOfSpeech_TrainingData_Corpora_UseOnlySeventeenUposTags

      - id: PartOfSpeech-Data-TokensRejoinSentence
        title: >-
          The tokens of every sentence of each committed token-level corpus shall concatenate, ignoring spaces, to the
          text of the sentence.
        tags: [system]
        justification: |
          The token rows are the training and evaluation signal and the sentence text is the record of the source. A
          token that was dropped, split differently or altered would silently mislabel the data or change what the
          tagger is measured on, so the two must agree for every sentence.
        tests:
          - PartOfSpeech_TrainingData_Corpora_TokensRejoinToSentenceText

      - id: PartOfSpeech-Data-CoarseClasses
        title: >-
          Every committed single-target evaluation set shall be labeled with the documented coarse classes only.
        tags: [system]
        justification: |
          The single-target sets label one word per sentence with a coarse class that the Universal POS tags map to. A
          label outside the documented classes could not be compared with the tagger output.
        tests:
          - PartOfSpeech_EvaluationData_SingleTargetSets_UseOnlyDocumentedClasses

      - id: PartOfSpeech-Data-NoSharedDocument
        title: No training document shall be an evaluation document.
        tags: [system]
        justification: |
          Accuracy measured on documents that the tagger was trained on overstates its quality, so the evaluation sets
          must be disjoint from the training data by document.
        tests:
          - PartOfSpeech_Leakage_Documents_TrainingAndEvaluationAreDisjoint

      - id: PartOfSpeech-Data-NoSharedSentence
        title: No training sentence, of any length, shall appear in any committed evaluation set.
        tags: [system]
        justification: |
          Accuracy measured on sentences that the tagger was trained on overstates its quality, and a short sentence is
          as much an exact duplicate as a long one, so the evaluation sets must be disjoint from the training data by
          sentence.
        tests:
          - PartOfSpeech_Leakage_Sentences_TrainingAndEvaluationAreDisjoint

      - id: PartOfSpeech-Data-LeakageReportClean
        title: >-
          The committed leakage report shall show no document overlap and no exact sentence overlap between any training
          set and any evaluation set, UD English-EWT included.
        tags: [system]
        justification: |
          UD English-EWT is not committed, so the committed report is the evidence that the training data was checked
          against it; the report must show that no overlap remains.
        tests:
          - PartOfSpeech_Leakage_Report_RecordsNoOverlaps

      - id: PartOfSpeech-Data-LexiconTrainCoverage
        title: >-
          The lexicon shall allow the gold tag for at least 99.9% of the non-disputed tokens of the training set.
        tags: [system]
        justification: |
          The lexicon restricts the tags that the tagger considers for a known word. A restriction that excludes the
          correct tag more than once in a thousand tokens would cap the accuracy of the tagger below its target.
        tests:
          - PartOfSpeech_Lexicon_Coverage_Train_MeetsThreshold

      - id: PartOfSpeech-Data-LexiconDevCoverage
        title: >-
          The lexicon shall allow the gold tag for at least 99.9% of the non-disputed tokens of the development set.
        tags: [system]
        justification: |
          Coverage of the training set is reached by construction; coverage of the development set shows that the
          lexicon also allows the correct tag for words that it was not built from.
        tests:
          - PartOfSpeech_Lexicon_Coverage_Dev_MeetsThreshold

      - id: PartOfSpeech-Data-LexiconWellFormed
        title: >-
          The lexicon shall consist of unique rows, sorted by the bytes of their UTF-8 encoding, that each pair a
          spelling with alphabetical Universal POS tags.
        tags: [system]
        justification: |
          Consumers load the lexicon as a table of unique spellings in a fixed order; an unsorted or duplicated row or
          an invalid tag would give wrong results for the affected spelling.
        tests:
          - PartOfSpeech_Lexicon_Format_RowsAreSortedUniqueAndValid

      - id: PartOfSpeech-Data-LexiconHeaderCounts
        title: The header of the lexicon shall state the number of spellings and of tag entries that its rows contain.
        tags: [system]
        justification: |
          Readers check the counts in the header against the rows to detect a truncated file or a header and rows that
          come from different builds.
        tests:
          - PartOfSpeech_Lexicon_Format_HeaderCountsMatchRows

      - id: PartOfSpeech-Data-EmbeddedLexiconCurrent
        title: >-
          The lexicon that is embedded in the package shall encode exactly the spellings and tags of the lexicon
          table.
        tags: [system]
        justification: |
          The tagger restricts known words with the embedded lexicon, not with the table. A committed binary that no
          longer matches the table would silently apply stale restrictions, so the package must provably carry the
          current data.
        children:
          - PartOfSpeech-ModelStorage-LexiconCompiled
        tests:
          - PartOfSpeech_Lexicon_Embedded_EncodesLexiconTsv

  - title: Embedded Model
    requirements:
      - id: PartOfSpeech-Model-EmbeddedWeightsCurrent
        title: >-
          The weights that are embedded in the package shall be the model that the committed training configuration
          describes: the same file as the committed one, with the recorded hash bits, scale, temperature and SHA-256 of
          the uncompressed image.
        tags: [system]
        justification: |
          The default tagger scores with the embedded weights. A binary that was edited or retrained without its
          configuration, or a configuration that no longer matches the binary, would ship a model that nobody reviewed
          and whose origin cannot be shown, so the normal test run compares the embedded file with the configuration.
          The build also retrains the model from the committed data (train --check) and compares it with the committed
          one, which the trainer requirements below make a reliable comparison; that build step is supplementary
          evidence.
        children:
          - PartOfSpeech-ModelTrainer-Deterministic
          - PartOfSpeech-ModelTrainer-SharedDefinitions
          - PartOfSpeech-ModelTrainer-ExactQuantization
          - PartOfSpeech-ModelTrainer-CheckDetectsStaleWeights
          - PartOfSpeech-ModelTrainer-ProtectsShippedWeights
        tests:
          - PartOfSpeech_Model_EmbeddedWeights_MatchTrainingConfig
          - PartOfSpeech_Model_EmbeddedWeights_SizeFiguresInDocs_AreCurrent

      - id: PartOfSpeech-Model-TrainedFromCommittedData
        title: >-
          The embedded weights shall be trained only from training corpora that are committed in the repository and
          whose licenses are allowed, and every choice that influenced the model shall be made on development data
          only, never on a held-out test or challenge set.
        tags: [system]
        justification: |
          The reported accuracy of the model is only honest if nothing about the model was tuned on the data that
          measures it, and the license obligations of the package depend on knowing exactly which corpora the weights
          come from. The trainer refuses held-out data by construction, and the configuration names its corpora. The one
          evaluation on held-out data is only possible after the confidence thresholds were selected on development data
          and committed, for the frozen model, and only once.
        children:
          - PartOfSpeech-ModelTrainer-DevOnlySelection
          - PartOfSpeech-ModelTrainer-HeldOutGate-SelectionRequired
          - PartOfSpeech-ModelTrainer-HeldOutGate-SelectionDerivedFromDevelopment
          - PartOfSpeech-ModelTrainer-HeldOutGate-InputsVerified
          - PartOfSpeech-ModelTrainer-HeldOutGate-RunsOnce
          - PartOfSpeech-ModelTrainer-HeldOutGate-PreflightCountsOnly
          - PartOfSpeech-ModelTrainer-HeldOutGate-DumpOutsideRepository
          - PartOfSpeech-ModelTrainer-CorpusTags
          - PartOfSpeech-ModelTrainer-CorpusStatusFlags-Kept
          - PartOfSpeech-ModelTrainer-CorpusStatusFlags-Validated
          - PartOfSpeech-ModelTrainer-NoSignalTokens
          - PartOfSpeech-ModelTrainer-NoSignalStepsAndHistory
          - PartOfSpeech-ModelTrainer-SourceWeights
          - PartOfSpeech-ModelTrainer-SourceLimits
          - PartOfSpeech-ModelTrainer-Configuration
          - PartOfSpeech-ModelTrainer-TrainingSettings
          - PartOfSpeech-ModelTrainer-DevMetrics
          - PartOfSpeech-ModelTrainer-GlossaryExperiment
          - PartOfSpeech-ModelTrainer-GlossaryEvaluation
        tests:
          - PartOfSpeech_Model_TrainingConfig_UsesOnlyCommittedTrainingCorpora

      - id: PartOfSpeech-Model-EvaluationReported
        title: >-
          The repository shall report the accuracy of the embedded model and its harmful noun-verb errors, with and
          without a confidence threshold, from one held-out evaluation of exactly that model with thresholds that were
          selected on development data first, and the report shall name the model, the selection and the input files
          that it used.
        tags: [system]
        justification: |
          A consumer can only judge how far to trust the tagger from a measurement that was made on data nothing was
          tuned on, for the model that is actually in the package. The results are a generated record that names the
          SHA-256 of the model image, of the committed selection of the thresholds and of every input file, so that a
          retrained model, a changed selection or a changed data file shows as a failing test until the evaluation is
          redone, and a few words of explanation (how to read the results, the limits and how to reproduce them) are
          kept next to the figures. The report never contains text of the external treebank, which is share-alike
          licensed and used locally only.
        children:
          - PartOfSpeech-ModelTrainer-HeldOutGate-SelectionRequired
          - PartOfSpeech-ModelTrainer-HeldOutGate-SelectionDerivedFromDevelopment
          - PartOfSpeech-ModelTrainer-HeldOutGate-InputsVerified
          - PartOfSpeech-ModelTrainer-HeldOutGate-RunsOnce
          - PartOfSpeech-ModelTrainer-HeldOutGate-PreflightCountsOnly
          - PartOfSpeech-ModelTrainer-HeldOutGate-DumpOutsideRepository
          - PartOfSpeech-ModelTrainer-ConfidenceCurve
          - PartOfSpeech-ModelTrainer-HeldOutMetrics-SameDefinitions
          - PartOfSpeech-ModelTrainer-HeldOutMetrics-ParsesFormats
          - PartOfSpeech-ModelTrainer-HeldOutMetrics-Intervals
          - PartOfSpeech-ModelTrainer-HeldOutMetrics-PairedDifference
          - PartOfSpeech-ModelTrainer-HeldOutMetrics-StopConditions
          - PartOfSpeech-ModelTrainer-HeldOutMetrics-Throughput
          - PartOfSpeech-ModelTrainer-EvaluationReport-Deterministic
          - PartOfSpeech-ModelTrainer-EvaluationReport-JsonComplete
          - PartOfSpeech-ModelTrainer-EvaluationReport-NoTreebankText
          - PartOfSpeech-ModelTrainer-EvaluationReport-PerTokenDump
        tests:
          - PartOfSpeech_Evaluation_Results_RecordTheShippedModelAndInputs
          - PartOfSpeech_Evaluation_Record_StatesTheFiguresOfTheReports
          - PartOfSpeech_Evaluation_Record_ContainsNoTreebankText

  - title: API Documentation
    requirements:
      - id: PartOfSpeech-Lib-ConfidenceGuidance
        title: >-
          The documentation that is packed with the library shall recommend a strict and a balanced confidence threshold
          with the coverage and the harmful-error rate that were measured for them, state that a consumer that needs a
          low harmful rate must use one, and link to the evaluation record.
        tags: [system]
        justification: |
          A confidence is only useful with guidance on which values to trust, and a consumer that reads the packed
          reference (or an agent that works for it) never sees the repository. The thresholds and figures are copies of
          a generated record, so a test compares them with the committed selection and results, and the build asserts
          that the generated reference carries the section, the thresholds and the links, so that a threshold cannot be
          changed in one place only.
        children:
          - PartOfSpeech-ModelTrainer-ConfidenceCurve
        tests:
          - PartOfSpeech_Evaluation_ConfidenceGuidance_MatchesTheCommittedFigures
          - ApiMark_ConfidenceGuidanceDocumented

      - id: PartOfSpeech-Lib-ApiDocsPackaged
        title: >-
          The NuGet package shall contain the generated Markdown API reference of the public API, including its
          namespace overview and documented examples.
        tags: [system]
        justification: |
          Consumers, and the coding agents that work for them, learn the API from the package itself rather than from
          the repository. The reference is generated from the XML documentation comments during the build, which fails
          if a public member is undocumented; the documented examples are compiled by the test suite so that they cannot
          go stale; and the generated reference is packed under api/ so that it travels with every copy of the library.
        tests:
          - ApiMark_ApiDocsPackaged
          - PartOfSpeech_XmlDocExamples_Compile
