<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="880" height="620" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="44" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Averaged perceptron: the training loop and the averaging</text>

  <!-- Loop frame -->
  <rect x="30" y="62" width="440" height="440" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="46" y="84" font-size="13" font-weight="600" fill="#2563eb">Repeat for every token of every sentence, in every epoch</text>

  <rect x="50" y="98" width="400" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="122" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Features of the token</text>
  <text x="250" y="142" font-size="12.5" fill="#1e40af" text-anchor="middle">previous tags are the model's own earlier guesses</text>
  <line x1="250" y1="154" x2="250" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="50" y="174" width="400" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="198" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">2. Scores of the 17 tags</text>
  <text x="250" y="218" font-size="12.5" fill="#1e40af" text-anchor="middle">sum of the current weights W of the features</text>
  <line x1="250" y1="230" x2="250" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="50" y="250" width="400" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="274" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">3. Guess</text>
  <text x="250" y="294" font-size="12.5" fill="#1e40af" text-anchor="middle">the tag with the highest score; step counter t = t + 1</text>
  <line x1="250" y1="306" x2="250" y2="324" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Decision -->
  <polygon points="250,326 350,372 250,418 150,372" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="368" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">guess equals</text>
  <text x="250" y="386" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">gold tag?</text>
  <line x1="250" y1="418" x2="250" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="434" font-size="12.5" font-weight="600" fill="#334155">yes: no change</text>

  <rect x="50" y="442" width="400" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="469" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">4. Next token (the model's own tag is history)</text>

  <rect x="510" y="98" width="360" height="150" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="690" y="124" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Terms</text>
  <text x="530" y="150" font-size="12.5" fill="#334155">gold tag: the tag that the training corpus gives the token</text>
  <text x="530" y="172" font-size="12.5" fill="#334155">guess: the tag that the current weights choose</text>
  <text x="530" y="194" font-size="12.5" fill="#334155">t: the number of the current step; every token of every</text>
  <text x="530" y="212" font-size="12.5" fill="#334155">epoch is one step, with or without a mistake</text>
  <text x="530" y="234" font-size="12.5" fill="#334155">T: the total number of steps; S: the quantization factor</text>

  <!-- Mistake branch -->
  <line x1="350" y1="372" x2="508" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="364" font-size="12.5" font-weight="600" fill="#334155">no: a mistake</text>
  <rect x="510" y="296" width="360" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="690" y="322" font-size="14" font-weight="600" fill="#7f1d1d" text-anchor="middle">Update, in every feature row of the token</text>
  <text x="530" y="350" font-size="13" font-family="Consolas, monospace" fill="#7f1d1d">W[gold]  += 1     U[gold]  += t</text>
  <text x="530" y="374" font-size="13" font-family="Consolas, monospace" fill="#7f1d1d">W[guess] -= 1     U[guess] -= t</text>
  <text x="530" y="404" font-size="12.5" fill="#7f1d1d">W: the current weights. U: the sum of the steps t of</text>
  <text x="530" y="422" font-size="12.5" fill="#7f1d1d">all updates, kept to average the weights afterwards.</text>
  <path d="M690,446 L690,464 L452,464" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- After training -->
  <line x1="150" y1="502" x2="150" y2="530" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="162" y="520" font-size="12.5" font-weight="600" fill="#334155">after the last epoch (T steps in all)</text>

  <rect x="30" y="532" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="558" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Average</text>
  <text x="160" y="580" font-size="13" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">averaged = W - U / T</text>
  <text x="160" y="598" font-size="12" fill="#166534" text-anchor="middle">the mean of the weight over all T steps</text>
  <line x1="290" y1="570" x2="320" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="322" y="532" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="452" y="558" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Quantize and prune</text>
  <text x="452" y="580" font-size="13" font-family="Consolas, monospace" fill="#14532d" text-anchor="middle">round(S * averaged)</text>
  <text x="452" y="598" font-size="12" fill="#166534" text-anchor="middle">drop weights of small magnitude</text>
  <line x1="582" y1="570" x2="612" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="614" y="532" width="256" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="742" y="558" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Weights file</text>
  <text x="742" y="580" font-size="12.5" fill="#92400e" text-anchor="middle">sparse 16-bit rows plus the scale,</text>
  <text x="742" y="598" font-size="12.5" fill="#92400e" text-anchor="middle">temperature and feature groups</text>
</svg>
