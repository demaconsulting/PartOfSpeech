<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="880" height="520" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="44" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Hashed features: from feature strings to rows of weights</text>
  <text x="160" y="76" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Features of the token "valves"</text>
  <text x="420" y="76" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Hash</text>
  <text x="712" y="76" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Weight table: one row per bucket</text>

  <!-- Feature chips -->
  <rect x="30" y="92" width="260" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="117" font-size="14" font-family="Consolas, monospace" fill="#1e3a8a">Word: valves</text>
  <rect x="30" y="148" width="260" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="173" font-size="14" font-family="Consolas, monospace" fill="#1e3a8a">Suffix of 3: ves</text>
  <rect x="30" y="204" width="260" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="229" font-size="14" font-family="Consolas, monospace" fill="#1e3a8a">Previous word: bleed</text>
  <rect x="30" y="260" width="260" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="44" y="285" font-size="14" font-family="Consolas, monospace" fill="#5b21b6">Previous tag: NOUN</text>
  <rect x="30" y="316" width="260" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="341" font-size="14" font-family="Consolas, monospace" fill="#1e3a8a">Next word: .</text>
  <text x="160" y="378" font-size="13" fill="#334155" text-anchor="middle">... and the other templates</text>

  <!-- Hash box -->
  <rect x="330" y="92" width="180" height="264" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="420" y="196" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Hash function</text>
  <text x="420" y="220" font-size="12.5" fill="#334155" text-anchor="middle">template number</text>
  <text x="420" y="238" font-size="12.5" fill="#334155" text-anchor="middle">plus feature value,</text>
  <text x="420" y="256" font-size="12.5" fill="#334155" text-anchor="middle">reduced to a bucket</text>
  <text x="420" y="274" font-size="12.5" fill="#334155" text-anchor="middle">below 2^hashBits</text>

  <!-- Arrows chip to hash box -->
  <line x1="290" y1="112" x2="328" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="168" x2="328" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="224" x2="328" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="280" x2="328" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="336" x2="328" y2="336" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Rows of weights: one cell per tag, filled = a stored weight -->
  <text x="596" y="100" font-size="11.5" fill="#334155">one cell per tag (17); filled = weight stored</text>

  <text x="570" y="130" font-size="13" font-weight="600" fill="#0f172a">A</text>
  <g stroke="#475569" stroke-width="1" transform="translate(596,0) scale(0.94,1) translate(-576,0)">
    <rect x="576" y="114" width="17" height="24" fill="#ffffff"/><rect x="593" y="114" width="17" height="24" fill="#334155"/><rect x="610" y="114" width="17" height="24" fill="#ffffff"/><rect x="627" y="114" width="17" height="24" fill="#ffffff"/><rect x="644" y="114" width="17" height="24" fill="#ffffff"/><rect x="661" y="114" width="17" height="24" fill="#334155"/><rect x="678" y="114" width="17" height="24" fill="#ffffff"/><rect x="695" y="114" width="17" height="24" fill="#ffffff"/><rect x="712" y="114" width="17" height="24" fill="#ffffff"/><rect x="729" y="114" width="17" height="24" fill="#ffffff"/><rect x="746" y="114" width="17" height="24" fill="#ffffff"/><rect x="763" y="114" width="17" height="24" fill="#ffffff"/><rect x="780" y="114" width="17" height="24" fill="#334155"/><rect x="797" y="114" width="17" height="24" fill="#ffffff"/><rect x="814" y="114" width="17" height="24" fill="#ffffff"/><rect x="831" y="114" width="17" height="24" fill="#ffffff"/><rect x="848" y="114" width="17" height="24" fill="#ffffff"/>
  </g>

  <text x="570" y="186" font-size="13" font-weight="600" fill="#0f172a">B</text>
  <g stroke="#475569" stroke-width="1" transform="translate(596,0) scale(0.94,1) translate(-576,0)">
    <rect x="576" y="170" width="17" height="24" fill="#ffffff"/><rect x="593" y="170" width="17" height="24" fill="#ffffff"/><rect x="610" y="170" width="17" height="24" fill="#ffffff"/><rect x="627" y="170" width="17" height="24" fill="#334155"/><rect x="644" y="170" width="17" height="24" fill="#ffffff"/><rect x="661" y="170" width="17" height="24" fill="#ffffff"/><rect x="678" y="170" width="17" height="24" fill="#ffffff"/><rect x="695" y="170" width="17" height="24" fill="#ffffff"/><rect x="712" y="170" width="17" height="24" fill="#334155"/><rect x="729" y="170" width="17" height="24" fill="#ffffff"/><rect x="746" y="170" width="17" height="24" fill="#ffffff"/><rect x="763" y="170" width="17" height="24" fill="#ffffff"/><rect x="780" y="170" width="17" height="24" fill="#ffffff"/><rect x="797" y="170" width="17" height="24" fill="#ffffff"/><rect x="814" y="170" width="17" height="24" fill="#ffffff"/><rect x="831" y="170" width="17" height="24" fill="#ffffff"/><rect x="848" y="170" width="17" height="24" fill="#ffffff"/>
  </g>

  <text x="570" y="242" font-size="13" font-weight="600" fill="#0f172a">C</text>
  <g stroke="#475569" stroke-width="1" transform="translate(596,0) scale(0.94,1) translate(-576,0)">
    <rect x="576" y="226" width="17" height="24" fill="#ffffff"/><rect x="593" y="226" width="17" height="24" fill="#ffffff"/><rect x="610" y="226" width="17" height="24" fill="#ffffff"/><rect x="627" y="226" width="17" height="24" fill="#ffffff"/><rect x="644" y="226" width="17" height="24" fill="#334155"/><rect x="661" y="226" width="17" height="24" fill="#ffffff"/><rect x="678" y="226" width="17" height="24" fill="#ffffff"/><rect x="695" y="226" width="17" height="24" fill="#ffffff"/><rect x="712" y="226" width="17" height="24" fill="#ffffff"/><rect x="729" y="226" width="17" height="24" fill="#334155"/><rect x="746" y="226" width="17" height="24" fill="#ffffff"/><rect x="763" y="226" width="17" height="24" fill="#ffffff"/><rect x="780" y="226" width="17" height="24" fill="#ffffff"/><rect x="797" y="226" width="17" height="24" fill="#334155"/><rect x="814" y="226" width="17" height="24" fill="#ffffff"/><rect x="831" y="226" width="17" height="24" fill="#ffffff"/><rect x="848" y="226" width="17" height="24" fill="#ffffff"/>
  </g>
  <rect x="590" y="222" width="286" height="32" rx="4" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6 3"/>

  <text x="570" y="298" font-size="13" font-weight="600" fill="#0f172a">D</text>
  <g stroke="#475569" stroke-width="1" transform="translate(596,0) scale(0.94,1) translate(-576,0)">
    <rect x="576" y="282" width="17" height="24" fill="#334155"/><rect x="593" y="282" width="17" height="24" fill="#ffffff"/><rect x="610" y="282" width="17" height="24" fill="#ffffff"/><rect x="627" y="282" width="17" height="24" fill="#ffffff"/><rect x="644" y="282" width="17" height="24" fill="#ffffff"/><rect x="661" y="282" width="17" height="24" fill="#ffffff"/><rect x="678" y="282" width="17" height="24" fill="#334155"/><rect x="695" y="282" width="17" height="24" fill="#ffffff"/><rect x="712" y="282" width="17" height="24" fill="#ffffff"/><rect x="729" y="282" width="17" height="24" fill="#ffffff"/><rect x="746" y="282" width="17" height="24" fill="#ffffff"/><rect x="763" y="282" width="17" height="24" fill="#ffffff"/><rect x="780" y="282" width="17" height="24" fill="#ffffff"/><rect x="797" y="282" width="17" height="24" fill="#ffffff"/><rect x="814" y="282" width="17" height="24" fill="#334155"/><rect x="831" y="282" width="17" height="24" fill="#ffffff"/><rect x="848" y="282" width="17" height="24" fill="#ffffff"/>
  </g>
  <text x="712" y="336" font-size="13" fill="#334155" text-anchor="middle">... other rows; a bucket without a row has no weights</text>

  <!-- Arrows hash box to rows -->
  <line x1="510" y1="112" x2="562" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="168" x2="562" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="224" x2="562" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="280" x2="562" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="336" x2="562" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Collision callout -->
  <rect x="540" y="352" width="330" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="705" y="373" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Collision (dashed frame, row C)</text>
  <text x="705" y="391" font-size="12.5" fill="#92400e" text-anchor="middle">two features hash to one row and share its weights</text>

  <!-- Scoring -->
  <rect x="50" y="428" width="800" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="456" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">Score of a tag = the sum of its weights in the rows of all features of the token</text>
  <text x="450" y="480" font-size="13" fill="#1e40af" text-anchor="middle">Integer sums, one per tag; the decoder multiplies them by the scale of the model to get real scores</text>
</svg>
