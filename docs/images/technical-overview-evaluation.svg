<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="880" height="550" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="44" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Three kinds of data, three different jobs</text>

  <!-- Row A: data -->
  <rect x="30" y="68" width="260" height="134" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="92" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Training data</text>
  <text x="160" y="110" font-size="12" fill="#166534" text-anchor="middle">labels the perceptron learns from</text>
  <text x="46" y="134" font-size="12" fill="#14532d">- open corpus (train split), MASC</text>
  <text x="46" y="154" font-size="12" fill="#14532d">- silver labels written by a model</text>
  <text x="46" y="174" font-size="12" fill="#14532d">- targeted sources: imperative,</text>
  <text x="56" y="188" font-size="12" fill="#14532d">compound and technical text</text>

  <rect x="320" y="68" width="260" height="134" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="92" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Development data</text>
  <text x="450" y="110" font-size="12" fill="#1e3a8a" text-anchor="middle">used to choose; never trained on</text>
  <text x="336" y="134" font-size="12" fill="#1e3a8a">- open dev, gold v2 dev</text>
  <text x="336" y="154" font-size="12" fill="#1e3a8a">- shapes-dev: hard noun and verb</text>
  <text x="346" y="168" font-size="12" fill="#1e3a8a">shapes, in several tranches</text>
  <text x="336" y="188" font-size="12" fill="#1e3a8a">- UD English-EWT dev (local only)</text>

  <rect x="610" y="68" width="260" height="134" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="740" y="92" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Held-out data</text>
  <text x="740" y="110" font-size="12" fill="#92400e" text-anchor="middle">used to report; never to choose</text>
  <text x="626" y="134" font-size="12" fill="#92400e">- open test, gold v2 test</text>
  <text x="626" y="154" font-size="12" fill="#92400e">- shape probe, challenge set</text>
  <text x="626" y="174" font-size="12" fill="#92400e">- UD English-EWT test (local only)</text>

  <line x1="160" y1="202" x2="160" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="202" x2="450" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="202" x2="740" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row B: process -->
  <rect x="30" y="232" width="260" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="160" y="256" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">1. Train</text>
  <text x="160" y="278" font-size="12" fill="#334155" text-anchor="middle">integer averaged perceptron,</text>
  <text x="160" y="296" font-size="12" fill="#334155" text-anchor="middle">fixed seed: the same inputs give</text>
  <text x="160" y="314" font-size="12" fill="#334155" text-anchor="middle">the same weights, bit for bit</text>

  <rect x="320" y="232" width="260" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="450" y="256" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">2. Select and freeze</text>
  <text x="450" y="278" font-size="12" fill="#334155" text-anchor="middle">settings, feature groups, temperature</text>
  <text x="450" y="296" font-size="12" fill="#334155" text-anchor="middle">and thresholds, by rules written</text>
  <text x="450" y="314" font-size="12" fill="#334155" text-anchor="middle">before the runs</text>

  <rect x="610" y="232" width="260" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="740" y="256" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">3. Evaluate once (the gate)</text>
  <text x="740" y="278" font-size="12" fill="#334155" text-anchor="middle">runs only with the committed selection</text>
  <text x="740" y="296" font-size="12" fill="#334155" text-anchor="middle">of this exact model; refuses to run</text>
  <text x="740" y="314" font-size="12" fill="#334155" text-anchor="middle">again once the results exist</text>

  <line x1="160" y1="328" x2="160" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="328" x2="450" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="328" x2="740" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row C: results -->
  <rect x="30" y="372" width="260" height="80" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="160" y="398" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Candidate weights</text>
  <text x="160" y="420" font-size="12" fill="#334155" text-anchor="middle">scored on development data only</text>

  <rect x="320" y="372" width="260" height="80" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="450" y="398" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Frozen model</text>
  <text x="450" y="420" font-size="12" fill="#334155" text-anchor="middle">weights, temperature and thresholds,</text>
  <text x="450" y="438" font-size="12" fill="#334155" text-anchor="middle">with the hash of the model</text>

  <rect x="610" y="372" width="260" height="80" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="740" y="398" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Held-out results</text>
  <text x="740" y="420" font-size="12" fill="#334155" text-anchor="middle">reported as produced, with every</text>
  <text x="740" y="438" font-size="12" fill="#334155" text-anchor="middle">failed stop condition disclosed</text>

  <!-- Hand-over arrows between columns -->
  <path d="M290,412 L305,412 L305,300 L318,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M580,412 L595,412 L595,300 L608,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="474" font-size="12" fill="#334155" text-anchor="middle">compared and chosen in step 2</text>
  <text x="450" y="474" font-size="12" fill="#334155" text-anchor="middle">frozen before step 3 starts</text>

  <!-- Leakage bar -->
  <rect x="30" y="492" width="840" height="44" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="512" font-size="13" font-weight="600" fill="#7f1d1d" text-anchor="middle">Leakage checks across all three kinds of data</text>
  <text x="450" y="528" font-size="12" fill="#7f1d1d" text-anchor="middle">no document and no sentence of the training data may appear in any development or held-out set</text>
</svg>
