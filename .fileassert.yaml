---
# FileAssert document validation tests for PartOfSpeech.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: api-docs, package-docs, build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: api-docs tests provide OTS evidence for ApiMark and run in the build matrix job,
# immediately after the build that produces the generated API reference. package-docs tests
# assert the packed .nupkg and run in the same job, immediately after the package is created.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.

tests:

  # --- API REFERENCE ---
  # ApiMark generates the API reference from the package's XML doc comments during the build,
  # into the project's generated/api folder. These tests assert the real generated output.

  - name: ApiMark_ApiIndex
    description: "PartOfSpeech API reference index was generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/api.md"
        count: 1
        text:
          - contains: "DemaConsulting.PartOfSpeech"

  - name: ApiMark_ExampleCodeRendered
    description: "ApiMark rendered a documented example as a fenced code block"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Tagger.md"
        count: 1
        text:
          - contains: "```csharp"
          - contains: "Tagger.Load"

  - name: ApiMark_TerminologyDocumented
    description: "The shared terminology and explanations of the namespace documentation survive into the API reference"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech.md"
        count: 1
        text:
          - contains: "UPOS"
          - contains: "confidence"
          - contains: "lexicon"
          - contains: "constraint"
          - contains: "greedy"
          - contains: "temperature"
          - contains: "## Terminology"
          - contains: "## Confidence and alternatives"
          - contains: "## Confidence thresholds"
          - contains: "## Glossary"
          - contains: "## Glossary modes: hard and soft"
          - contains: "## Glossary navigation"
          - contains: "## Glossary edge cases"
          - contains: "## Glossary costs"
          - contains: "## Glossary quick start"
          - contains: "## Tokenization conventions"
          - contains: "## Offsets and pre-tokenized input"
          - contains: "## Default model and loading cost"
          - contains: "## Errors"

  - name: ApiMark_ConfidenceGuidanceDocumented
    description: "The packed API reference carries the confidence guidance: thresholds, advice and evaluation links"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech.md"
        count: 1
        text:
          - contains: "## Confidence thresholds"
          - contains: "strict"
          - contains: "balanced"
          - contains: "0.95"
          - contains: "0.80"
          - contains: "must use a threshold"
          - contains: "github.com/demaconsulting/PartOfSpeech/blob/main/docs/evaluation/confidence-thresholds.md"
          - contains: "github.com/demaconsulting/PartOfSpeech/blob/main/docs/evaluation/test-results.md"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/TaggedToken/Confidence.md"
        count: 1
        text:
          - contains: "DemaConsulting.PartOfSpeech.md#confidence-thresholds"

  - name: ApiMark_EntryPointDocumented
    description: "The tagger entry point is documented with thread safety, exceptions, examples and explanation links"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Tagger.md"
        count: 1
        text:
          - contains: "Thread safety"
          - contains: "InvalidDataException"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Tagger/Tag.md"
        count: 1
        text:
          - contains: "ArgumentNullException"
          - contains: "```csharp"
          - contains: "TokenConstraint.Only(Upos.Noun)"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Tagger/Load.md"
        count: 1
        text:
          - contains: "may be disposed"
          - contains: "InvalidDataException"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/TaggedToken/Confidence.md"
        count: 1
        text:
          - contains: "DemaConsulting.PartOfSpeech.md#confidence-and-alternatives"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Tokenizer.md"
        count: 1
        text:
          - contains: "n't"
          - contains: "CONVENTIONS.md"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/TokenConstraint.md"
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_GlossaryDocumented
    description: "The glossary types are documented with examples, thread safety and their use with the tagger"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Glossary.md"
        count: 1
        text:
          - contains: "```csharp"
          - contains: "Thread safety"
          - contains: "bleed valve"
          - contains: "WithHead"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/GlossaryBuilder.md"
        count: 1
        text:
          - contains: "```csharp"
          - contains: "Thread safety"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/GlossaryBuilder/Add.md"
        count: 1
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/GlossaryEntry.md"
        count: 1
        text:
          - contains: "```csharp"
          - contains: "WithHead"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/GlossaryOptions.md"
        count: 1
        text:
          - contains: "```csharp"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/GlossaryMatch.md"
        count: 1
        text:
          - contains: "```csharp"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/GlossaryMode.md"
        count: 1
        text:
          - contains: "Soft"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/Tagger/Tag.md"
        count: 1
        text:
          - contains: "Glossary"
      - pattern: "src/DemaConsulting.PartOfSpeech/generated/api/DemaConsulting.PartOfSpeech/TaggedToken/Glossary*.md"
        count: 1

  # --- PACKAGE CONTENTS ---
  # The packed .nupkg must carry the generated API reference under api/, so that a consumer
  # receives the documentation with the library. These tests run after 'dotnet pack'.

  - name: ApiMark_ApiDocsPackaged
    description: "The NuGet package contains the generated API reference"
    tags: [package-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/bin/Release/DemaConsulting.PartOfSpeech.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.PartOfSpeech"
            - pattern: "api/DemaConsulting.PartOfSpeech/Tagger.md"
              min: 1
              max: 1
              text:
                - contains: "```csharp"
            - pattern: "api/DemaConsulting.PartOfSpeech/Glossary.md"
              min: 1
              max: 1
              text:
                - contains: "```csharp"
            - pattern: "api/DemaConsulting.PartOfSpeech.md"
              min: 1
              max: 1
              text:
                - contains: "UPOS"

  - name: Package_LicenseFilesPackaged
    description: "The package carries its license and notices at the root and names the license file"
    tags: [package-docs]
    files:
      - pattern: "src/DemaConsulting.PartOfSpeech/bin/Release/DemaConsulting.PartOfSpeech.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "PACKAGE-LICENSE.md"
              min: 1
              max: 1
              text:
                - contains: "SPDX-License-Identifier: MIT AND CC-BY-4.0 AND CC-BY-3.0-US"
                - contains: "CC BY 3.0 US"
                - contains: "THIRD-PARTY-NOTICES.md"
            - pattern: "THIRD-PARTY-NOTICES.md"
              min: 1
              max: 1
              text:
                - contains: "weights.bin"
                - contains: "Creative Commons Attribution 3.0 United States"
            - pattern: "DemaConsulting.PartOfSpeech.nuspec"
              min: 1
              max: 1
              text:
                - contains: 'type="file">PACKAGE-LICENSE.md</license>'

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/PartOfSpeech Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "Part Of Speech"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"

