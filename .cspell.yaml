---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - apimark
  - buildmark
  - DEMA
  - Dema
  - FileAssert
  - fileassert
  - xunit
  - Pandoc
  - Qube
  - reqstream
  - reviewmark
  - Sarif
  - SARIF
  - sarifmark
  - sonarmark
  - sysml
  - versionmark
  - Weasy
  - WeasyPrint
  - weasyprint
  - netstandard
  - mscorlib
  # Model file formats and scoring terms of the tagger API documentation (POSW weights file, POSL lexicon file)
  - POSW
  - POSL
  - softmax
  # Binary format and C# terms of the design documents (LEB128 variable-length integers, a keyword, quote characters)
  - varint
  - varints
  - stackalloc
  - guillemets
  - Artagnan
  - yamlfix
  # Part-of-speech and corpus terms (Universal POS tags, Penn Treebank tags, corpus and dictionary names)
  - ADJP
  - adposition
  - ADVP
  - allwords
  - CCONJ
  - clitic
  - clitics
  - compileall
  - conllu
  - disfluencies
  - ficlets
  - hashlib
  - HYPH
  - INTJ
  - multiword
  - nmod
  - NNPS
  - ONNX
  - oewn
  - OANC
  - PROPN
  - PUNCT
  - SBAR
  - SCONJ
  - treebank
  - UPOS
  - WHADVP
  - WHNP
  - wordsense
  # Names of datasets, organizations and people credited in the data documentation and notices
  - Christiane
  - Fellbaum
  - LREC
  - Moby
  - NOAA
  - Passonneau
  - pbio
  - Rebecca
  - Tatoeba
  - USGS
  - slnx
  - SemCor
  - McCrae
  - WNDB
  - venv
  - pycache
  # Runtime environment variable of the throughput tests that detect a profiler (CORECLR_ENABLE_PROFILING)
  - CORECLR
  # Terms of the trainer tool: per-mille sampling shares, bijective mixing of the random generator, memberwise copies
  - permille
  - subsampling
  - bijective
  - memberwise
  - treebanks
# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
  # Generated coverage report: it lists arbitrary spellings of the data sets, which are not words to check
  - data/lexicon/COVERAGE.md
