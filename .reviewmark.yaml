---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "THIRD-PARTY-NOTICES.md"      # Third-party attribution and license notices (packed in the NuGet package)
  - "PACKAGE-LICENSE.md"          # License of the NuGet package: MIT code and CC BY data (packed in the package)
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "tools/DemaConsulting.PartOfSpeech.Trainer/**/*.md"    # Trainer documentation and run log
  - "tools/DemaConsulting.PartOfSpeech.Trainer/training.json"  # The selected training configuration
  - "docs/evaluation/**/*.md"     # Evaluation record: confidence thresholds and held-out results
  - "docs/evaluation/**/*.json"   # Evaluation record: selection artifact and run-once results
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"  # Verification documentation files
  - "docs/user_guide/**/*.md"    # User guide documentation
  - "docs/sysml2/**/*.sysml"     # SysML2 architecture model
  - "tools/data/**/*.py"         # Build-time Python tools of the data assets, and their tests
  - "tools/data/README.md"       # Documentation of the data tools
  - "tools/data/tests/status-cases.tsv"  # Shared parity cases of the corpus status cell (Python and C# tests)
  - "tools/data/tests/corrections-cases.tsv"  # Shared row cases of the corrections overlay (Python and C# tests)
  - "tools/data/tests/candidate-cases.tsv"  # Shared candidate row cases of the overlay (Python and C# tests)
  - "tools/data/tests/convention-cases.tsv"  # Fixture sentences of the convention rules
  - "data/CONVENTIONS.md"        # Normative labeling conventions, formats and mapping tables of the data
  - "data/README.md"             # Documentation of the data folder
  - "data/corrections/README.md"  # Format, states, rule catalog and precision record of the staged corrections
  - "data/corrections/*.tsv"      # The staged correction tables (generated; reviewers read and approve the rows)
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!**/generated/**"            # Exclude generated documentation (API reference)
  - "!node_modules/**"           # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment
  - "!tools/data/cache/**"       # Exclude the git-ignored download cache of the data tools
  - "!**/__pycache__/**"         # Exclude compiled Python files

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/PartOfSpeech/reviews/index.json

# Global context shown to every reviewer for orientation (not fingerprinted).
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"                              # exclude design intro from user-facing review
    paths:
      - "README.md"                                                 # project readme
      - "THIRD-PARTY-NOTICES.md"                                    # third-party attribution and license notices
      - "PACKAGE-LICENSE.md"                                        # license of the NuGet package
      - "docs/user_guide/**/*.md"                                   # user guide

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that PartOfSpeech Decomposition Addresses the Stated Purpose
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "requirements.yaml"                                         # root requirements file
      - "docs/design/introduction.md"                               # design introduction
      - "docs/sysml2/**/*.sysml"                                    # SysML2 model (authoritative structure)

  # PartOfSpeech-Architecture Review (one per system)
  - id: PartOfSpeech-Architecture
    title: Review that PartOfSpeech Architecture Satisfies Requirements
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/part-of-speech.yaml"                      # system requirements
      - "docs/design/introduction.md"                                           # design introduction
      - "docs/design/part-of-speech.md"                               # system design
      - "docs/verification/introduction.md"                                    # verification introduction
      - "docs/verification/part-of-speech.md"                        # system verification
      - "test/DemaConsulting.PartOfSpeech.Tests/PartOfSpeechTests.cs"  # integration tests
      - "test/DemaConsulting.PartOfSpeech.Tests/PartOfSpeechThroughputTests.cs"  # throughput test
      - "test/DemaConsulting.PartOfSpeech.Tests/PartOfSpeechDataTests.cs"  # data and licensing tests
      - "test/DemaConsulting.PartOfSpeech.Tests/PartOfSpeechEvaluationTests.cs"  # evaluation record and guidance tests
      - "test/DemaConsulting.PartOfSpeech.Tests/DataFiles.cs"          # data file helpers of the data tests

  # PartOfSpeech-Design Review (one per system)
  - id: PartOfSpeech-Design
    title: Review that PartOfSpeech Design is Consistent and Complete
    context:
      - "docs/reqstream/part-of-speech.yaml"
    paths:
      - "docs/reqstream/part-of-speech/platform-requirements.yaml"  # platform requirements
      - "docs/design/introduction.md"                                       # design introduction
      - "docs/design/part-of-speech.md"                           # system design
      - "docs/design/part-of-speech/**/*.md"                      # all system design documents
      - "docs/design/ots.md"                                                # OTS overview

