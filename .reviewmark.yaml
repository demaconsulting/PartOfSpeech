      - "tools/data/common.py"                                      # shared helpers, tokenization, lexicon rules
      - "tools/data/leakage.py"                                     # evaluation universe and leakage rule
      - "tools/data/import_open.py"                                 # open corpus import
      - "tools/data/import_eval.py"                                 # evaluation set import
      - "tools/data/import_masc.py"                                 # MASC conversion to UPOS
      - "tools/data/import_silver.py"                               # silver data derivation
      - "tools/data/fetch_ud_ewt.py"                                # UD English-EWT fetch (cache only)
      - "tools/data/build_lexicon.py"                               # lexicon build
      - "tools/data/shapes_dev.py"                                  # shapes dev set builder (blind labeling)
      - "tools/data/tests/test_common.py"                           # tests of the shared helpers
      - "tools/data/tests/test_shapes_dev.py"                       # tests of the development set builder
      - "tools/data/tests/status-cases.tsv"                         # shared parity cases of the status cell
      - "tools/data/tests/test_masc.py"                             # tests of the MASC mapping
      - "tools/data/tests/test_silver_lexicon.py"                   # tests of the silver derivation and lexicon rules

