    context:
      - "docs/design/part-of-speech.md"
      - "docs/reqstream/part-of-speech.yaml"
      - "tools/data/common.py"
      - "tools/data/leakage.py"
    paths:
      - "tools/data/check_leakage.py"                               # leakage check and report
      - "tools/data/check_lexicon.py"                               # lexicon coverage gate
      - "tools/data/check_licenses.py"                              # license and restricted-file scan
      - "tools/data/make_manifest.py"                               # checksum manifest
      - "tools/data/normalize_eol.py"                               # line-ending normalization
      - "tools/data/tests/test_committed_data.py"                   # sanity checks of the committed data

  # PartOfSpeech-DataCorrections Review (build-time tools that stage and lint corpus corrections)
  - id: PartOfSpeech-DataCorrections
    title: Review that PartOfSpeech Corrections Tools Implement the Documented Conventions
    context:
      - "docs/design/part-of-speech.md"
      - "docs/reqstream/part-of-speech.yaml"
      - "tools/data/common.py"
    paths:
      - "data/CONVENTIONS.md"                                       # normative conventions and overlay format
      - "data/corrections/README.md"                                # staged corrections: format, states, rule catalog
      - "data/corrections/*.tsv"                                    # staged tables (mechanical, adjudicated, ...)
      - "tools/data/README.md"                                      # tools documentation
      - "tools/data/corrections.py"                                 # overlay tables: validation, apply and reverse
      - "tools/data/convention_rules.py"                            # rule registry: mechanical and check rules
      - "tools/data/convention_candidates.py"                       # detectors of the cases that need judgment
      - "tools/data/check_conventions.py"                           # conventions linter
      - "tools/data/make_corrections.py"                            # generator of the staged tables
      - "tools/data/adjudicate.py"                                  # adjudication of the candidates
      - "tools/data/tests/corrections_testdata.py"                  # miniature data folder of the tests
      - "tools/data/tests/test_corrections_overlay.py"              # tests of the overlay
      - "tools/data/tests/test_corrections_rules.py"                # tests of the rules and their guards
      - "tools/data/tests/test_corrections_linter.py"               # tests of the linter
      - "tools/data/tests/test_corrections_generator.py"            # tests of the generator and the committed tables
      - "tools/data/tests/test_corrections_adjudication.py"         # tests of the adjudication tool
      - "tools/data/tests/run_trx.py"                               # runner of the Python tests that writes TRX
      - "tools/data/tests/test_corrections_runner.py"               # tests of that runner
      - "tools/data/tests/convention-cases.tsv"                     # fixture sentences of the rules
      - "tools/data/tests/corrections-cases.tsv"                    # shared row cases of the overlay
      - "tools/data/tests/candidate-cases.tsv"                      # shared candidate row cases of the overlay

